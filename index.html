<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vocabify — SAT/IELTS Vocabulary Trainer</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --emerald: #10b981;
    --amber: #f59e0b;
    --newgray: #e5e7eb;
    --blue: #2563eb;
  }

  * { box-sizing: border-box; }

  html, body {
    background-color: #f8fafc;
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .font-display { font-family: 'Lexend', 'Inter', ui-sans-serif, sans-serif; }

  ::selection { background: #bfdbfe; color: #1e3a8a; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.94); }
    100% { opacity: 1; transform: scale(1); }
  }
  .animate-pop { animation: popIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }

  @keyframes shimmerRing {
    0% { stroke-dashoffset: var(--circ); }
    100% { stroke-dashoffset: var(--offset); }
  }

  @keyframes pulseSoft {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .animate-pulse-soft { animation: pulseSoft 1.6s ease-in-out infinite; }

  @keyframes shakeX {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .animate-shake { animation: shakeX 0.5s cubic-bezier(.36,.07,.19,.97) both; }

  /* ---------- 3D Flashcard flip ---------- */
  .flip-scene {
    perspective: 1800px;
  }
  .flip-card {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.55s cubic-bezier(0.45, 0.05, 0.15, 1);
    transform-style: preserve-3d;
  }
  .flip-card.is-flipped {
    transform: rotateY(180deg);
  }
  .flip-face {
    position: absolute;
    inset: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
  }
  .flip-face-back {
    transform: rotateY(180deg);
  }

  .card-shadow {
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px -8px rgba(15, 23, 42, 0.10), 0 24px 64px -20px rgba(15, 23, 42, 0.12);
  }
  .card-shadow-lg {
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04), 0 20px 48px -12px rgba(15, 23, 42, 0.14), 0 32px 80px -16px rgba(15, 23, 42, 0.14);
  }

  .grain-texture {
    background-image: radial-gradient(circle at 1px 1px, rgba(15,23,42,0.035) 1px, transparent 0);
    background-size: 18px 18px;
  }

  .segbar-seg { transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); }

  .btn-press { transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease, border-color 0.15s ease; }
  .btn-press:active { transform: scale(0.96); }

  .hover-lift { transition: transform 0.22s cubic-bezier(0.16,1,0.3,1), box-shadow 0.22s cubic-bezier(0.16,1,0.3,1), border-color 0.22s ease; }
  .hover-lift:hover { transform: translateY(-3px); }

  .focus-ring:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px #f8fafc, 0 0 0 4px var(--blue);
  }

  .kbd {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 6px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    color: #475569;
    box-shadow: 0 1px 0 #cbd5e1;
  }

  .tag-verb { background: #eef2ff; color: #4338ca; border: 1px solid #e0e7ff; }
  .tag-other { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
  .tag-prep { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }

  .status-mastered { background: rgba(16,185,129,0.1); color: #047857; border: 1px solid rgba(16,185,129,0.2); }
  .status-learning { background: rgba(245,158,11,0.1); color: #b45309; border: 1px solid rgba(245,158,11,0.25); }
  .status-new { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

  .bg-noise-blue {
    background: radial-gradient(120% 120% at 15% 0%, #eff6ff 0%, #f8fafc 45%);
  }

  .letter-tight { letter-spacing: -0.02em; }
  .letter-tighter { letter-spacing: -0.035em; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .match-tile { transition: transform 0.18s cubic-bezier(0.16,1,0.3,1), box-shadow 0.18s ease, background-color 0.18s ease, border-color 0.18s ease, opacity 0.3s ease; }
  .match-tile.correct-pop { animation: matchCorrect 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes matchCorrect {
    0% { transform: scale(1); }
    35% { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 0; }
  }
</style>
</head>

:"Uncommon, strange","example":"His eccentric habit of wearing socks over his shoes made people think he was either a genius or just really confused","antonym":"Conventional"},{"id":"college-panda-s1-mired","word":"Mired","pos":"OTHER","definition":"Stuck in mud","example":"She was so mired in paperwork that even a bulldozer wouldn’t be able to dig her out of her office.","antonym":"Free"},{"id":"college-panda-s1-colloquial","word":"Colloquial","pos":"OTHER","definition":"Used in casual conversation","example":"His speech was so full of colloquial slang that even his grandma said, “Bruh, I don’t understand you.”","antonym":"Formal"},{"id":"college-panda-s1-reconcile","word":"Reconcile","pos":"OTHER","definition":"Settle one’s differences, make compatible, bring back to peace","example":"They finally reconciled after their epic debate over whether pineapple belongs on pizza. Spoiler: It doesn’t","antonym":"Estrange"},{"id":"college-panda-s1-alienate","word":"Alienate","pos":"VERB","definition":"To cause someone to feel isolated or lonely","example":"His decision to start every conversation with a detailed history of traffic lights quickly alienated all his friends","antonym":"Befriend"},{"id":"college-panda-s1-distinguish","word":"Distinguish","pos":"VERB","definition":"To tell the difference between","example":"He could barely distinguish between his identical twin brothers until one started wearing neon green socks every day.","antonym":"Confuse"},{"id":"college-panda-s1-adequate","word":"Adequate","pos":"OTHER","definition":"Sufficient, enough, acceptable","example":"His cooking skills were adequate—let’s just say the fire alarm got a workout, but the pizza wasn’t that burnt.","antonym":"Inadequate"},{"id":"college-panda-s1-contend","word":"Contend","pos":"VERB","definition":"1) To deal with someone or something 2) To claim or state a belief confidently","example":"He contended with his alarm clock every morning as if it was a fierce battle between sleep and reality.","antonym":"Surrender"},{"id":"college-panda-s1-skeptical","word":"Skeptical","pos":"OTHER","definition":"Having doubts","example":"She was skeptical about the “miracle” face cream that claimed to make her look 20 years younger overnight.","antonym":"Trusting"},{"id":"college-panda-s1-enfranchise","word":"Enfranchise","pos":"VERB","definition":"To give the right to vote","example":"The town held a parade to celebrate when they finally enfranchised the local raccoons… though they immediately voted for more trash cans.","antonym":"Disenfranchise, enslave"},{"id":"college-panda-s1-sophisticated","word":"Sophisticated","pos":"OTHER","definition":"1) Having a lot of worldly experience and knowledge 2) Complicated","example":"His sophisticated taste in cheese made him the only person who actually knew what “gorgonzola” was at the party.","antonym":"naive"},{"id":"college-panda-s1-radical","word":"Radical","pos":"OTHER","definition":"1) Thorough, complete, extensive 2) Fundamental, essential 3) Revolutionary, extreme","example":"His radical idea to solve all the world’s problems by making every Friday “Free Ice Cream Day” was met with mixed reviews, mostly from lactose-intolerant folks","antonym":"Conservative"},{"id":"college-panda-s1-formulate","word":"Formulate","pos":"VERB","definition":"To create or think up","example":"She formulated a foolproof plan to sneak past her dog—step one: tiptoe; step two: realize dogs can hear everything","antonym":"Destroy"},{"id":"college-panda-s1-attest","word":"Attest","pos":"VERB","definition":"To confirm or verify","example":"He could attest to the fact that eating 10 tacos in one sitting was not a good life decision.","antonym":"Deny"},{"id":"college-panda-s1-vexing","word":"Vexing","pos":"OTHER","definition":"Annoying, irritating","example":"The constant buzzing of the fly around his head was so vexing that he considered giving it a name just to yell at it properly.","antonym":"Pleasing"},{"id":"college-panda-s1-unassuming","word":"Unassuming","pos":"OTHER","definition":"Humble, low-key","example":"The unassuming librarian turned out to be a ninja in her free time, proving you can’t judge a book by its cover","antonym":"Arrogant"},{"id":"college-panda-s1-coerce","word":"Coerce","pos":"VERB","definition":"To pressure or force someone to do something","example":"He coerced his little brother into trading his chocolate bar for a carrot by promising it was “just as tasty.” It wasn’t.","antonym":"Persuade (gently)"},{"id":"college-panda-s1-adept","word":"Adept","pos":"OTHER","definition":"Very skilled at something","example":"She was so adept at parallel parking that she could fit a bus into a space meant for a bicycle.","antonym":"Inept, mediocre, amateur"}]},{"id":"college-panda-set-2","index":2,"name":"Set 2","words":[{"id":"college-panda-s2-eloquent","word":"Eloquent","pos":"OTHER","definition":"Fluent or persuasive in speaking or writing","example":"His speech was so eloquent that even his dog stopped barking just to listen","antonym":"Inarticulate, dullness"},{"id":"college-panda-s2-austere","word":"Austere","pos":"OTHER","definition":"Plain and without decoration, comforts, or anything extra","example":"Her living room was so austere that the only decoration was a single chair—perfect for minimalist extreme sports.","antonym":"Ornate, Luxurious"},{"id":"college-panda-s2-dread","word":"Dread","pos":"VERB","definition":"To fear, be afraid of","example":"He dreaded his mom’s reaction to the broken vase, but he blamed the wind—inside the house.","antonym":"Welcome, Anticipate"},{"id":"college-panda-s2-inevitable","word":"Inevitable","pos":"OTHER","definition":"Unavoidable","example":"It was inevitable that he would trip while texting and walking, as everyone saw it coming—except him","antonym":"Avoidable, Uncertain"},{"id":"college-panda-s2-to-stress","word":"To Stress","pos":"VERB","definition":"To emphasize","example":"She stressed the importance of cleaning the room, but it still looked :"OTHER","definition":"New and different","example":"His innovative way of organizing his closet involved attaching his shirts to a ceiling fan—one quick spin, and he was dressed","antonym":"Unoriginal, Traditional"},{"id":"college-panda-s2-tangible","word":"Tangible","pos":"OTHER","definition":"Real and able to be shown or touched","example":"The excitement in the room was so tangible, you could practically high-five it.","antonym":"Intangible, Abstract"},{"id":"college-panda-s2-disseminate","word":"Disseminate","pos":"VERB","definition":"To spread widely (particularly information)","example":"He tried to disseminate the news about the school trip, but it somehow turned into a rumor about a school-wide pizza party","antonym":"Conceal, Contain"},{"id":"college-panda-s2-delegate-verb","word":"Delegate (verb)","pos":"VERB","definition":"To assign a task to another person","example":"He delegated the dishwashing duty to his little brother, but somehow the dishes were still dirty, and the brother was missing","antonym":"Retain, Withhold"},{"id":"college-panda-s2-apparent","word":"Apparent","pos":"OTHER","definition":"Clearly visible or understood; obvious","example":"It became apparent that he had no idea how to assemble the furniture when the bookshelf started resembling a chair","antonym":"Hidden, Obscure"},{"id":"college-panda-s2-postulate","word":"Postulate","pos":"VERB","definition":"To suggest or propose something","example":"He postulated that pizza should be considered a vegetable, which earned him both laughs and several high-fives","antonym":"Reject, Deny"},{"id":"college-panda-s2-speculate","word":"Speculate","pos":"VERB","definition":"To guess, to form a theory without firm evidence","example":"He speculated that his lost sock had fallen into a black hole because where else could it have gone?","antonym":"Prove, Verify"},{"id":"college-panda-s2-bazaar","word":"Bazaar","pos":"OTHER","definition":"A market selling a large variety of goods","example":"The bazaar had everything from handmade rugs to pet unicorn horns—for cats, of course.","antonym":"Boutique, Supermarket"},{"id":"college-panda-s2-sporadic","word":"Sporadic","pos":"OTHER","definition":"Scattered, irregular, unpredictable","example":"His sporadic attempts to clean his room usually started strong and ended with him watching TV in the mess","antonym":"Consistent, Regular"},{"id":"college-panda-s2-suffrage","word":"Suffrage","pos":"OTHER","definition":"The right to vote","example":"She celebrated when women gained suffrage by voting for the cutest puppy in the election for “Pet of the Year.”","antonym":"Disenfranchisement, Disqualification"},{"id":"college-panda-s2-incredulous","word":"Incredulous","pos":"OTHER","definition":"Unwilling or unable to believe something","example":"He was incredulous when his cat finally learned how to fetch. “Next up,” he said, “playing the piano.”","antonym":"Believing, Gullible"},{"id":"college-panda-s2-idealistic","word":"Idealistic","pos":"OTHER","definition":"Unrealistically aiming for perfection","example":"His idealistic goal of becoming a world-class chef in a week ended when he burned toast—three times in a row","antonym":"Realistic, Pragmatic"},{"id":"college-panda-s2-conflate","word":"Conflate","pos":"VERB","definition":"To mix or combine into one (typically ideas)","example":"He conflated his birthday party with Halloween, so everyone showed up in costumes to celebrate his “vampire cake.”","antonym":"Separate, Divide"}]},{"id":"college-panda-set-3","index":3,"name":"Set 3","words":[{"id":"college-panda-s3-paucity","word":"Paucity","pos":"OTHER","definition":"Poverty, scarcity","example":"The paucity of snacks at the party led to a fierce competition over the last slice of pizza","antonym":"Abundance, Plentifulness"},{"id":"college-panda-s3-ephemeral","word":"Ephemeral","pos":"OTHER","definition":"Temporary, short-lived","example":"His enthusiasm for working out was ephemeral—lasting just long enough to post about it on social media","antonym":"Permanent, Lasting"},{"id":"college-panda-s3-prompt","word":"Prompt","pos":"VERB","definition":"To cause (someone) to take a course of action","example":"The sight of chocolate cake promptly caused him to break his diet with zero hesitation","antonym":"Discourage, Deter"},{"id":"college-panda-s3-reverence","word":"Reverence","pos":"OTHER","definition":"Deep respect for someone or something","example":"He showed great reverence for his grandma’s cooking, bowing before every plate of lasagna like it was a royal feast","antonym":"Disrespect, Scorn"},{"id":"college-panda-s3-disparity","word":"Disparity","pos":"OTHER","definition":"A great difference","example":"The disparity between his baking skills and his sister’s was obvious when his cookies looked like rocks and hers like art","antonym":"Similarity, Equality"},{"id":"college-panda-s3-dispassionate","word":"Dispassionate","pos":"OTHER","definition":"Not influenced by strong emotion, fair-minded","example":"As the judge, she remained dispassionate, even when the defendant made a very emotional argument about losing his last donut","antonym":"Emotional, Biased"},{"id":"college-panda-s3-phenomenon","word":"Phenomenon","pos":"OTHER","definition":"A noteworthy occurrence or situation","example":"The sudden appearance of a double rainbow after the storm was such a phenomenon that everyone stopped to take selfies with it","antonym":"Ordinary, Normality"},{"id":"college-panda-s3-boast","word":"Boast","pos":"VERB","definition":"To brag, to show off","example":"He boasted so much about his new car that his friends started pretending they couldn’t hear him","antonym":"Humble, Conceal"},{"id":"college-panda-s3-irksome","word":"Irksome","pos":"OTHER","definition":"Irritating, annoying","example":"The irksome sound of his neighbor’s endless lawn mowing made him wish grass would just stop growing","antonym":"Pleasant, Agreeable"},{"id":"college-panda-s3-allude","word":"Allude","pos":"VERB","definition":"T 9-fallacious","word":"Fallacious","pos":"OTHER","definition":"Based on a mistaken belief","example":"The argument was fallacious and misleading.","antonym":"Logical"},{"id":"ivy-global-s19-fallacy","word":"Fallacy","pos":"OTHER","definition":"A false or mistaken idea","example":"The belief that vaccines cause autism is a fallacy.","antonym":"Truth"},{"id":"ivy-global-s19-fraudulent","word":"Fraudulent","pos":"OTHER","definition":"Dishonest or deceptive","example":"The fraudulent scheme cost investors millions.","antonym":"Honest"},{"id":"ivy-global-s19-furtive","word":"Furtive","pos":"OTHER","definition":"Attempting to avoid notice or attention","example":"She gave him a furtive glance as she passed.","antonym":"Open"},{"id":"ivy-global-s19-incredulous-incredulity","word":"Incredulous, Incredulity","pos":"OTHER","definition":"Unwilling to believe something","example":"She was incredulous when she heard the shocking news.","antonym":"Trusting"},{"id":"ivy-global-s19-indeterminate","word":"Indeterminate","pos":"OTHER","definition":"Not exactly known, established, or defined","example":"The cause of the accident is still indeterminate.","antonym":"Certain"},{"id":"ivy-global-s19-inscrutable","word":"Inscrutable","pos":"OTHER","definition":"Impossible to understand or interpret","example":"His inscrutable expression made it hard to tell what he was thinking.","antonym":"Transparent"},{"id":"ivy-global-s19-irony-ironic","word":"Irony, Ironic","pos":"OTHER","definition":"The use of words to convey a meaning that is opposite of its literal meaning","example":"It was ironic that the fire station burned down.","antonym":"Sincerity"},{"id":"ivy-global-s19-ostensible","word":"Ostensible","pos":"OTHER","definition":"Appearing to be true, but not necessarily so","example":"The ostensible reason for his absence was illness.","antonym":"Real"},{"id":"ivy-global-s19-plausible-plausibility","word":"Plausible, Plausibility","pos":"OTHER","definition":"Seeming reasonable or probable","example":"His explanation for the mistake seemed plausible.","antonym":"Improbable"},{"id":"ivy-global-s19-pretext","word":"Pretext","pos":"OTHER","definition":"A reason given in justification that is not the real reason","example":"He used the meeting as a pretext to leave work early.","antonym":"Truth"},{"id":"ivy-global-s19-prevaricator","word":"Prevaricator","pos":"OTHER","definition":"A person who speaks falsely; a liar","example":"The prevaricator twisted the truth to suit his own needs.","antonym":"Honest person"},{"id":"ivy-global-s19-rectify-rectitude","word":"Rectify, Rectitude","pos":"VERB","definition":"To correct or make right","example":"He tried to rectify his mistake by apologizing.","antonym":"Worsen"},{"id":"ivy-global-s19-refutation-refute","word":"Refutation, Refute","pos":"OTHER","definition":"The act of proving something wrong","example":"The refutation of his argument was swift and thorough.","antonym":"Confirmation"},{"id":"ivy-global-s19-sanctimonious","word":"Sanctimonious","pos":"OTHER","definition":"Making a show of being morally superior","example":"His sanctimonious attitude alienated his friends.","antonym":"Humble"},{"id":"ivy-global-s19-sophistry","word":"Sophistry","pos":"OTHER","definition":"The use of clever but false arguments","example":"The politician used sophistry to win the debate.","antonym":"Honesty"},{"id":"ivy-global-s19-spurious","word":"Spurious","pos":"OTHER","definition":"Not being what it purports to be; false or fake","example":"The spurious documents were quickly exposed as forgeries.","antonym":"Genuine"},{"id":"ivy-global-s19-substantiate","word":"Substantiate","pos":"VERB","definition":"To provide evidence to support or prove","example":"He could not substantiate his claims with any real evidence.","antonym":"Disprove"},{"id":"ivy-global-s19-auspicious","word":"Auspicious","pos":"OTHER","definition":"Conducive to success; favorable","example":"The sunny weather was an auspicious sign for the wedding.","antonym":"Inauspicious"},{"id":"ivy-global-s19-barrage","word":"Barrage","pos":"OTHER","definition":"A concentrated outpouring, as of questions or blows","example":"The reporter faced a barrage of questions from the press.","antonym":"Trickle"},{"id":"ivy-global-s19-belligerent","word":"Belligerent","pos":"OTHER","definition":"Hostile and aggressive","example":"The belligerent crowd became violent after the match.","antonym":"Peaceful"},{"id":"ivy-global-s19-blighted","word":"Blighted","pos":"OTHER","definition":"In a state of decline or decay","example":"The blighted neighborhood was once a thriving community.","antonym":"Flourishing"},{"id":"ivy-global-s19-bolster","word":"Bolster","pos":"VERB","definition":"To support or strengthen","example":"The success of the project bolstered his confidence.","antonym":"Weaken"},{"id":"ivy-global-s19-buttress","word":"Buttress","pos":"VERB","definition":"To support","example":"I buttressed m argument with an evidence","antonym":"Weaken"}]},{"id":"ivy-global-set-20","index":20,"name":"Set 20","words":[{"id":"ivy-global-s20-circumvent","word":"Circumvent","pos":"VERB","definition":"To find a way around an obstacle","example":"He circumvented the problem by using a different approach.","antonym":"Confront"},{"id":"ivy-global-s20-conflagration","word":"Conflagration","pos":"OTHER","definition":"A large, destructive fire","example":"The forest conflagration destroyed thousands of acres.","antonym":"Extinguishin g"},{"id":"ivy-global-s20-contentious","word":"Contentious","pos":"OTHER","definition":"Causing or likely to cause disagreement","example":"The contentious issue divided the community.","antonym":"Agreeable"},{"id":"ivy-global-s20-decimate","word":"Decimate","pos":"VERB","definition":"To destroy a large part of","example":"The disease decimated the population of the village.","antonym":"Build"},{"id":"ivy-global-s20-deleterious","word":"Deleterious","pos":"OTHER","definition":"Harmful or damaging","example":"The chemicals had a deleterious effect on the environment.","antonym":"Beneficial"},{"id":"ivy-global-s20-depravity","word":"Depravity","pos":"OTHER","definition":"Moral corruption","example":"The depravity of his actions shocked the community.","antonym":"Virtue"},{"id":"ivy-global-s20-dire","word":"Dire","pos":"OTHER","definition":"Extremely serious or urgent","example":"They were in dire need of medical assistance.","antonym":"Trivial"},{"id":"ivy-global-s20-divergent","word":"Divergent","pos":"OTHER","definition":"Differing from the standard or norm","example":"Their divergent opinions led to a heated argument.","antonym":"Convergent"},{"id":"ivy-global-s20-divisive","word":"Divisive","pos":"OTHER","definition":"Tending to cause disagreement or hostility","example":"The politician's divisive rhetoric alienated many voters.","antonym":"Unifying"},{"id":"ivy-global-s20-elude","word":"Elude","pos":"VERB","definition":"To evade or escape from","example":"The suspect managed to elude the police.","antonym":"Confront"},{"id":"ivy-global-s20-elusive","word":"Elusive","pos":"OTHER","definition":"Difficult to find, catch, or achieve","example":"Success remained elusive despite their best efforts.","antonym":"Obtainable"},{"id":"ivy-global-s20-embitter-ed","word":"Embitter(ed)","pos":"VERB","definition":"To make someone feel bitter or resentful","example":"The loss embittered him for years.","antonym":"Soothe"},{"id":"ivy-global-s20-encumbrance","word":"Encumbrance","pos":"OTHER","definition":"A burden or impediment","example":"The heavy bag was an encumbrance during the hike.","antonym":"Aid"},{"id":"ivy-global-s20-fortuitous","word":"Fortuitous","pos":"OTHER","definition":"Happening by chance rather than intention","example":"The meeting was a fortuitous coincidence.","antonym":"Planned"},{"id":"ivy-global-s20-marred","word":"Marred","pos":"OTHER","definition":"Impaired the appearance of; disfigured","example":"The scratch marred the surface of the table.","antonym":"Enhanced"},{"id":"ivy-global-s20-nefarious","word":"Nefarious","pos":"OTHER","definition":"Wicked or criminal","example":"The nefarious villain plotted to take over the world.","antonym":"Honorable"},{"id":"ivy-global-s20-palliate-palliative","word":"Palliate, Palliative","pos":"VERB","definition":"To relieve or lessen without curing","example":"The medicine palliated the symptoms but did not cure the illness.","antonym":"Aggravate"},{"id":"ivy-global-s20-precarious","word":"Precarious","pos":"OTHER","definition":"Not securely held or in position; dangerously likely to fall or collapse","example":"The ladder was placed in a precarious position.","antonym":"Stable"},{"id":"ivy-global-s20-raze","word":"Raze","pos":"VERB","definition":"To completely destroy","example":"The old building was razed to make way for a new development.","antonym":"Build"},{"id":"ivy-global-s20-serendipity","word":"Serendipity","pos":"OTHER","definition":"The occurrence of events by chance in a happy or beneficial way","example":"Finding the rare book at the store was pure serendipity.","antonym":"Misfortune"},{"id":"ivy-global-s20-spartan","word":"Spartan","pos":"OTHER","definition":"Showing the indifference to comfort or luxury","example":"His spartan lifestyle involved few possessions and no luxuries.","antonym":"Luxurious"},{"id":"ivy-global-s20-vanquish","word":"Vanquish","pos":"VERB","definition":"To defeat thoroughly","example":"The army vanquished its enemies in a decisive battle.","antonym":"Surrender"},{"id":"ivy-global-s20-vigilant","word":"Vigilant","pos":"OTHER","definition":"Keeping careful watch for possible danger","example":"The guards remained vigilant throughout the night.","antonym":"Negligent"},{"id":"ivy-global-s20-vindictive","word":"Vindictive","pos":"OTHER","definition":"Having or showing a strong desire for revenge","example":"Her vindictive actions were driven by years of resentment.","antonym":"Forgiving"},{"id":"ivy-global-s20-virulent","word":"Virulent","pos":"OTHER","definition":"Extremely harmful or poisonous","example":"The virulent strain of the virus spread rapidly, leading to a public health crisis.","antonym":"Harmless, Benign"}]}]},{"id":"sat-prepositions","name":"SAT Prepositions","totalWords":100,"sets":[{"id":"sat-prep-set-1","index":1,"name":"Set 1","words":[{"id":"sat-prep-s1-capable-of","word":"Capable of","pos":"PREP","definition":"Having the ability or skill needed to do something.","example":"After months of practice, she was finally capable of performing the piece from memory."},{"id":"sat-prep-s1-aware-of","word":"Aware of","pos":"PREP","definition":"Having knowledge or perception of a situation or fact.","example":"The committee was fully aware of the budget shortfall before the meeting began."},{"id":"sat-prep-s1-conscious-of","word":"Conscious of","pos":"PREP","definition":"Aware of and attentive to something, often one’s own state or behavior.","example":"He grew increasingly conscious of the time as the deadline approached."},{"id":"sat-prep-s1-devoid-of","word":"Devoid of","pos":"PREP","definition":"Completely lacking or without something.","example":"The abandoned warehouse was devoid of any furniture or equipment."},{"id":"sat-prep-s1-independent-of","word":"Independent of","pos":"PREP","definition":"Not influenced or controlled by; separate from.","example":"The results were independent of the researchers’ initial expectations."},{"id":"sat-prep-s1-regardless-of","word":"Regardless of","pos":"PREP","definition":"Without being affected or influenced by something; despite.","example":"The festival will proceed regardless of the weather forecast."},{"id":"sat-prep-s1-indicative-of","word":"Indicative of","pos":"PREP","definition":"Serving as a sign or suggestion of something.","example":"A sudden drop in sales is often indicative of a larger economic slowdown."},{"id":"sat-prep-s1-characteristic-of","word":"Characteristic of","pos":"PREP","definition":"Typical of a particular person, thing, or category.","example":"Her calm response was characteristic of how she handled every crisis."},{"id":"sat-prep-s1-consist-of","word":"Consist of","pos":"PREP","definition":"To be made up of particular parts or elements.","example":"The exam will consist of three essays and one short-answer section."},{"id":"sat-prep-s1-composed-of","word":"Composed of","pos":"PREP","definition":"Made up of certain parts or members.","example":"The council is composed of representatives from each district."},{"id":"sat-prep-s1-accustomed-to","word":"Accustomed to","pos":"PREP","definition":"Familiar with something because of frequent exposure or experience.","example":"After a year abroad, she grew accustomed to eating dinner much later."},{"id":"sat-prep-s1-committed-to","word":"Committed to","pos":"PREP","definition":"Dedicated to a cause, plan, or relationship.","example":"The company remains committed to reducing its carbon footprint."},{"id":"sat-prep-s1-devoted-to","word":"Devoted to","pos":"PREP","definition":"Giving a great deal of love, time, or loyalty to someone or something.","example":"He devoted himself entirely to restoring the old library."},{"id":"sat-prep-s1-opposed-to","word":"Opposed to","pos":"PREP","definition":"Disagreeing with or against something.","example":"Several board members were strongly opposed to the merger."},{"id":"sat-prep-s1-prone-to","word":"Prone to","pos":"PREP","definition":"Likely to experience or do something, especially something negative.","example":"The coastal region is prone to sudden flooding during the rainy season."},{"id":"sat-prep-s1-susceptible-to","word":"Susceptible to","pos":"PREP","definition":"Likely to be influenced, harmed, or affected by something.","example":"Young seedlings are especially susceptible to frost damage."},{"id":"sat-prep-s1-immune-to","word":"Immune to","pos":"PREP","definition":"Not affected by something; protected against it.","example":"Years in the industry had made her immune to criticism from competitors."},{"id":"sat-prep-s1-resistant-to","word":"Resistant to","pos":"PREP","definition":"Able to withstand the effect of something.","example":"The new coating makes the fabric resistant to stains."},{"id":"sat-prep-s1-subject-to","word":"Subject to","pos":"PREP","definition":"Likely to experience or be affected by something; under someone’s authority.","example":"All flights are subject to delay during winter storms."},{"id":"sat-prep-s1-sensitive-to","word":"Sensitive to","pos":"PREP","definition":"Easily affected by, or quick to respond to, something.","example":"The instrument is sensitive to even the slightest change in temperature."}]},{"id":"sat-prep-set-2","index":2,"name":"Set 2","words":[{"id":"sat-prep-s2-responsible-for","word":"Responsible for","pos":"PREP","definition":"Having control over, or accountability for, something.","example":"The new manager is responsible for the entire logistics team."},{"id":"sat-prep-s2-accountable-for","word":"Accountable for","pos":"PREP","definition":"Required to justify or answer for one’s actions or decisions.","example":"Elected officials should be held accountable for their public promises."},{"id":"sat-prep-s2-famous-for","word":"Famous for","pos":"PREP","definition":"Well known because of a particular quality or achievement.","example":"The town is famous for its annual lantern festival."},{"id":"sat-prep-s2-notorious-for","word":"Notorious for","pos":"PREP","definition":"Well known for something generally considered negative.","example":"The intersection is notorious for its heavy traffic during rush hour."},{"id":"sat-prep-s2-eligible-for","word":"Eligible for","pos":"PREP","definition":"Qualified or entitled to something, according to set requirements.","example":"Students with a 3.5 GPA or higher are eligible for the scholarship."},{"id":"sat-prep-s2-grateful-for","word":"Grateful for","pos":"PREP","definition":"Feeling or showing appreciation for something.","example":"She was grateful for the extra time to revise her essay."},{"id":"sat-prep-s2-prepared-for","word":"Prepared for","pos":"PREP","definition":"Ready to deal with something that may happen.","example":"The coach made sure the team was prepared for any outcome."},{"id":"sat-prep-s2-qualified-for","word":"Qualified for","pos":"PREP","definition":"Having the necessary skills or requirements for something.","example":"Only candidates with a nursing license are qualified for the position."},{"id":"sat-prep-s2-necessary-for","word":"Necessary for","pos":"PREP","definition":"Required for a particular purpose or outcome.","example":"A stable internet connection is necessary for the online exam."},{"id":"sat-prep-s2-essential-to","word":"Essential to","pos":"PREP","definition":"Absolutely necessary for something to happen or exist.","example":"Clear communication is essential to any successful negotiation."},{"id":"sat-prep-s2-crucial-to","word":"Crucial to","pos":"PREP","definition":"Extremely important to the success or existence of something.","example":"Early detection is crucial to treating the disease effectively."},{"id":"sat-prep-s2-central-to","word":"Central to","pos":"PREP","definition":"Being a main or essential part of something.","example":"Trust is central to any long-term business partnership."},{"id":"sat-prep-s2-similar-to","word":"Similar to","pos":"PREP","definition":"Having features or qualities in common with something else.","example":"The proposed policy is similar to one already adopted by a neighboring state."},{"id":"sat-prep-s2-identical-to","word":"Identical to","pos":"PREP","definition":"Exactly the same as something else.","example":"Her signature was nearly identical to her sister’s."},{"id":"sat-prep-s2-equivalent-to","word":"Equivalent to","pos":"PREP","definition":"Equal in value, meaning, or importance to something else.","example":"One kilometer is roughly equivalent to 0.6 miles."},{"id":"sat-prep-s2-preferable-to","word":"Preferable to","pos":"PREP","definition":"More desirable or suitable than something else.","example":"A short delay is preferable to rushing the project and making mistakes."},{"id":"sat-prep-s2-superior-to","word":"Superior to","pos":"PREP","definition":"Higher in quality, rank, or ability than something else.","example":"The updated model is clearly superior to the one it replaced."},{"id":"sat-prep-s2-inferior-to","word":"Inferior to","pos":"PREP","definition":"Lower in quality, rank, or ability than something else.","example":"Critics argued the sequel was inferior to the original film."},{"id":"sat-prep-s2-prior-to","word":"Prior to","pos":"PREP","definition":"Before a particular time or event.","example":"Applicants must submit all documents prior to the deadline."},{"id":"sat-prep-s2-contrary-to","word":"Contrary to","pos":"PREP","definition":"Opposite to, or in conflict with, something.","example":"Contrary to popular belief, the experiment did not confirm the hypothesis."}]},{"id":"sat-prep-set-3","index":3,"name":"Set 3","words":[{"id":"sat-prep-s3-familiar-with","word":"Familiar with","pos":"PREP","definition":"Having good knowledge of something through experience.","example":"The technician is familiar with nearly every model of printer on the market."},{"id":"sat-prep-s3-acquainted-with","word":"Acquainted with","pos":"PREP","definition":"Having some knowledge of, or a passing familiarity with, something.","example":"New employees spend their first week getting acquainted with company policy."},{"id":"sat-prep-s3-consistent-with","word":"Consistent with","pos":"PREP","definition":"In agreement with, or not contradicting, something.","example":"The witness’s account was consistent with the security footage."},{"id":"sat-prep-s3-compatible-with","word":"Compatible with","pos":"PREP","definition":"Able to exist or work together with something else without conflict.","example":"The new software is not compatible with older operating systems."},{"id":"sat-prep-s3-content-with","word":"Content with","pos":"PREP","definition":"Satisfied with a particular situation and not wanting change.","example":"He seemed perfectly content with a quiet evening at home."},{"id":"sat-prep-s3-concerned-with","word":"Concerned with","pos":"PREP","definition":"Involved with, or interested in, a particular subject.","example":"The report is primarily concerned with long-term environmental effects."},{"id":"sat-prep-s3-associated-with","word":"Associated with","pos":"PREP","definition":"Connected with something, often by cause or reputation.","example":"High stress is closely associated with a range of health problems."},{"id":"sat-prep-s3-obsessed-with","word":"Obsessed with","pos":"PREP","definition":"Unable to stop thinking about something.","example":"By the end of the trip, he was completely obsessed with the local street food."},{"id":"sat-prep-s3-comply-with","word":"Comply with","pos":"PREP","definition":"To act in accordance with a rule, request, or command.","example":"All vendors must comply with the venue’s safety regulations."},{"id":"sat-prep-s3-cope-with","word":"Cope with","pos":"PREP","definition":"To deal effectively with something difficult.","example":"The clinic offers resources to help patients cope with chronic pain."},{"id":"sat-prep-s3-interfere-with","word":"Interfere with","pos":"PREP","definition":"To disrupt or get in the way of something.","example":"Loud construction noise began to interfere with the recording session."},{"id":"sat-prep-s3-compete-with","word":"Compete with","pos":"PREP","definition":"To try to be more successful than another person or thing.","example":"Small bookstores often struggle to compete with large online retailers."},{"id":"sat-prep-s3-different-from","word":"Different from","pos":"PREP","definition":"Not the same as something else.","example":"The final design is quite different from the original sketch."},{"id":"sat-prep-s3-distinct-from","word":"Distinct from","pos":"PREP","definition":"Clearly separate or different from something else.","example":"Ethics is a subject distinct from, though related to, law."},{"id":"sat-prep-s3-separate-from","word":"Separate from","pos":"PREP","definition":"Not connected to, or existing apart from, something.","example":"The guest wing is entirely separate from the main house."},{"id":"sat-prep-s3-derived-from","word":"Derived from","pos":"PREP","definition":"Coming from, or originating in, a particular source.","example":"The word biology is derived from two Greek roots."},{"id":"sat-prep-s3-suffering-from","word":"Suffering from","pos":"PREP","definition":"Experiencing pain, illness, or a difficult condition.","example":"The plant appeared to be suffering from a lack of sunlight."},{"id":"sat-prep-s3-prohibited-from","word":"Prohibited from","pos":"PREP","definition":"Officially not allowed to do something.","example":"Employees are prohibited from accessing the archive without authorization."},{"id":"sat-prep-s3-excluded-from","word":"Excluded from","pos":"PREP","definition":"Not permitted to take part in, or be included in, something.","example":"Freshmen are excluded from the advanced seminar by department policy."},{"id":"sat-prep-s3-refrain-from","word":"Refrain from","pos":"PREP","definition":"To stop oneself from doing something.","example":"Visitors are asked to refrain from touching the exhibits."}]},{"id":"sat-prep-set-4","index":4,"name":"Set 4","words":[{"id":"sat-prep-s4-interested-in","word":"Interested in","pos":"PREP","definition":"Wanting to know about or take part in something.","example":"She’s always been interested in how bridges are engineered."},{"id":"sat-prep-s4-engaged-in","word":"Engaged in","pos":"PREP","definition":"Actively taking part in an activity.","example":"The two diplomats were engaged in a lengthy discussion over trade terms."},{"id":"sat-prep-s4-skilled-in","word":"Skilled in","pos":"PREP","definition":"Having ability or expertise in a particular area.","example":"He is especially skilled in translating technical documents."},{"id":"sat-prep-s4-profi // ---------------------------------------------------------------------------

const PACKAGE_META = {

// ---------------------------------------------------------------------------
// Accent theme lookup for package cards (keyed by PACKAGE_META[id].accent)
// ---------------------------------------------------------------------------
const PACKAGE_ACCENTS = {
  blue: { hex: "#2563eb", bg: "bg-blue-50", text: "text-blue-700", ring: "text-blue-600" },
  violet: { hex: "#7c3aed", bg: "bg-violet-50", text: "text-violet-700", ring: "text-violet-600" },
  amber: { hex: "#d97706", bg: "bg-amber-50", text: "text-amber-700", ring: "text-amber-600" },

// ---------------------------------------------------------------------------
// Local persistence (per-word study status: 'new' | 'learning' | 'mastered')
// ---------------------------------------------------------------------------
const STORAGE_KEY = "vocabify_progress_v1";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveProgress(progress) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) {
    /* ignore quota errors */
  }
}

// ---------------------------------------------------------------------------
// Small presentational helpers
// ---------------------------------------------------------------------------

function classNames(...xs) {
  return xs.filter(Boolean).join(" ");
}

function ProgressRing({ percent, size = 56, stroke = 5, colorClass = "text-blue-600" }) {
  const radius = (size - stroke) / 2;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (Math.min(100, Math.max(0, percent)) / 100) * circumference;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="-rotate-90">
      <circle
        cx={size / 2} cy={size / 2} r={radius}
        fill="none" stroke="#e5e7eb" strokeWidth={stroke}
      />
      <circle
        cx={size / 2} cy={size / 2} r={radius}
        fill="none" strokeWidth={stroke} strokeLinecap="round"
        strokeDasharray={circumference}
        strokeDashoffset={offset}
        className={classNames(colorClass, "transition-all duration-700 ease-out")}
        stroke="currentColor"
      />
    </svg>
  );
}

function SegmentedBar({ mastered, learning, neu, total, height = "h-2.5" }) {
  if (total === 0) total = 1;
  const mPct = (mastered / total) * 100;
  const lPct = (learning / total) * 100;
  const nPct = (neu / total) * 100;
  return (
    <div className={classNames("w-full rounded-full overflow-hidden bg-slate-100 flex", height)}>
      <div className="segbar-seg h-full" style={{ width: `${mPct}%`, backgroundColor: "#10b981" }} />
      <div className="segbar-seg h-full" style={{ width: `${lPct}%`, backgroundColor: "#f59e0b" }} />
      <div className="segbar-seg h-full" style={{ width: `${nPct}%`, backgroundColor: "#e5e7eb" }} />
    </div>
  );
}

function PosTag({ pos }) {
  const cls = pos === "VERB" ? "tag-verb" : pos === "PREP" ? "tag-prep" : "tag-other";
  return (
    <span className={classNames(
      "inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide uppercase",
      cls
    )}>
      {pos}
    </span>
  );
}

function StatusBadge({ status }) {
  const label = status === "mastered" ? "Mastered" : status === "learning" ? "Learning" : "New";
  const cls = status === "mastered" ? "status-mastered" : status === "learning" ? "status-learning" : "status-new";
  return (
    <span className={classNames("inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold", cls)}>

    </span>

}

    </svg>
  );
}

// ---------------------------------------------------------------------------
// Progress calculations
// ---------------------------------------------------------------------------

function computeSetStats(setObj, progress) {
  let mastered = 0, learning = 0, neu = 0;
  setObj.words.forEach((w) => {
    const st = progress[w.id] || "new";
    if (st === "mastered") mastered++;
    else if (st === "learning") learning++;
    else neu++;
  });
  const total = setObj.words.length;
  const percent = total ? Math.round((mastered / total) * 100) : 0;
  const done = mastered === total;
  const started = mastered > 0 || learning > 0;
  return { mastered, learning, neu, total, percent, done, started };
}

function computePackageStats(pkg, progress) {
  let mastered = 0, learning = 0, neu = 0, total = 0;
  pkg.sets.forEach((s) => {
    const st = computeSetStats(s, progress);
    mastered += st.mastered; learning += st.learning; neu += st.neu; total += st.total;
  });
  const percent = total ? Math.round((mastered / total) * 100) : 0;
  return { mastered, learning, neu, total, percent };
}

                <path d="M4 19.5A2.5 2.5 0 016.5 17H20" />

// ---------------------------------------------------------------------------
// Dashboard: package cards
// ---------------------------------------------------------------------------

function PackageCard({ pkg, progress, onOpen, index }) {
  const stats = computePackageStats(pkg, progress);
  const meta = PACKAGE_META[pkg.id] || {};
  const accent = PACKAGE_ACCENTS[meta.accent] || PACKAGE_ACCENTS.blue;
  const accentBg = accent.bg;
  const accentText = accent.text;
  const ringColor = accent.ring;

  return (
    <button
      onClick={() => onOpen(pkg.id)}
      style={{ animationDelay: `${index * 60}ms` }}
      className="animate-in hover-lift text-left w-full bg-white rounded-2xl border border-slate-200 p-6 card-shadow focus-ring group"
    >
      <div className="flex items-start justify-between gap-4">
        <div className="min-w-0">
          <div className={classNames("inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-bold uppercase tracking-wide mb-3", accentBg, accentText)}>

            {pkg.sets.length} sets
          </div>
          <h3 className="font-display font-bold text-xl text-slate-900 letter-tight leading-snug mb-1.5">

          {stats.total} words

        <span className="inline-flex items-center gap-1.5 font-semibold text-emerald-600">

        <span className="inline-flex items-center gap-1.5 font-semibold text-amber-600">

  );
}

function Dashboard({ data, progress, onOpenPackage }) {
  const totalWords = data.packages.reduce((s, p) => s + p.totalWords, 0);
  const totalMastered = data.packages.reduce((s, p) => s + computePackageStats(p, progress).mastered, 0);

  return (

function FlashcardMode({ setObj, progress, onUpdateStatus, onExit }) {
  const [order] = useState(() => setObj.words.map((_, i) => i));
  const [pos, setPos] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [results, setResults] = useState({}); // wordId -> 'correct' | 'wrong'
  const [direction, setDirection] = useState("forward");
  const [finished, setFinished] = useState(false);
  const [judgeFlash, setJudgeFlash] = useState(null); // 'correct' | 'wrong' | null

  const currentWord = setObj.words[order[pos]];
  const total = order.length;

  const goNext = useCallback(() => {
    setDirection("forward");
    setFlipped(false);
    setJudgeFlash(null);
    setPos((p) => {
      if (p + 1 >= total) {
        setFinished(true);
        return p;
      }
      return p + 1;
    });
  }, [total]);

  const handleAnswer = useCallback((isCorrect) => {
    if (!currentWord) return;
    const status = isCorrect ? "mastered" : "learning";
    onUpdateStatus(currentWord.id, status);
    setResults((r) => ({ ...r, [currentWord.id]: isCorrect ? "correct" : "wrong" }));
    setJudgeFlash(isCorrect ? "correct" : "wrong");
    setTimeout(() => { goNext(); }, 280);
  }, [currentWord, onUpdateStatus, goNext]);

  useEffect(() => {
    function onKeyDown(e) {
      if (finished) return;
      if (e.code === "Space") {
        e.preventDefault();
        setFlipped((f) => !f);
      } else if (e.key === "1") {
        handleAnswer(false);
      } else if (e.key === "2") {
        handleAnswer(true);
      } else if (e.key === "Escape") {
        onExit();
      }
    }
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [finished, handleAnswer, onExit]);

  if (finished) {
    const correctCount = Object.values(results).filter((r) => r === "correct").length;
    const pct = total ? Math.round((correctCount / total) * 100) : 0;
    return (
      <div className="max-w-lg mx-auto px-5 py-16 text-center animate-pop">
        <div className="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-5">
          <IconCheck className="w-8 h-8" />
        </div>
        <h2 className="font-display font-extrabold text-2xl text-slate-900 mb-2">Set complete!</h2>
        <p className="text-slate-500 mb-7">
          You got {correctCount} of {total} correct ({pct}%) on Set {setObj.index}.
        </p>
        <div className="flex items-center justify-center gap-3">
          <button
            onClick={onExit}
            className="btn-press focus-ring px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-700"
          >
            Back to set
          </button>
          <button
            onClick={() => { setPos(0); setFlipped(false); setResults({}); setFinished(false); setJudgeFlash(null); }}
            className="btn-press focus-ring px-5 py-2.5 rounded-xl bg-blue-50 text-blue-700 text-sm font-bold hover:bg-blue-100"
          >
            Study again
          </button>
        </div>
      </div>
    );
  }

  if (!currentWord) return null;

  return (
    <div className="max-w-2xl mx-auto px-5 py-8 sm:py-10">
      <div className="flex items-center justify-between mb-8">
        <button
          onClick={onExit}
          className="btn-press focus-ring inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800 rounded-lg px-2 py-1 -ml-2"
        >
          <IconChevronLeft className="w-4 h-4" /> Back
        </button>
        <div className="flex items-center gap-2 text-sm font-semibold text-slate-500">
          <IconLayers className="w-4 h-4 text-slate-400" />
          {pos + 1} / {total}
        </div>
      </div>

      <div className="w-full h-1.5 rounded-full bg-slate-100 mb-9 overflow-hidden">
        <div
          className="h-full bg-blue-600 rounded-full transition-all duration-500 ease-out"
          style={{ width: `${(pos / total) * 100}%` }}
        />
      </div>

      <div className="flip-scene w-full" style={{ height: "380px" }}>
        <div
          className={classNames("flip-card w-full h-full cursor-pointer", flipped && "is-flipped")}
          onClick={() => setFlipped((f) => !f)}
          role="button"
          tabIndex={0}
          aria-label="Flashcard. Press space or click to flip."
        >
          {/* FRONT */}
          <div className={classNames(
            "flip-face rounded-2xl border card-shadow-lg p-8 sm:p-10 items-center justify-center text-center bg-white",
            judgeFlash === "correct" ? "border-emerald-300" : judgeFlash === "wrong" ? "border-red-300" : "border-slate-200"
          )}>
            <div className="mb-5">
              <PosTag pos={currentWord.pos} />
            </div>
            <h2 className="font-display font-extrabold text-4xl sm:text-5xl letter-tighter text-slate-900 mb-6 break-words">
              {currentWord.word}
            </h2>
            <div className="inline-flex items-center gap-2 text-sm font-semibold text-slate-400 mt-2">
              <IconRotate className="w-4 h-4" />
              Flip for definition
            </div>
            <div className="absolute bottom-6 left-0 right-0 flex justify-center gap-1.5 text-[11px] text-slate-300 font-medium">
              press <span className="kbd">space</span> to flip
            </div>
          </div>

          {/* BACK */}
          <div className="flip-face flip-face-back rounded-2xl border border-slate-200 card-shadow-lg p-8 sm:p-10 justify-center bg-white">
            <div className="flex items-center gap-2 mb-4">
              <span className="font-display font-bold text-lg text-slate-900">{currentWord.word}</span>
              <PosTag pos={currentWord.pos} />
            </div>
            <p className="text-slate-700 text-lg leading-relaxed mb-5">{currentWord.definition}</p>
            <div className="rounded-xl bg-slate-50 border border-slate-100 p-4 mb-4">
              <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-1.5">Example</p>
              <p className="text-slate-600 text-sm leading-relaxed italic">&ldquo;{currentWord.example}&rdquo;</p>
            </div>

                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Antonym</span>
                <span className="text-sm font-semibold text-slate-600">{currentWord.antonym}</span>

            )}

      <div className="flex items-center justify-center gap-4 mt-9">
        <button
          onClick={() => handleAnswer(false)}
          className="btn-press focus-ring flex-1 max-w-[180px] inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl bg-red-50 text-red-600 font-bold border border-red-100 hover:bg-red-100"
        >
          <IconX className="w-4 h-4" /> Wrong
          <span className="kbd ml-1">1</span>
        </button>
        <button
          onClick={() => handleAnswer(true)}
          className="btn-press focus-ring flex-1 max-w-[180px] inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl text-white font-bold hover:opacity-90"
          style={{ backgroundColor: "#10b981" }}
        >
          <IconCheck className="w-4 h-4" /> Correct
          <span className="kbd ml-1 bg-white/20 border-white/20 text-white shadow-none">2</span>
        </button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Matching mode
// ---------------------------------------------------------------------------

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function MatchingMode({ setObj, onExit, roundSize = 8 }) {
  const poolWords = useMemo(() => shuffleArray(setObj.words).slice(0, Math.min(roundSize, setObj.words.length)), [setObj]);
  const [wordTiles] = useState(() => shuffleArray(poolWords.map((w) => ({ key: `w-${w.id}`, wordId: w.id, text: w.word }))));
  const [defTiles] = useState(() => shuffleArray(poolWords.map((w) => ({ key: `d-${w.id}`, wordId: w.id, text: w.definition }))));
  const [selectedWord, setSelectedWord] = useState(null);
  const [selectedDef, setSelectedDef] = useState(null);
  const [matched, setMatched] = useState(new Set());
  const [wrongPulse, setWrongPulse] = useState(null);
  const [startTime] = useState(() => Date.now());
  const [elapsed, setElapsed] = useState(0);
  const [done, setDone] = useState(false);

  useEffect(() => {
    if (done) return;
    const t = setInterval(() => setElapsed(((Date.now() - startTime) / 1000)), 100);
    return () => clearInterval(t);
  }, [startTime, done]);

  useEffect(() => {
    if (matched.size === poolWords.length && poolWords.length > 0) {
      setDone(true);
    }
  }, [matched, poolWords]);

  useEffect(() => {
    if (selectedWord && selectedDef) {
      if (selectedWord.wordId === selectedDef.wordId) {
        setMatched((m) => new Set([...m, selectedWord.wordId]));
        setSelectedWord(null);
        setSelectedDef(null);
      } else {
        setWrongPulse({ w: selectedWord.key, d: selectedDef.key });
        setTimeout(() => {
          setWrongPulse(null);
          setSelectedWord(null);
          setSelectedDef(null);
        }, 420);
      }
    }
  }, [selectedWord, selectedDef]);

  if (done) {
    return (
      <div className="max-w-lg mx-auto px-5 py-16 text-center animate-pop">
        <div className="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5" style={{backgroundColor:'#f5f3ff', color:'#7c3aed'}}>
          <IconGrid className="w-8 h-8" />
        </div>
        <h2 className="font-display font-extrabold text-2xl text-slate-900 mb-2">All matched!</h2>
        <p className="text-slate-500 mb-7">You matched {poolWords.length} pairs in {elapsed.toFixed(1)}s.</p>
        <button onClick={onExit} className="btn-press focus-ring px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-700">
          Back to set
        </button>
      </div>
    );
  }

  return (
    <div className="max-w-4xl mx-auto px-5 py-8">
      <div className="flex items-center justify-between mb-7">
        <button onClick={onExit} className="btn-press focus-ring inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800 rounded-lg px-2 py-1 -ml-2">
          <IconChevronLeft className="w-4 h-4" /> Back
        </button>
        <div className="flex items-center gap-4">
          <span className="text-sm font-semibold text-slate-500">{matched.size}/{poolWords.length} matched</span>
          <div className="flex items-center gap-1.5 text-sm font-bold text-slate-700 bg-slate-100 px-3 py-1 rounded-full">
            <IconClock className="w-3.5 h-3.5" /> {elapsed.toFixed(1)}s
          </div>
        </div>
      </div>
      <p className="text-center text-sm text-slate-400 mb-6">Tap a word, then tap its matching definition.</p>
      <div className="grid grid-cols-2 gap-6">
        <div className="space-y-2.5">
          {wordTiles.map((t) => {
            const isMatched = matched.has(t.wordId);
            const isSelected = selectedWord && selectedWord.key === t.key;
            const isWrong = wrongPulse && wrongPulse.w === t.key;
            if (isMatched) return <div key={t.key} className="match-tile correct-pop h-[52px] rounded-xl border border-emerald-200 bg-emerald-50" />;
            return (
              <button
                key={t.key}
                onClick={() => !isSelected && setSelectedWord(t)}
                className={classNames(
                  "match-tile w-full text-left px-4 py-3.5 rounded-xl border font-semibold text-sm focus-ring",
                  isWrong ? "border-red-300 bg-red-50 text-red-600 animate-shake"
                    : isSelected ? "border-blue-500 bg-blue-50 text-blue-700 shadow-sm"
                    : "border-slate-200 bg-white text-slate-800 hover:border-slate-300"
                )}
              >
                {t.text}
              </button>
            );
          })}
        </div>
        <div className="space-y-2.5">
          {defTiles.map((t) => {
            const isMatched = matched.has(t.wordId);
            const isSelected = selectedDef && selectedDef.key === t.key;
            const isWrong = wrongPulse && wrongPulse.d === t.key;
            if (isMatched) return <div key={t.key} className="match-tile correct-pop h-[52px] rounded-xl border border-emerald-200 bg-emerald-50" />;
            return (
              <button
                key={t.key}
                onClick={() => !isSelected && setSelectedDef(t)}
                className={classNames(
                  "match-tile w-full text-left px-4 py-3.5 rounded-xl border text-sm focus-ring leading-snug",
                  isWrong ? "border-red-300 bg-red-50 text-red-600 animate-shake"
                    : isSelected ? "border-blue-500 bg-blue-50 text-blue-700 shadow-sm"
                    : "border-slate-200 bg-white text-slate-600 hover:border-slate-300"
                )}
              >
                {t.text}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Speed mode
// ---------------------------------------------------------------------------

function buildMcOptions(setObj, correctWord, allWords) {
  const pool = allWords.filter((w) => w.id !== correctWord.id);
  const distractors = shuffleArray(pool).slice(0, 3).map((w) => w.definition);
  return shuffleArray([correctWord.definition, ...distractors]);
}

function SpeedMode({ setObj, onUpdateStatus, onExit, seconds = 60 }) {
  const [order] = useState(() => shuffleArray(setObj.words));
  const [idx, setIdx] = useState(0);
  const [score, setScore] = useState(0);
  const [timeLeft, setTimeLeft] = useState(seconds);
  const [over, setOver] = useState(false);
  const [selected, setSelected] = useState(null);
  const [options, setOptions] = useState(() => buildMcOptions(setObj, order[0], setObj.words));
  const timerRef = useRef(null);

  useEffect(() => {
    if (over) return;
    timerRef.current = setInterval(() => {
      setTimeLeft((t) => {
        if (t <= 1) {
          clearInterval(timerRef.current);
          setOver(true);
          return 0;
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [over]);

  const nextQuestion = useCallback(() => {
    setIdx((i) => {
      const ni = i + 1;
      if (ni >= order.length) {
        setOver(true);
        return i;
      }
      setOptions(buildMcOptions(setObj, order[ni], setObj.words));
      setSelected(null);
      return ni;
    });
  }, [order, setObj]);

  function handleSelect(opt) {
    if (selected || over) return;
    setSelected(opt);
    const current = order[idx];
    const isCorrect = opt === current.definition;
    if (isCorrect) {
      setScore((s) => s + 1);
      onUpdateStatus(current.id, "mastered");
    } else {
      onUpdateStatus(current.id, "learning");
    }
    setTimeout(nextQuestion, 500);
  }

  if (over) {
    return (
      <div className="max-w-lg mx-auto px-5 py-16 text-center animate-pop">
        <div className="w-16 h-16 rounded-2xl bg-amber-50 flex items-center justify-center mx-auto mb-5" style={{color:'#f59e0b'}}>
          <IconBolt className="w-8 h-8" />
        </div>
        <h2 className="font-display font-extrabold text-2xl text-slate-900 mb-2">Time's up!</h2>
        <p className="text-slate-500 mb-7">You scored {score} correct answer{score === 1 ? "" : "s"}.</p>
        <button onClick={onExit} className="btn-press focus-ring px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-700">
          Back to set
        </button>
      </div>
    );
  }

  const current = order[idx];
  if (!current) return null;

  return (
    <div className="max-w-2xl mx-auto px-5 py-8">
      <div className="flex items-center justify-between mb-7">
        <button onClick={onExit} className="btn-press focus-ring inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800 rounded-lg px-2 py-1 -ml-2">
          <IconChevronLeft className="w-4 h-4" /> Back
        </button>
        <div className="flex items-center gap-4">
          <span className="text-sm font-bold text-emerald-600">{score} correct</span>
          <div className={classNames(
            "flex items-center gap-1.5 text-sm font-extrabold px-3 py-1 rounded-full",
            timeLeft <= 10 ? "bg-red-50 text-red-600 animate-pulse-soft" : "bg-amber-50 text-amber-600"
          )}>
            <IconClock className="w-3.5 h-3.5" /> {timeLeft}s
          </div>
        </div>
      </div>

      <div className="w-full h-1.5 rounded-full bg-slate-100 mb-8 overflow-hidden">
        <div className="h-full rounded-full transition-all duration-300" style={{ width: `${(idx / order.length) * 100}%`, backgroundColor: '#f59e0b' }} />
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 card-shadow-lg p-8 sm:p-10 text-center mb-6 animate-pop" key={current.id}>
        <PosTag pos={current.pos} />
        <h3 className="font-display font-extrabold text-3xl sm:text-4xl letter-tighter text-slate-900 mt-4">{current.word}</h3>
        <p className="text-sm text-slate-400 mt-2">Which definition matches?</p>
      </div>

      <div className="grid grid-cols-1 gap-3">
        {options.map((opt, i) => {
          const isCorrect = opt === current.definition;
          let styleCls = "border-slate-200 bg-white hover:border-slate-300 text-slate-700";
          if (selected) {
            if (opt === selected && isCorrect) styleCls = "border-emerald-400 bg-emerald-50 text-emerald-700";
            else if (opt === selected && !isCorrect) styleCls = "border-red-400 bg-red-50 text-red-700";
            else if (isCorrect) styleCls = "border-emerald-300 bg-emerald-50/60 text-emerald-700";
            else styleCls = "border-slate-200 bg-white text-slate-400";
          }
          return (
            <button
              key={i}
              onClick={() => handleSelect(opt)}
              disabled={!!selected}
              className={classNames("btn-press focus-ring text-left px-5 py-4 rounded-xl border text-sm font-medium leading-relaxed transition-colors", styleCls)}
            >
              {opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Test mode
// ---------------------------------------------------------------------------

function TestMode({ setObj, onUpdateStatus, onExit }) {
  const questions = useMemo(() => shuffleArray(setObj.words).slice(0, Math.min(10, setObj.words.length)).map((w) => ({
    word: w,
    options: buildMcOptions(setObj, w, setObj.words),
  })), [setObj]);

  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);

  function selectAnswer(wordId, opt) {
    if (submitted) return;
    setAnswers((a) => ({ ...a, [wordId]: opt }));
  }

  function handleSubmit() {
    setSubmitted(true);
    questions.forEach((q) => {
      const chosen = answers[q.word.id];
      const correct = chosen === q.word.definition;
      onUpdateStatus(q.word.id, correct ? "mastered" : "learning");
    });
  }

  const score = submitted ? questions.filter((q) => answers[q.word.id] === q.word.definition).length : 0;
  const answeredCount = Object.keys(answers).length;

  return (
    <div className="max-w-2xl mx-auto px-5 py-8 pb-16">
      <div className="flex items-center justify-between mb-7">
        <button onClick={onExit} className="btn-press focus-ring inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800 rounded-lg px-2 py-1 -ml-2">
          <IconChevronLeft className="w-4 h-4" /> Back
        </button>
        {submitted ? (
          <span className="text-sm font-extrabold" style={{color:'#10b981'}}>{score}/{questions.length} correct</span>
        ) : (
          <span className="text-sm font-semibold text-slate-500">{answeredCount}/{questions.length} answered</span>
        )}
      </div>

      <div className="mb-8">
        <h2 className="font-display font-extrabold text-2xl letter-tighter text-slate-900 mb-1.5">Set {setObj.index} test</h2>
        <p className="text-slate-500 text-sm">Choose the correct definition for each word, then submit.</p>
      </div>

      <div className="space-y-5">
        {questions.map((q, qi) => {
          const chosen = answers[q.word.id];
          return (
            <div key={q.word.id} className="bg-white rounded-2xl border border-slate-200 card-shadow p-5 animate-in" style={{animationDelay:`${qi*40}ms`}}>
              <div className="flex items-center gap-2 mb-4">
                <span className="w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center">{qi + 1}</span>
                <span className="font-display font-bold text-slate-900">{q.word.word}</span>
                <PosTag pos={q.word.pos} />
              </div>
              <div className="grid grid-cols-1 gap-2">
                {q.options.map((opt, oi) => {
                  const isCorrect = opt === q.word.definition;
                  let cls = "border-slate-200 bg-white hover:border-slate-300 text-slate-700";
                  if (submitted) {
                    if (isCorrect) cls = "border-emerald-300 bg-emerald-50 text-emerald-700";
                    else if (opt === chosen) cls = "border-red-300 bg-red-50 text-red-700";
                    else cls = "border-slate-200 bg-white text-slate-400";
                  } else if (opt === chosen) {
                    cls = "border-blue-500 bg-blue-50 text-blue-700";
                  }
                  return (
                    <button
                      key={oi}
                      onClick={() => selectAnswer(q.word.id, opt)}
                      disabled={submitted}
                      className={classNames("btn-press focus-ring text-left px-4 py-3 rounded-xl border text-sm leading-relaxed", cls)}
                    >
                      {opt}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      <div className="mt-8 flex justify-center">
        {!submitted ? (
          <button
            onClick={handleSubmit}
            disabled={answeredCount < questions.length}
            className={classNames(
              "btn-press focus-ring px-8 py-3.5 rounded-xl text-sm font-bold transition-colors",
              answeredCount < questions.length
                ? "bg-slate-100 text-slate-400 cursor-not-allowed"
                : "bg-blue-600 text-white hover:bg-blue-700 shadow-sm shadow-blue-600/30"
            )}
          >
            Submit test
          </button>
        ) : (
          <button onClick={onExit} className="btn-press focus-ring px-8 py-3.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-700">
            Back to set
          </button>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Root App
// ---------------------------------------------------------------------------

function App() {
  const [view, setView] = useState({ screen: "dashboard" });
  const [progress, setProgress] = useState(() => loadProgress());

  useEffect(() => { saveProgress(progress); }, [progress]);

  const updateStatus = useCallback((wordId, status) => {
    setProgress((p) => ({ ...p, [wordId]: status }));
  }, []);

  const findPackage = (pkgId) => RAW_DATA.packages.find((p) => p.id === pkgId);

  function goDashboard() { setView({ screen: "dashboard" }); }
  function openPackage(pkgId) { setView({ screen: "setlist", pkgId }); window.scrollTo({top:0}); }
  function openSet(pkgId, setObj) { setView({ screen: "setoverview", pkgId, setObj }); window.scrollTo({top:0}); }
  function startMode(pkgId, setObj, mode) { setView({ screen: "study", pkgId, setObj, mode }); window.scrollTo({top:0}); }
  function backToSetlist(pkgId) { setView({ screen: "setlist", pkgId }); window.scrollTo({top:0}); }
  function backToOverview(pkgId, setObj) { setView({ screen: "setoverview", pkgId, setObj }); window.scrollTo({top:0}); }

  let breadcrumbs = null;
  if (view.screen === "setlist") {
    const pkg = findPackage(view.pkgId);
    breadcrumbs = [
      { label: "Packages", onClick: goDashboard },
      { label: pkg ? pkg.name : "", onClick: null },
    ];
  } else if (view.screen === "setoverview") {
    const pkg = findPackage(view.pkgId);
    breadcrumbs = [
      { label: "Packages", onClick: goDashboard },
      { label: pkg ? pkg.name : "", onClick: () => backToSetlist(view.pkgId) },
      { label: `Set ${view.setObj.index}`, onClick: null },
    ];
  } else if (view.screen === "study") {
    const pkg = findPackage(view.pkgId);
    const modeLabel = STUDY_MODES.find((m) => m.id === view.mode)?.label || "Study";
    breadcrumbs = [
      { label: "Packages", onClick: goDashboard },
      { label: pkg ? pkg.name : "", onClick: () => backToSetlist(view.pkgId) },
      { label: `Set ${view.setObj.index}`, onClick: () => backToOverview(view.pkgId, view.setObj) },
      { label: modeLabel, onClick: null },
    ];
  }

  return (
    <div className="min-h-screen bg-noise-blue">
      <Header onLogoClick={goDashboard} breadcrumbs={breadcrumbs} />

      {view.screen === "dashboard" && (
        <Dashboard data={RAW_DATA} progress={progress} onOpenPackage={openPackage} />
      )}

      {view.screen === "setlist" && (() => {
        const pkg = findPackage(view.pkgId);
        if (!pkg) return null;
        return <SetListView pkg={pkg} progress={progress} onOpenSet={(s) => openSet(pkg.id, s)} />;
      })()}

      {view.screen === "setoverview" && (
        <SetOverview
          setObj={view.setObj}
          progress={progress}
          onBack={() => backToSetlist(view.pkgId)}
          onStartMode={(mode) => startMode(view.pkgId, view.setObj, mode)}
        />
      )}

      {view.screen === "study" && view.mode === "flashcard" && (
        <FlashcardMode
          setObj={view.setObj}
          progress={progress}
          onUpdateStatus={updateStatus}
          onExit={() => backToOverview(view.pkgId, view.setObj)}
        />
      )}

      {view.screen === "study" && view.mode === "matching" && (
        <MatchingMode
          setObj={view.setObj}
          onExit={() => backToOverview(view.pkgId, view.setObj)}
        />
      )}

      {view.screen === "study" && view.mode === "speed" && (
        <SpeedMode
          setObj={view.setObj}
          onUpdateStatus={updateStatus}
          onExit={() => backToOverview(view.pkgId, view.setObj)}
        />
      )}

      {view.screen === "study" && view.mode === "test" && (
        <TestMode
          setObj={view.setObj}
          onUpdateStatus={updateStatus}
          onExit={() => backToOverview(view.pkgId, view.setObj)}
        />
      )}

      <footer className="max-w-6xl mx-auto px-5 sm:px-8 py-10 text-center">
        <p className="text-xs text-slate-400">Vocabify &middot; Vocabulary sourced from the Vocabook by @satashkent (3rd Edition) &middot; Prepositions written for SAT Writing &amp; Language prep</p>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
