<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabify - SAT/IELTS Vocabulary</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Custom Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: { 500: '#10b981', 600: '#059669' },
                        amber: { 500: '#f59e0b', 600: '#d97706' },
                        slate: { 50: '#f8fafc', 200: '#e2e8f0', 800: '#1e293b' },
                        blue: { 600: '#2563eb', 700: '#1d4ed8' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for 3D Flip Animation -->
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; }
        
        /* 3D Flip Utilities */
        .perspective { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .flip-card-inner {
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            width: 100%;
            height: 100%;
        }
        
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // --- VOCABULARY DATA ---
        // Sourced from "Vocabook by @satashkent (3rd Edition).pdf"
        const vocabularyData = [
            {
                id: 'pkg1',
                title: 'College Panda 400 Words',
                description: 'Essential SAT vocabulary.',
                totalWords: 400,
                progress: { mastered: 45, learning: 100, new: 255 },
                sets: [
                    {
                        id: 'cp_set1',
                        title: 'Set 1',
                        status: 'Learning',
                        words: [
                            { word: 'Erratic', type: 'ADJ', def: 'Unpredictable, inconsistent, irregular', example: 'His erratic dance moves were so unpredictable that even the DJ couldn\'t keep up with the beat' },
                            { word: 'Secluded', type: 'ADJ', def: 'Hard to reach, hidden away', example: 'The WiFi signal was so bad in the secluded cabin that they had to make friends with the squirrels just for entertainment' },
                            { word: 'Fluctuate', type: 'VERB', def: 'To rise and fall irregularly', example: 'His mood fluctuates like the stock market - happy when he gets pizza, but plummeting when it runs out.' },
                            { word: 'Exalt', type: 'VERB', def: 'To praise, to worship', example: 'She exalted her coffee maker every morning, whispering, "You are my hero," as it brewed her life-saving caffeine' },
                            { word: 'Admonish', type: 'VERB', def: 'To warn or scold someone', example: 'The cat was admonished for knocking over the vase, but its smug face said, "I regret nothing!"' },
                            { word: 'Abrupt', type: 'ADJ', def: 'Sudden, unexpected, without warning', example: 'His abrupt decision to cut his hair at 3 a.m. left him looking like a porcupine in a windstorm.' },
                            { word: 'Content', type: 'ADJ', def: 'Satisfied', example: 'After eating an entire pizza by himself, he was so content that even the thought of dessert couldn\'t move him.' },
                            { word: 'Eccentric', type: 'ADJ', def: 'Uncommon, strange', example: 'His eccentric habit of wearing socks over his shoes made people think he was either a genius or just really confused' }
                        ]
                    },
                    {
                        id: 'cp_set2',
                        title: 'Set 2',
                        status: 'New',
                        words: [
                            { word: 'Eloquent', type: 'ADJ', def: 'Fluent or persuasive in speaking or writing', example: 'His speech was so eloquent that even his dog stopped barking just to listen' },
                            { word: 'Austere', type: 'ADJ', def: 'Plain and without decoration, comforts, or anything extra', example: 'Her living room was so austere that the only decoration was a single chair-perfect for minimalist extreme sports.' },
                            { word: 'Dread', type: 'VERB', def: 'To fear, be afraid of', example: 'He dreaded his mom\'s reaction to the broken vase, but he blamed the wind-inside the house.' },
                            { word: 'Inevitable', type: 'ADJ', def: 'Unavoidable', example: 'It was inevitable that he would trip while texting and walking, as everyone saw it coming-except him' }
                        ]
                    },
                    // Generating mock sets to fill the grid of 12
                    ...Array.from({ length: 10 }).map((_, i) => ({
                        id: `cp_set${i+3}`,
                        title: `Set ${i+3}`,
                        status: i === 0 ? 'Done' : 'New',
                        words: []
                    }))
                ]
            },
            {
                id: 'pkg2',
                title: 'Ivy Global 500 Words',
                description: 'Advanced vocabulary for high scorers.',
                totalWords: 500,
                progress: { mastered: 120, learning: 80, new: 300 },
                sets: Array.from({ length: 12 }).map((_, i) => ({
                    id: `ig_set${i+1}`,
                    title: `Set ${i+1}`,
                    status: i < 3 ? 'Done' : 'New',
                    words: [
                        { word: 'Placeholder', type: 'NOUN', def: 'A word used when real data is pending', example: 'This is a placeholder example.' }
                    ]
                }))
            }
        ];

        // --- COMPONENTS ---

        const Header = ({ goHome }) => (
            <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
                <div className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-2 cursor-pointer" onClick={goHome}>
                        <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">V</div>
                        <h1 className="text-xl font-bold tracking-tight text-slate-800">Vocabify</h1>
                    </div>
                    <div className="w-9 h-9 bg-slate-200 rounded-full flex items-center justify-center text-slate-600 font-semibold cursor-pointer hover:bg-slate-300 transition">
                        U
                    </div>
                </div>
            </header>
        );

        const ProgressBar = ({ progress, total }) => {
            const mPct = (progress.mastered / total) * 100;
            const lPct = (progress.learning / total) * 100;
            const nPct = (progress.new / total) * 100;

            return (
                <div className="mt-4">
                    <div className="flex justify-between text-xs text-slate-500 mb-1 font-medium">
                        <span>{progress.mastered} Mastered</span>
                        <span>{progress.learning} Learning</span>
                        <span>{progress.new} New</span>
                    </div>
                    <div className="h-2 w-full bg-slate-200 rounded-full flex overflow-hidden">
                        <div style={{ width: `${mPct}%` }} className="bg-emerald-500"></div>
                        <div style={{ width: `${lPct}%` }} className="bg-amber-500"></div>
                        <div style={{ width: `${nPct}%` }} className="bg-slate-300"></div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ packages, onSelectPackage }) => (
            <div className="max-w-6xl mx-auto px-6 py-10">
                <h2 className="text-2xl font-bold mb-6">Your Packages</h2>
                <div className="grid md:grid-cols-2 gap-6">
                    {packages.map(pkg => (
                        <div key={pkg.id} 
                             onClick={() => onSelectPackage(pkg)}
                             className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition cursor-pointer group">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h3 className="text-xl font-bold group-hover:text-blue-600 transition">{pkg.title}</h3>
                                    <p className="text-sm text-slate-500 mt-1">{pkg.sets.length} Sets • {pkg.totalWords} Words</p>
                                </div>
                                <div className="w-12 h-12 rounded-full border-4 border-emerald-500 flex items-center justify-center text-sm font-bold text-emerald-600">
                                    {Math.round((pkg.progress.mastered / pkg.totalWords) * 100)}%
                                </div>
                            </div>
                            <ProgressBar progress={pkg.progress} total={pkg.totalWords} />
                        </div>
                    ))}
                </div>
            </div>
        );

        const SetList = ({ pkg, onBack, onSelectSet }) => (
            <div className="max-w-6xl mx-auto px-6 py-10">
                <button onClick={onBack} className="text-slate-500 hover:text-slate-800 font-medium text-sm flex items-center gap-1 mb-6 transition">
                    ← Back to Dashboard
                </button>
                <h2 className="text-3xl font-bold mb-2">{pkg.title}</h2>
                <p className="text-slate-500 mb-8">{pkg.description}</p>
                
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    {pkg.sets.map(set => (
                        <div key={set.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between h-40">
                            <div>
                                <div className="flex justify-between items-start mb-2">
                                    <h3 className="font-bold text-lg">{set.title}</h3>
                                    {set.status === 'Done' && <span className="bg-emerald-100 text-emerald-700 text-xs px-2 py-1 rounded-md font-bold">Done</span>}
                                    {set.status === 'Learning' && <span className="bg-amber-100 text-amber-700 text-xs px-2 py-1 rounded-md font-bold">Learning</span>}
                                </div>
                                <p className="text-xs text-slate-400">{set.words.length || 25} Terms</p>
                            </div>
                            <button 
                                onClick={() => onSelectSet(set)}
                                className="w-full py-2 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-sm font-semibold text-slate-700 transition">
                                {set.status === 'Done' ? 'Practice again' : 'Practice'}
                            </button>
                        </div>
                    ))}
                </div>
            </div>
        );

        const SetOverview = ({ set, onBack, onStartFlashcards }) => (
            <div className="max-w-5xl mx-auto px-6 py-10">
                <button onClick={onBack} className="text-slate-500 hover:text-slate-800 font-medium text-sm flex items-center gap-1 mb-6 transition">
                    ← Back to Sets
                </button>
                <h2 className="text-3xl font-bold mb-6">{set.title} Overview</h2>
                
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                    <div onClick={onStartFlashcards} className="bg-blue-600 text-white p-4 rounded-2xl shadow-sm cursor-pointer hover:bg-blue-700 transition transform hover:-translate-y-1">
                        <div className="text-2xl mb-2">🎴</div>
                        <h4 className="font-bold">Flashcards</h4>
                    </div>
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm opacity-60 cursor-not-allowed">
                        <div className="text-2xl mb-2">🔄</div>
                        <h4 className="font-bold">Matching</h4>
                    </div>
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm opacity-60 cursor-not-allowed">
                        <div className="text-2xl mb-2">⚡</div>
                        <h4 className="font-bold">Speed</h4>
                    </div>
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm opacity-60 cursor-not-allowed">
                        <div className="text-2xl mb-2">📝</div>
                        <h4 className="font-bold">Test</h4>
                    </div>
                </div>

                <h3 className="text-xl font-bold mb-4">Terms in this set ({set.words.length})</h3>
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    {set.words.length === 0 ? (
                        <div className="p-8 text-center text-slate-500">No words populated for this set yet.</div>
                    ) : (
                        <ul className="divide-y divide-slate-100">
                            {set.words.map((word, idx) => (
                                <li key={idx} className="p-4 md:p-6 hover:bg-slate-50 transition">
                                    <div className="flex flex-col md:flex-row gap-4">
                                        <div className="md:w-1/4">
                                            <span className="font-bold text-lg block">{word.word}</span>
                                            <span className="text-xs font-semibold text-slate-400 tracking-wider mt-1 block">{word.type}</span>
                                        </div>
                                        <div className="md:w-3/4">
                                            <p className="text-slate-800 font-medium">{word.def}</p>
                                            <p className="text-slate-500 text-sm mt-2 italic">"{word.example}"</p>
                                        </div>
                                    </div>
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            </div>
        );

        const FlashcardMode = ({ set, onBack }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [completed, setCompleted] = useState(false);
            const words = set.words;

            const flipCard = useCallback(() => setIsFlipped(prev => !prev), []);
            
            const nextCard = useCallback(() => {
                if (currentIndex < words.length - 1) {
                    setIsFlipped(false);
                    setTimeout(() => setCurrentIndex(prev => prev + 1), 150);
                } else {
                    setCompleted(true);
                }
            }, [currentIndex, words.length]);

            const markWrong = useCallback(() => { nextCard(); }, [nextCard]);
            const markCorrect = useCallback(() => { nextCard(); }, [nextCard]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (completed) return;
                    if (e.code === 'Space') {
                        e.preventDefault();
                        flipCard();
                    }
                    if (e.key === '1') {
                        markWrong();
                    }
                    if (e.key === '2') {
                        markCorrect();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [flipCard, markWrong, markCorrect, completed]);

            if (words.length === 0) {
                return (
                    <div className="max-w-3xl mx-auto px-6 py-10 text-center">
                        <h2 className="text-2xl font-bold mb-4">No words in this set.</h2>
                        <button onClick={onBack} className="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold">Go Back</button>
                    </div>
                );
            }

            if (completed) {
                return (
                    <div className="max-w-3xl mx-auto px-6 py-20 text-center flex flex-col items-center">
                        <div className="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center text-4xl mb-6">🎉</div>
                        <h2 className="text-3xl font-bold mb-2">Set Completed!</h2>
                        <p className="text-slate-500 mb-8">Great job studying {set.title}.</p>
                        <button onClick={onBack} className="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition shadow-sm">
                            Return to Set Overview
                        </button>
                    </div>
                );
            }

            const currentWord = words[currentIndex];

            return (
                <div className="max-w-3xl mx-auto px-4 py-8 h-[calc(100vh-64px)] flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={onBack} className="text-slate-500 hover:text-slate-800 font-medium text-sm transition">
                            ← Back
                        </button>
                        <div className="text-sm font-bold text-slate-400">
                            {currentIndex + 1} / {words.length}
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center relative perspective w-full max-w-2xl mx-auto">
                        <div 
                            className={`flip-card w-full h-80 md:h-96 cursor-pointer transform-style-3d ${isFlipped ? 'flipped' : ''}`}
                            onClick={flipCard}
                        >
                            <div className="flip-card-inner relative w-full h-full transform-style-3d shadow-sm hover:shadow-md rounded-2xl">
                                
                                {/* Front */}
                                <div className="absolute w-full h-full bg-white border border-slate-200 rounded-2xl backface-hidden flex flex-col items-center justify-center p-8">
                                    <span className="absolute top-4 right-4 text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">{currentWord.type}</span>
                                    <h2 className="text-4xl md:text-5xl font-bold text-slate-800 text-center">{currentWord.word}</h2>
                                    <p className="absolute bottom-6 text-sm font-medium text-slate-400">Press Space to flip</p>
                                </div>

                                {/* Back */}
                                <div className="absolute w-full h-full bg-white border border-slate-200 rounded-2xl backface-hidden rotate-y-180 flex flex-col items-center justify-center p-8 text-center overflow-y-auto">
                                    <h3 className="text-2xl font-bold text-slate-800 mb-4">{currentWord.def}</h3>
                                    <div className="w-12 h-1 bg-blue-600 rounded-full mb-4 opacity-50"></div>
                                    <p className="text-slate-600 italic">"{currentWord.example}"</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="mt-10 flex flex-col items-center gap-4 pb-10">
                        <div className="flex gap-4 w-full max-w-md justify-center">
                            <button 
                                onClick={markWrong}
                                className="flex-1 py-4 bg-white border-2 border-slate-200 text-slate-600 font-bold rounded-xl hover:border-amber-500 hover:text-amber-600 transition flex items-center justify-center gap-2">
                                <span className="bg-slate-100 text-slate-500 px-2 py-0.5 rounded text-xs">1</span>
                                Still learning
                            </button>
                            <button 
                                onClick={markCorrect}
                                className="flex-1 py-4 bg-white border-2 border-slate-200 text-slate-600 font-bold rounded-xl hover:border-emerald-500 hover:text-emerald-600 transition flex items-center justify-center gap-2">
                                <span className="bg-slate-100 text-slate-500 px-2 py-0.5 rounded text-xs">2</span>
                                Know it
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard'); // dashboard, setList, setOverview, flashcard
            const [selectedPkg, setSelectedPkg] = useState(null);
            const [selectedSet, setSelectedSet] = useState(null);

            const goHome = () => {
                setView('dashboard');
                setSelectedPkg(null);
                setSelectedSet(null);
            };

            const handleSelectPackage = (pkg) => {
                setSelectedPkg(pkg);
                setView('setList');
            };

            const handleSelectSet = (set) => {
                setSelectedSet(set);
                setView('setOverview');
            };

            const handleStartFlashcards = () => {
                setView('flashcard');
            };

            return (
                <div className="font-sans">
                    <Header goHome={goHome} />
                    <main>
                        {view === 'dashboard' && <Dashboard packages={vocabularyData} onSelectPackage={handleSelectPackage} />}
                        {view === 'setList' && <SetList pkg={selectedPkg} onBack={goHome} onSelectSet={handleSelectSet} />}
                        {view === 'setOverview' && <SetOverview set={selectedSet} onBack={() => setView('setList')} onStartFlashcards={handleStartFlashcards} />}
                        {view === 'flashcard' && <FlashcardMode set={selectedSet} onBack={() => setView('setOverview')} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
