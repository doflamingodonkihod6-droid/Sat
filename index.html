9-fallacious","word":"Fallacious","pos":"OTHER","definition":"Based on a mistaken belief","example":"The argument was fallacious and misleading.","antonym":"Logical"},{"id":"ivy-global-s19-fallacy","word":"Fallacy","pos":"OTHER","definition":"A false or mistaken idea","example":"The belief that vaccines cause autism is a fallacy.","antonym":"Truth"},{"id":"ivy-global-s19-fraudulent","word":"Fraudulent","pos":"OTHER","definition":"Dishonest or deceptive","example":"The fraudulent scheme cost investors millions.","antonym":"Honest"},{"id":"ivy-global-s19-furtive","word":"Furtive","pos":"OTHER","definition":"Attempting to avoid notice or attention","example":"She gave him a furtive glance as she passed.","antonym":"Open"},{"id":"ivy-global-s19-incredulous-incredulity","word":"Incredulous, Incredulity","pos":"OTHER","definition":"Unwilling to believe something","example":"She was incredulous when she heard the shocking news.","antonym":"Trusting"},{"id":"ivy-global-s19-indeterminate","word":"Indeterminate","pos":"OTHER","definition":"Not exactly known, established, or defined","example":"The cause of the accident is still indeterminate.","antonym":"Certain"},{"id":"ivy-global-s19-inscrutable","word":"Inscrutable","pos":"OTHER","definition":"Impossible to understand or interpret","example":"His inscrutable expression made it hard to tell what he was thinking.","antonym":"Transparent"},{"id":"ivy-global-s19-irony-ironic","word":"Irony, Ironic","pos":"OTHER","definition":"The use of words to convey a meaning that is opposite of its literal meaning","example":"It was ironic that the fire station burned down.","antonym":"Sincerity"},{"id":"ivy-global-s19-ostensible","word":"Ostensible","pos":"OTHER","definition":"Appearing to be true, but not necessarily so","example":"The ostensible reason for his absence was illness.","antonym":"Real"},{"id":"ivy-global-s19-plausible-plausibility","word":"Plausible, Plausibility","pos":"OTHER","definition":"Seeming reasonable or probable","example":"His explanation for the mistake seemed plausible.","antonym":"Improbable"},{"id":"ivy-global-s19-pretext","word":"Pretext","pos":"OTHER","definition":"A reason given in justification that is not the real reason","example":"He used the meeting as a pretext to leave work early.","antonym":"Truth"},{"id":"ivy-global-s19-prevaricator","word":"Prevaricator","pos":"OTHER","definition":"A person who speaks falsely; a liar","example":"The prevaricator twisted the truth to suit his own needs.","antonym":"Honest person"},{"id":"ivy-global-s19-rectify-rectitude","word":"Rectify, Rectitude","pos":"VERB","definition":"To correct or make right","example":"He tried to rectify his mistake by apologizing.","antonym":"Worsen"},{"id":"ivy-global-s19-refutation-refute","word":"Refutation, Refute","pos":"OTHER","definition":"The act of proving something wrong","example":"The refutation of his argument was swift and thorough.","antonym":"Confirmation"},{"id":"ivy-global-s19-sanctimonious","word":"Sanctimonious","pos":"OTHER","definition":"Making a show of being morally superior","example":"His sanctimonious attitude alienated his friends.","antonym":"Humble"},{"id":"ivy-global-s19-sophistry","word":"Sophistry","pos":"OTHER","definition":"The use of clever but false arguments","example":"The politician used sophistry to win the debate.","antonym":"Honesty"},{"id":"ivy-global-s19-spurious","word":"Spurious","pos":"OTHER","definition":"Not being what it purports to be; false or fake","example":"The spurious documents were quickly exposed as forgeries.","antonym":"Genuine"},{"id":"ivy-global-s19-substantiate","word":"Substantiate","pos":"VERB","definition":"To provide evidence to support or prove","example":"He could not substantiate his claims with any real evidence.","antonym":"Disprove"},{"id":"ivy-global-s19-auspicious","word":"Auspicious","pos":"OTHER","definition":"Conducive to success; favorable","example":"The sunny weather was an auspicious sign for the wedding.","antonym":"Inauspicious"},{"id":"ivy-global-s19-barrage","word":"Barrage","pos":"OTHER","definition":"A concentrated outpouring, as of questions or blows","example":"The reporter faced a barrage of questions from the press.","antonym":"Trickle"},{"id":"ivy-global-s19-belligerent","word":"Belligerent","pos":"OTHER","definition":"Hostile and aggressive","example":"The belligerent crowd became violent after the match.","antonym":"Peaceful"},{"id":"ivy-global-s19-blighted","word":"Blighted","pos":"OTHER","definition":"In a state of decline or decay","example":"The blighted neighborhood was once a thriving community.","antonym":"Flourishing"},{"id":"ivy-global-s19-bolster","word":"Bolster","pos":"VERB","definition":"To support or strengthen","example":"The success of the project bolstered his confidence.","antonym":"Weaken"},{"id":"ivy-global-s19-buttress","word":"Buttress","pos":"VERB","definition":"To support","example":"I buttressed m argument with an evidence","antonym":"Weaken"}]},{"id":"ivy-global-set-20","index":20,"name":"Set 20","words":[{"id":"ivy-global-s20-circumvent","word":"Circumvent","pos":"VERB","definition":"To find a way around an obstacle","example":"He circumvented the problem by using a different approach.","antonym":"Confront"},{"id":"ivy-global-s20-conflagration","word":"Conflagration","pos":"OTHER","definition":"A large, destructive fire","example":"The forest conflagration destroyed thousands of acres.","antonym":"Extinguishin g"},{"id":"ivy-global-s20-contentious","word":"Contentious","pos":"OTHER","definition":"Causing or likely to cause disagreement","example":"The contentious issue divided the community.","antonym":"Agreeable"},{"id":"ivy-global-s20-decimate","word":"Decimate","pos":"VERB","definition":"To destroy a large part of","example":"The disease decimated the population of the village.","antonym":"Build"},{"id":"ivy-global-s20-deleterious","word":"Deleterious","pos":"OTHER","definition":"Harmful or damaging","example":"The chemicals had a deleterious effect on the environment.","antonym":"Beneficial"},{"id":"ivy-global-s20-depravity","word":"Depravity","pos":"OTHER","definition":"Moral corruption","example":"The depravity of his actions shocked the community.","antonym":"Virtue"},{"id":"ivy-global-s20-dire","word":"Dire","pos":"OTHER","definition":"Extremely serious or urgent","example":"They were in dire need of medical assistance.","antonym":"Trivial"},{"id":"ivy-global-s20-divergent","word":"Divergent","pos":"OTHER","definition":"Differing from the standard or norm","example":"Their divergent opinions led to a heated argument.","antonym":"Convergent"},{"id":"ivy-global-s20-divisive","word":"Divisive","pos":"OTHER","definition":"Tending to cause disagreement or hostility","example":"The politician's divisive rhetoric alienated many voters.","antonym":"Unifying"},{"id":"ivy-global-s20-elude","word":"Elude","pos":"VERB","definition":"To evade or escape from","example":"The suspect managed to elude the police.","antonym":"Confront"},{"id":"ivy-global-s20-elusive","word":"Elusive","pos":"OTHER","definition":"Difficult to find, catch, or achieve","example":"Success remained elusive despite their best efforts.","antonym":"Obtainable"},{"id":"ivy-global-s20-embitter-ed","word":"Embitter(ed)","pos":"VERB","definition":"To make someone feel bitter or resentful","example":"The loss embittered him for years.","antonym":"Soothe"},{"id":"ivy-global-s20-encumbrance","word":"Encumbrance","pos":"OTHER","definition":"A burden or impediment","example":"The heavy bag was an encumbrance during the hike.","antonym":"Aid"},{"id":"ivy-global-s20-fortuitous","word":"Fortuitous","pos":"OTHER","definition":"Happening by chance rather than intention","example":"The meeting was a fortuitous coincidence.","antonym":"Planned"},{"id":"ivy-global-s20-marred","word":"Marred","pos":"OTHER","definition":"Impaired the appearance of; disfigured","example":"The scratch marred the surface of the table.","antonym":"Enhanced"},{"id":"ivy-global-s20-nefarious","word":"Nefarious","pos":"OTHER","definition":"Wicked or criminal","example":"The nefarious villain plotted to take over the world.","antonym":"Honorable"},{"id":"ivy-global-s20-palliate-palliative","word":"Palliate, Palliative","pos":"VERB","definition":"To relieve or lessen without curing","example":"The medicine palliated the symptoms but did not cure the illness.","antonym":"Aggravate"},{"id":"ivy-global-s20-precarious","word":"Precarious","pos":"OTHER","definition":"Not securely held or in position; dangerously likely to fall or collapse","example":"The ladder was placed in a precarious position.","antonym":"Stable"},{"id":"ivy-global-s20-raze","word":"Raze","pos":"VERB","definition":"To completely destroy","example":"The old building was razed to make way for a new development.","antonym":"Build"},{"id":"ivy-global-s20-serendipity","word":"Serendipity","pos":"OTHER","definition":"The occurrence of events by chance in a happy or beneficial way","example":"Finding the rare book at the store was pure serendipity.","antonym":"Misfortune"},{"id":"ivy-global-s20-spartan","word":"Spartan","pos":"OTHER","definition":"Showing the indifference to comfort or luxury","example":"His spartan lifestyle involved few possessions and no luxuries.","antonym":"Luxurious"},{"id":"ivy-global-s20-vanquish","word":"Vanquish","pos":"VERB","definition":"To defeat thoroughly","example":"The army vanquished its enemies in a decisive battle.","antonym":"Surrender"},{"id":"ivy-global-s20-vigilant","word":"Vigilant","pos":"OTHER","definition":"Keeping careful watch for possible danger","example":"The guards remained vigilant throughout the night.","antonym":"Negligent"},{"id":"ivy-global-s20-vindictive","word":"Vindictive","pos":"OTHER","definition":"Having or showing a strong desire for revenge","example":"Her vindictive actions were driven by years of resentment.","antonym":"Forgiving"},{"id":"ivy-global-s20-virulent","word":"Virulent","pos":"OTHER","definition":"Extremely harmful or poisonous","example":"The virulent strain of the virus spread rapidly, leading to a public health crisis.","antonym":"Harmless, Benign"}]}]},{"id":"sat-prepositions","name":"SAT Prepositions","totalWords":100,"sets":[{"id":"sat-prep-set-1","index":1,"name":"Set 1","words":[{"id":"sat-prep-s1-capable-of","word":"Capable of","pos":"PREP","definition":"Having the ability or skill needed to do something.","example":"After months of practice, she was finally capable of performing the piece from memory."},{"id":"sat-prep-s1-aware-of","word":"Aware of","pos":"PREP","definition":"Having knowledge or perception of a situation or fact.","example":"The committee was fully aware of the budget shortfall before the meeting began."},{"id":"sat-prep-s1-conscious-of","word":"Conscious of","pos":"PREP","definition":"Aware of and attentive to something, often one’s own state or behavior.","example":"He grew increasingly conscious of the time as the deadline approached."},{"id":"sat-prep-s1-devoid-of","word":"Devoid of","pos":"PREP","definition":"Completely lacking or without something.","example":"The abandoned warehouse was devoid of any furniture or equipment."},{"id":"sat-prep-s1-independent-of","word":"Independent of","pos":"PREP","definition":"Not influenced or controlled by; separate from.","example":"The results were independent of the researchers’ initial expectations."},{"id":"sat-prep-s1-regardless-of","word":"Regardless of","pos":"PREP","definition":"Without being affected or influenced by something; despite.","example":"The festival will proceed regardless of the weather forecast."},{"id":"sat-prep-s1-indicative-of","word":"Indicative of","pos":"PREP","definition":"Serving as a sign or suggestion of something.","example":"A sudden drop in sales is often indicative of a larger economic slowdown."},{"id":"sat-prep-s1-characteristic-of","word":"Characteristic of","pos":"PREP","definition":"Typical of a particular person, thing, or category.","example":"Her calm response was characteristic of how she handled every crisis."},{"id":"sat-prep-s1-consist-of","word":"Consist of","pos":"PREP","definition":"To be made up of particular parts or elements.","example":"The exam will consist of three essays and one short-answer section."},{"id":"sat-prep-s1-composed-of","word":"Composed of","pos":"PREP","definition":"Made up of certain parts or members.","example":"The council is composed of representatives from each district."},{"id":"sat-prep-s1-accustomed-to","word":"Accustomed to","pos":"PREP","definition":"Familiar with something because of frequent exposure or experience.","example":"After a year abroad, she grew accustomed to eating dinner much later."},{"id":"sat-prep-s1-committed-to","word":"Committed to","pos":"PREP","definition":"Dedicated to a cause, plan, or relationship.","example":"The company remains committed to reducing its carbon footprint."},{"id":"sat-prep-s1-devoted-to","word":"Devoted to","pos":"PREP","definition":"Giving a great deal of love, time, or loyalty to someone or something.","example":"He devoted himself entirely to restoring the old library."},{"id":"sat-prep-s1-opposed-to","word":"Opposed to","pos":"PREP","definition":"Disagreeing with or against something.","example":"Several board members were strongly opposed to the merger."},{"id":"sat-prep-s1-prone-to","word":"Prone to","pos":"PREP","definition":"Likely to experience or do something, especially something negative.","example":"The coastal region is prone to sudden flooding during the rainy season."},{"id":"sat-prep-s1-susceptible-to","word":"Susceptible to","pos":"PREP","definition":"Likely to be influenced, harmed, or affected by something.","example":"Young seedlings are especially susceptible to frost damage."},{"id":"sat-prep-s1-immune-to","word":"Immune to","pos":"PREP","definition":"Not affected by something; protected against it.","example":"Years in the industry had made her immune to criticism from competitors."},{"id":"sat-prep-s1-resistant-to","word":"Resistant to","pos":"PREP","definition":"Able to withstand the effect of something.","example":"The new coating makes the fabric resistant to stains."},{"id":"sat-prep-s1-subject-to","word":"Subject to","pos":"PREP","definition":"Likely to experience or be affected by something; under someone’s authority.","example":"All flights are subject to delay during winter storms."},{"id":"sat-prep-s1-sensitive-to","word":"Sensitive to","pos":"PREP","definition":"Easily affected by, or quick to respond to, something.","example":"The instrument is sensitive to even the slightest change in temperature."}]},{"id":"sat-prep-set-2","index":2,"name":"Set 2","words":[{"id":"sat-prep-s2-responsible-for","word":"Responsible for","pos":"PREP","definition":"Having control over, or accountability for, something.","example":"The new manager is responsible for the entire logistics team."},{"id":"sat-prep-s2-accountable-for","word":"Accountable for","pos":"PREP","definition":"Required to justify or answer for one’s actions or decisions.","example":"Elected officials should be held accountable for their public promises."},{"id":"sat-prep-s2-famous-for","word":"Famous for","pos":"PREP","definition":"Well known because of a particular quality or achievement.","example":"The town is famous for its annual lantern festival."},{"id":"sat-prep-s2-notorious-for","word":"Notorious for","pos":"PREP","definition":"Well known for something generally considered negative.","example":"The intersection is notorious for its heavy traffic during rush hour."},{"id":"sat-prep-s2-eligible-for","word":"Eligible for","pos":"PREP","definition":"Qualified or entitled to something, according to set requirements.","example":"Students with a 3.5 GPA or higher are eligible for the scholarship."},{"id":"sat-prep-s2-grateful-for","word":"Grateful for","pos":"PREP","definition":"Feeling or showing appreciation for something.","example":"She was grateful for the extra time to revise her essay."},{"id":"sat-prep-s2-prepared-for","word":"Prepared for","pos":"PREP","definition":"Ready to deal with something that may happen.","example":"The coach made sure the team was prepared for any outcome."},{"id":"sat-prep-s2-qualified-for","word":"Qualified for","pos":"PREP","definition":"Having the necessary skills or requirements for something.","example":"Only candidates with a nursing license are qualified for the position."},{"id":"sat-prep-s2-necessary-for","word":"Necessary for","pos":"PREP","definition":"Required for a particular purpose or outcome.","example":"A stable internet connection is necessary for the online exam."},{"id":"sat-prep-s2-essential-to","word":"Essential to","pos":"PREP","definition":"Absolutely necessary for something to happen or exist.","example":"Clear communication is essential to any successful negotiation."},{"id":"sat-prep-s2-crucial-to","word":"Crucial to","pos":"PREP","definition":"Extremely important to the success or existence of something.","example":"Early detection is crucial to treating the disease effectively."},{"id":"sat-prep-s2-central-to","word":"Central to","pos":"PREP","definition":"Being a main or essential part of something.","example":"Trust is central to any long-term business partnership."},{"id":"sat-prep-s2-similar-to","word":"Similar to","pos":"PREP","definition":"Having features or qualities in common with something else.","example":"The proposed policy is similar to one already adopted by a neighboring state."},{"id":"sat-prep-s2-identical-to","word":"Identical to","pos":"PREP","definition":"Exactly the same as something else.","example":"Her signature was nearly identical to her sister’s."},{"id":"sat-prep-s2-equivalent-to","word":"Equivalent to","pos":"PREP","definition":"Equal in value, meaning, or importance to something else.","example":"One kilometer is roughly equivalent to 0.6 miles."},{"id":"sat-prep-s2-preferable-to","word":"Preferable to","pos":"PREP","definition":"More desirable or suitable than something else.","example":"A short delay is preferable to rushing the project and making mistakes."},{"id":"sat-prep-s2-superior-to","word":"Superior to","pos":"PREP","definition":"Higher in quality, rank, or ability than something else.","example":"The updated model is clearly superior to the one it replaced."},{"id":"sat-prep-s2-inferior-to","word":"Inferior to","pos":"PREP","definition":"Lower in quality, rank, or ability than something else.","example":"Critics argued the sequel was inferior to the original film."},{"id":"sat-prep-s2-prior-to","word":"Prior to","pos":"PREP","definition":"Before a particular time or event.","example":"Applicants must submit all documents prior to the deadline."},{"id":"sat-prep-s2-contrary-to","word":"Contrary to","pos":"PREP","definition":"Opposite to, or in conflict with, something.","example":"Contrary to popular belief, the experiment did not confirm the hypothesis."}]},{"id":"sat-prep-set-3","index":3,"name":"Set 3","words":[{"id":"sat-prep-s3-familiar-with","word":"Familiar with","pos":"PREP","definition":"Having good knowledge of something through experience.","example":"The technician is familiar with nearly every model of printer on the market."},{"id":"sat-prep-s3-acquainted-with","word":"Acquainted with","pos":"PREP","definition":"Having some knowledge of, or a passing familiarity with, something.","example":"New employees spend their first week getting acquainted with company policy."},{"id":"sat-prep-s3-consistent-with","word":"Consistent with","pos":"PREP","definition":"In agreement with, or not contradicting, something.","example":"The witness’s account was consistent with the security footage."},{"id":"sat-prep-s3-compatible-with","word":"Compatible with","pos":"PREP","definition":"Able to exist or work together with something else without conflict.","example":"The new software is not compatible with older operating systems."},{"id":"sat-prep-s3-content-with","word":"Content with","pos":"PREP","definition":"Satisfied with a particular situation and not wanting change.","example":"He seemed perfectly content with a quiet evening at home."},{"id":"sat-prep-s3-concerned-with","word":"Concerned with","pos":"PREP","definition":"Involved with, or interested in, a particular subject.","example":"The report is primarily concerned with long-term environmental effects."},{"id":"sat-prep-s3-associated-with","word":"Associated with","pos":"PREP","definition":"Connected with something, often by cause or reputation.","example":"High stress is closely associated with a range of health problems."},{"id":"sat-prep-s3-obsessed-with","word":"Obsessed with","pos":"PREP","definition":"Unable to stop thinking about something.","example":"By the end of the trip, he was completely obsessed with the local street food."},{"id":"sat-prep-s3-comply-with","word":"Comply with","pos":"PREP","definition":"To act in accordance with a rule, request, or command.","example":"All vendors must comply with the venue’s safety regulations."},{"id":"sat-prep-s3-cope-with","word":"Cope with","pos":"PREP","definition":"To deal effectively with something difficult.","example":"The clinic offers resources to help patients cope with chronic pain."},{"id":"sat-prep-s3-interfere-with","word":"Interfere with","pos":"PREP","definition":"To disrupt or get in the way of something.","example":"Loud construction noise began to interfere with the recording session."},{"id":"sat-prep-s3-compete-with","word":"Compete with","pos":"PREP","definition":"To try to be more successful than another person or thing.","example":"Small bookstores often struggle to compete with large online retailers."},{"id":"sat-prep-s3-different-from","word":"Different from","pos":"PREP","definition":"Not the same as something else.","example":"The final design is quite different from the original sketch."},{"id":"sat-prep-s3-distinct-from","word":"Distinct from","pos":"PREP","definition":"Clearly separate or different from something else.","example":"Ethics is a subject distinct from, though related to, law."},{"id":"sat-prep-s3-separate-from","word":"Separate from","pos":"PREP","definition":"Not connected to, or existing apart from, something.","example":"The guest wing is entirely separate from the main house."},{"id":"sat-prep-s3-derived-from","word":"Derived from","pos":"PREP","definition":"Coming from, or originating in, a particular source.","example":"The word biology is derived from two Greek roots."},{"id":"sat-prep-s3-suffering-from","word":"Suffering from","pos":"PREP","definition":"Experiencing pain, illness, or a difficult condition.","example":"The plant appeared to be suffering from a lack of sunlight."},{"id":"sat-prep-s3-prohibited-from","word":"Prohibited from","pos":"PREP","definition":"Officially not allowed to do something.","example":"Employees are prohibited from accessing the archive without authorization."},{"id":"sat-prep-s3-excluded-from","word":"Excluded from","pos":"PREP","definition":"Not permitted to take part in, or be included in, something.","example":"Freshmen are excluded from the advanced seminar by department policy."},{"id":"sat-prep-s3-refrain-from","word":"Refrain from","pos":"PREP","definition":"To stop oneself from doing something.","example":"Visitors are asked to refrain from touching the exhibits."}]},{"id":"sat-prep-set-4","index":4,"name":"Set 4","words":[{"id":"sat-prep-s4-interested-in","word":"Interested in","pos":"PREP","definition":"Wanting to know about or take part in something.","example":"She’s always been interested in how bridges are engineered."},{"id":"sat-prep-s4-engaged-in","word":"Engaged in","pos":"PREP","definition":"Actively taking part in an activity.","example":"The two diplomats were engaged in a lengthy discussion over trade terms."},{"id":"sat-prep-s4-skilled-in","word":"Skilled in","pos":"PREP","definition":"Having ability or expertise in a particular area.","example":"He is especially skilled in translating technical documents."},{"id":"sat-prep-s4-proficient-in","word":"Proficient in","pos":"PREP","definition":"Competent and skilled in doing or using something.","example":"Applicants should be proficient in at least one programming language."},{"id":"sat-prep-s4-specialize-in","word":"Specialize in","pos":"PREP","definition":"To focus one’s study or work on a particular area.","example":"The clinic specializes in treating sports-related injuries."},{"id":"sat-prep-s4-participate-in","word":"Participate in","pos":"PREP","definition":"To take part in an activity or event.","example":"All students are encouraged to participate in the science fair."},{"id":"sat-prep-s4-indulge-in","word":"Indulge in","pos":"PREP","definition":"To allow oneself to enjoy something, often as a treat.","example":"On weekends, they liked to indulge in a long, slow breakfast."},{"id":"sat-prep-s4-succeed-in","word":"Succeed in","pos":"PREP","definition":"To achieve a desired result or aim in doing something.","example":"Few explorers succeeded in crossing the desert during that season."},{"id":"sat-prep-s4-persist-in","word":"Persist in","pos":"PREP","definition":"To continue doing something despite difficulty or opposition.","example":"Despite the setbacks, the team persisted in testing new prototypes."},{"id":"sat-prep-s4-result-in","word":"Result in","pos":"PREP","definition":"To cause a particular outcome.","example":"The merger is expected to result in significant cost savings."},{"id":"sat-prep-s4-believe-in","word":"Believe in","pos":"PREP","definition":"To have faith or confidence in something or someone.","example":"Good mentors believe in their students even before the students believe in themselves."},{"id":"sat-prep-s4-invest-in","word":"Invest in","pos":"PREP","definition":"To put money, time, or effort into something for future benefit.","example":"The city plans to invest in public transportation over the next decade."},{"id":"sat-prep-s4-skilled-at","word":"Skilled at","pos":"PREP","definition":"Able to do something well through practice or talent.","example":"She’s remarkably skilled at defusing tense situations."},{"id":"sat-prep-s4-amazed-at","word":"Amazed at","pos":"PREP","definition":"Filled with great surprise or wonder because of something.","example":"Visitors are often amazed at the size of the ancient structure."},{"id":"sat-prep-s4-astonished-at","word":"Astonished at","pos":"PREP","definition":"Extremely surprised by something.","example":"The judges were astonished at how quickly the puzzle was solved."},{"id":"sat-prep-s4-alarmed-at","word":"Alarmed at","pos":"PREP","definition":"Feeling worried or frightened because of something.","example":"Residents were alarmed at the sudden rise in the river’s water level."},{"id":"sat-prep-s4-depend-on","word":"Depend on","pos":"PREP","definition":"To rely on something or someone for support or a result.","example":"The harvest depends heavily on rainfall in early summer."},{"id":"sat-prep-s4-rely-on","word":"Rely on","pos":"PREP","definition":"To trust in, or need, something or someone.","example":"Small businesses often rely on word of mouth to attract customers."},{"id":"sat-prep-s4-reliant-on","word":"Reliant on","pos":"PREP","definition":"Dependent on something for support or supply.","example":"The region remains heavily reliant on a single export crop."},{"id":"sat-prep-s4-insist-on","word":"Insist on","pos":"PREP","definition":"To demand something firmly, refusing to accept a refusal.","example":"The landlord insisted on a signed lease before move-in."}]},{"id":"sat-prep-set-5","index":5,"name":"Set 5","words":[{"id":"sat-prep-s5-contribute-to","word":"Contribute to","pos":"PREP","definition":"To give something, especially money, help, or ideas, toward a common purpose.","example":"Volunteers contribute to the shelter in many different ways."},{"id":"sat-prep-s5-adapt-to","word":"Adapt to","pos":"PREP","definition":"To change one’s behavior or approach to suit new conditions.","example":"It took the team a few weeks to adapt to the new schedule."},{"id":"sat-prep-s5-attribute-to","word":"Attribute to","pos":"PREP","definition":"To say or believe that something is caused by a particular thing.","example":"Historians attribute the city’s decline to a series of poor harvests."},{"id":"sat-prep-s5-react-to","word":"React to","pos":"PREP","definition":"To respond to something, especially with a particular feeling or action.","example":"The crowd reacted to the announcement with stunned silence."},{"id":"sat-prep-s5-respond-to","word":"Respond to","pos":"PREP","definition":"To say or do something as a reaction to something else.","example":"The mayor’s office has yet to respond to the petition."},{"id":"sat-prep-s5-object-to","word":"Object to","pos":"PREP","definition":"To express disapproval of, or opposition to, something.","example":"Several residents object to the proposed height of the new building."},{"id":"sat-prep-s5-refer-to","word":"Refer to","pos":"PREP","definition":"To mention, or direct attention to, something.","example":"The footnote refers to an earlier study on the same topic."},{"id":"sat-prep-s5-aspire-to","word":"Aspire to","pos":"PREP","definition":"To hope for, or aim to achieve, something.","example":"Many young engineers aspire to work on renewable energy projects."},{"id":"sat-prep-s5-adhere-to","word":"Adhere to","pos":"PREP","definition":"To act in accordance with a rule, belief, or agreement.","example":"All contractors must adhere to the updated safety code."},{"id":"sat-prep-s5-amount-to","word":"Amount to","pos":"PREP","definition":"To add up to or be equivalent to something.","example":"Her contributions amounted to nearly half the project’s funding."},{"id":"sat-prep-s5-belong-to","word":"Belong to","pos":"PREP","definition":"To be the property of, or a proper part of, someone or something.","example":"This particular tradition belongs to a much older harvest festival."},{"id":"sat-prep-s5-appeal-to","word":"Appeal to","pos":"PREP","definition":"To be attractive or of interest to someone.","example":"The exhibit was designed to appeal to younger visitors."},{"id":"sat-prep-s5-account-for","word":"Account for","pos":"PREP","definition":"To give a satisfactory reason or explanation for something.","example":"The delay was largely accounted for by a shortage of materials."},{"id":"sat-prep-s5-compensate-for","word":"Compensate for","pos":"PREP","definition":"To make up for a loss, disadvantage, or deficiency.","example":"Extra rehearsal time helped compensate for the missing lead actor."},{"id":"sat-prep-s5-substitute-for","word":"Substitute for","pos":"PREP","definition":"To use, or serve, as a replacement for something.","example":"Applesauce can substitute for oil in many baking recipes."},{"id":"sat-prep-s5-apologize-for","word":"Apologize for","pos":"PREP","definition":"To express regret for something one has done wrong.","example":"The airline apologized for the lengthy delay."},{"id":"sat-prep-s5-advocate-for","word":"Advocate for","pos":"PREP","definition":"To publicly support or argue in favor of something.","example":"The organization advocates for stronger consumer protections."},{"id":"sat-prep-s5-insight-into","word":"Insight into","pos":"PREP","definition":"A clear, deep understanding of a complex situation or subject.","example":"The interviews gave researchers valuable insight into consumer habits."},{"id":"sat-prep-s5-translate-into","word":"Translate into","pos":"PREP","definition":"To convert into a different form, especially another language or a practical result.","example":"Good intentions don’t always translate into effective policy."},{"id":"sat-prep-s5-convert-into","word":"Convert into","pos":"PREP","definition":"To change something into a different form or use.","example":"The old factory was converted into a set of loft apartments."}]}]},{"id":"sat-transitions","name":"SAT Transitions","totalWords":80,"sets":[{"id":"sat-trans-set-1","index":1,"name":"Set 1","words":[{"id":"sat-trans-s1-moreover","word":"Moreover","pos":"TRANS","definition":"Introduces an additional point that reinforces or builds on the previous idea.","example":"The bridge reduced commute times significantly; moreover, it created a scenic new route for cyclists."},{"id":"sat-trans-s1-however","word":"However","pos":"TRANS","definition":"Introduces a statement that contrasts with, or qualifies, what was just said.","example":"The forecast predicted clear skies; however, a sudden storm rolled in by early afternoon."},{"id":"sat-trans-s1-therefore","word":"Therefore","pos":"TRANS","definition":"Introduces a conclusion or result that follows logically from what was just stated.","example":"The bridge failed its final inspection; therefore, the city closed it to all traffic."},{"id":"sat-trans-s1-for-example","word":"For example","pos":"TRANS","definition":"Introduces a specific case that illustrates the preceding general statement.","example":"Many local businesses struggled during the shutdown; for example, the diner on Main Street lost half its regular customers."},{"id":"sat-trans-s1-although","word":"Although","pos":"TRANS","definition":"Introduces a fact that might seem to contradict the main point, before that point is stated.","example":"Although the app was still in beta, thousands of users signed up in its first week."},{"id":"sat-trans-s1-subsequently","word":"Subsequently","pos":"TRANS","definition":"Introduces an event that happened after the one just described.","example":"The company issued a public apology; subsequently, it revised its return policy entirely."},{"id":"sat-trans-s1-similarly","word":"Similarly","pos":"TRANS","definition":"Introduces a second point that closely parallels the one before it.","example":"The northern trail floods every spring; similarly, the southern path becomes impassable after heavy rain."},{"id":"sat-trans-s1-indeed","word":"Indeed","pos":"TRANS","definition":"Reinforces or intensifies the point that was just made.","example":"The renovation was expensive; indeed, it cost nearly twice the original estimate."},{"id":"sat-trans-s1-furthermore","word":"Furthermore","pos":"TRANS","definition":"Adds a further piece of supporting information to what was just said.","example":"The study included a large sample size; furthermore, it was repeated across three different cities."},{"id":"sat-trans-s1-nevertheless","word":"Nevertheless","pos":"TRANS","definition":"Introduces a point that holds true despite what was just stated.","example":"The trail was steep and poorly marked; nevertheless, the hikers reached the summit before sunset."},{"id":"sat-trans-s1-thus","word":"Thus","pos":"TRANS","definition":"Introduces a result or conclusion that follows from the preceding statement.","example":"The lab confirmed the contamination; thus, the entire batch was discarded."},{"id":"sat-trans-s1-for-instance","word":"For instance","pos":"TRANS","definition":"Introduces a specific illustration of a broader claim.","example":"Several small changes improved efficiency; for instance, staggering shift start times cut morning delays in half."},{"id":"sat-trans-s1-even-though","word":"Even though","pos":"TRANS","definition":"Introduces a fact that does not prevent the main statement from being true.","example":"Even though the museum was under renovation, most of its galleries remained open to visitors."},{"id":"sat-trans-s1-meanwhile","word":"Meanwhile","pos":"TRANS","definition":"Introduces an event happening at the same time as the one just described.","example":"The lead singer rehearsed her solo backstage; meanwhile, the rest of the band tuned their instruments."},{"id":"sat-trans-s1-likewise","word":"Likewise","pos":"TRANS","definition":"Signals that the same pattern or idea applies to a second case as well.","example":"The first draft relied heavily on outside sources; likewise, the revision needed stronger original analysis."},{"id":"sat-trans-s1-in-fact","word":"In fact","pos":"TRANS","definition":"Introduces a stronger or more surprising version of the preceding point.","example":"The device barely used any power; in fact, it ran for nearly a week on a single charge."}]},{"id":"sat-trans-set-2","index":2,"name":"Set 2","words":[{"id":"sat-trans-s2-in-addition","word":"In addition","pos":"TRANS","definition":"Introduces one more point alongside what has already been mentioned.","example":"The museum added a new wing; in addition, it extended its weekend hours."},{"id":"sat-trans-s2-nonetheless","word":"Nonetheless","pos":"TRANS","definition":"Introduces an idea that remains true in spite of the preceding statement.","example":"Ticket sales were slow at first; nonetheless, the concert ultimately sold out."},{"id":"sat-trans-s2-consequently","word":"Consequently","pos":"TRANS","definition":"Introduces a direct result of what was just described.","example":"The airline canceled dozens of flights; consequently, thousands of passengers were stranded overnight."},{"id":"sat-trans-s2-specifically","word":"Specifically","pos":"TRANS","definition":"Narrows a general statement down to a particular detail.","example":"The report criticized the budget process; specifically, it flagged a lack of oversight on emergency spending."},{"id":"sat-trans-s2-despite-this","word":"Despite this","pos":"TRANS","definition":"Acknowledges a preceding fact before stating something that holds true anyway.","example":"The bridge was closed for repairs for months; despite this, local businesses reported steady traffic."},{"id":"sat-trans-s2-previously","word":"Previously","pos":"TRANS","definition":"Refers back to a time before the one just discussed.","example":"The tower now houses offices; previously, it served as the city’s main water reservoir."},{"id":"sat-trans-s2-in-the-same-way","word":"In the same way","pos":"TRANS","definition":"Indicates that something happens or is true following the same pattern as before.","example":"The city rebuilt its old rail line to ease congestion; in the same way, the county expanded its bus routes."},{"id":"sat-trans-s2-notably","word":"Notably","pos":"TRANS","definition":"Draws attention to a detail that is especially significant.","example":"Several species returned to the restored wetland; notably, a pair of herons nested there for the first time in decades."},{"id":"sat-trans-s2-additionally","word":"Additionally","pos":"TRANS","definition":"Adds a further detail or point to what has already been stated.","example":"The internship offers hands-on training; additionally, it includes a small stipend."},{"id":"sat-trans-s2-on-the-other-hand","word":"On the other hand","pos":"TRANS","definition":"Introduces a contrasting perspective or possibility.","example":"The coastal route offers better views; on the other hand, the inland road is much faster."},{"id":"sat-trans-s2-as-a-result","word":"As a result","pos":"TRANS","definition":"Introduces an outcome that follows directly from the previous statement.","example":"Demand for the material spiked overnight; as a result, prices doubled within a week."},{"id":"sat-trans-s2-namely","word":"Namely","pos":"TRANS","definition":"Introduces a precise detail that clarifies what was just referred to in general terms.","example":"Only one department met its targets, namely, the customer service team."},{"id":"sat-trans-s2-in-spite-of-this","word":"In spite of this","pos":"TRANS","definition":"Signals that the following statement holds true even given the preceding fact.","example":"The company faced heavy competition all year; in spite of this, its profits continued to climb."},{"id":"sat-trans-s2-afterward","word":"Afterward","pos":"TRANS","definition":"Introduces an event that follows the one just described.","example":"The two teams shook hands at midfield; afterward, they gathered for a joint press conference."},{"id":"sat-trans-s2-by-the-same-token","word":"By the same token","pos":"TRANS","definition":"Introduces a related point that follows the same logic as the one before it.","example":"The company rewards early risk-taking; by the same token, it tolerates the occasional costly failure."},{"id":"sat-trans-s2-above-all","word":"Above all","pos":"TRANS","definition":"Signals that the following point is the most important of those mentioned.","example":"The committee weighed cost, timeline, and safety; above all, it prioritized long-term reliability."}]},{"id":"sat-trans-set-3","index":3,"name":"Set 3","words":[{"id":"sat-trans-s3-also","word":"Also","pos":"TRANS","definition":"Adds another item, fact, or idea to what has already been mentioned.","example":"The recipe calls for fresh basil; it also requires a generous amount of garlic."},{"id":"sat-trans-s3-conversely","word":"Conversely","pos":"TRANS","definition":"Introduces an idea that is the reverse or opposite of what was just described.","example":"Sales rise sharply in December; conversely, they drop off almost entirely in January."},{"id":"sat-trans-s3-hence","word":"Hence","pos":"TRANS","definition":"Introduces a conclusion that follows logically from what was just said.","example":"The evidence pointed to a single cause; hence, investigators closed the case within days."},{"id":"sat-trans-s3-to-illustrate","word":"To illustrate","pos":"TRANS","definition":"Introduces an example meant to clarify or support the preceding statement.","example":"Small design choices can matter enormously; to illustrate, moving a single button doubled the app’s signup rate."},{"id":"sat-trans-s3-granted","word":"Granted","pos":"TRANS","definition":"Concedes a point before shifting to a different or qualifying claim.","example":"Granted, the new policy is more expensive to implement; it should still save money within two years."},{"id":"sat-trans-s3-eventually","word":"Eventually","pos":"TRANS","definition":"Introduces an outcome that occurs after some passage of time.","example":"The negotiations dragged on for months; eventually, both sides agreed to a compromise."},{"id":"sat-trans-s3-just-as-so-too","word":"Just as ... so too","pos":"TRANS","definition":"Draws a direct parallel between two similar situations.","example":"Just as the roots anchor the tree, so too does a strong routine anchor a busy schedule."},{"id":"sat-trans-s3-certainly","word":"Certainly","pos":"TRANS","definition":"Emphatically confirms or reinforces the preceding statement.","example":"The proposal faced criticism at first; certainly, few expected it to pass on the first vote."},{"id":"sat-trans-s3-besides","word":"Besides","pos":"TRANS","definition":"Adds another reason or point, often implying it goes beyond what was already given.","example":"The apartment is close to campus; besides, the rent is lower than most nearby options."},{"id":"sat-trans-s3-in-contrast","word":"In contrast","pos":"TRANS","definition":"Highlights a clear difference between two things being compared.","example":"The original proposal was cautious and incremental; in contrast, the revised plan called for sweeping change."},{"id":"sat-trans-s3-accordingly","word":"Accordingly","pos":"TRANS","definition":"Introduces an action or decision made in response to the preceding situation.","example":"The forecast called for record heat; accordingly, officials opened extra cooling centers across the city."},{"id":"sat-trans-s3-in-particular","word":"In particular","pos":"TRANS","definition":"Highlights one specific case as especially relevant to the general point.","example":"Coastal towns faced serious erosion this year; in particular, the harbor district lost several feet of shoreline."},{"id":"sat-trans-s3-admittedly","word":"Admittedly","pos":"TRANS","definition":"Acknowledges a weaker or less favorable point before continuing the argument.","example":"Admittedly, the survey sample was small, but its results still matched years of larger studies."},{"id":"sat-trans-s3-at-the-same-time","word":"At the same time","pos":"TRANS","definition":"Indicates that two events or conditions occur simultaneously.","example":"The lower deck was being renovated; at the same time, crews repainted the entire hull above it."},{"id":"sat-trans-s3-correspondingly","word":"Correspondingly","pos":"TRANS","definition":"Signals that something changes or happens in a way that matches a related situation.","example":"Enrollment in the program doubled last year; correspondingly, the school added two new sections."},{"id":"sat-trans-s3-clearly","word":"Clearly","pos":"TRANS","definition":"Signals that the following point is obvious or strongly supported by what came before.","example":"Clearly, the original schedule was too optimistic, given how far behind the project has fallen."}]},{"id":"sat-trans-set-4","index":4,"name":"Set 4","words":[{"id":"sat-trans-s4-what-is-more","word":"What is more","pos":"TRANS","definition":"Adds an additional, often stronger, point to reinforce what was just said.","example":"The new engine is quieter than the old one; what is more, it uses far less fuel."},{"id":"sat-trans-s4-yet","word":"Yet","pos":"TRANS","definition":"Introduces a contrasting idea, often after a statement that seems to suggest otherwise.","example":"The device is remarkably small, yet it outperforms machines twice its size."},{"id":"sat-trans-s4-as-a-consequence","word":"As a consequence","pos":"TRANS","definition":"Introduces a direct effect that results from the previous statement.","example":"The factory ignored repeated safety warnings; as a consequence, it was shut down by regulators."},{"id":"sat-trans-s4-such-as","word":"Such as","pos":"TRANS","definition":"Introduces one or more examples of a broader category just mentioned.","example":"The festival features regional dishes, such as smoked trout and wild rice soup."},{"id":"sat-trans-s4-that-said","word":"That said","pos":"TRANS","definition":"Signals a shift toward a qualifying point after acknowledging what was just said.","example":"The restaurant’s service was slow; that said, every dish that arrived was worth the wait."},{"id":"sat-trans-s4-initially","word":"Initially","pos":"TRANS","definition":"Refers to how something was at the start, often before a later change.","example":"Initially, the plan called for a single bridge; the final design added a second span downstream."},{"id":"sat-trans-s4-equally","word":"Equally","pos":"TRANS","definition":"Signals that a similar degree or quality applies to a second case.","example":"The first design impressed the judges; the second was equally inventive."},{"id":"sat-trans-s4-undoubtedly","word":"Undoubtedly","pos":"TRANS","definition":"Strongly emphasizes the certainty of the statement that follows.","example":"Undoubtedly, the new filtration system made the biggest difference in water quality."},{"id":"sat-trans-s4-not-only-but-also","word":"Not only ... but also","pos":"TRANS","definition":"Signals that a second point extends beyond, and adds weight to, the first.","example":"The program not only trains new volunteers but also connects them with local mentors."},{"id":"sat-trans-s4-still","word":"Still","pos":"TRANS","definition":"Introduces a point that remains true despite what precedes it.","example":"The results were disappointing; still, the team learned enough to improve the next attempt."},{"id":"sat-trans-s4-for-this-reason","word":"For this reason","pos":"TRANS","definition":"Introduces an outcome or decision that is explained by the previous statement.","example":"The old wiring posed a serious fire risk; for this reason, the building was evacuated."},{"id":"sat-trans-s4-as-an-illustration","word":"As an illustration","pos":"TRANS","definition":"Introduces a concrete example meant to clarify a general statement.","example":"Minor policy shifts can have outsized effects; as an illustration, one new signup step cut registrations by a third."},{"id":"sat-trans-s4-regardless","word":"Regardless","pos":"TRANS","definition":"Indicates that the following statement holds true no matter what was just mentioned.","example":"The vote was close and contentious; regardless, the new budget passed by a single point."},{"id":"sat-trans-s4-ultimately","word":"Ultimately","pos":"TRANS","definition":"Introduces a final outcome after a process or series of events.","example":"The two proposals were debated for weeks; ultimately, the board chose the more affordable option."},{"id":"sat-trans-s4-in-comparison","word":"In comparison","pos":"TRANS","definition":"Signals that a direct comparison is being drawn between two things or situations.","example":"The new stadium seats forty thousand fans; in comparison, the old one held barely half that number."},{"id":"sat-trans-s4-in-effect","word":"In effect","pos":"TRANS","definition":"Restates the practical or real-world significance of what was just described.","example":"The new rule doubled the paperwork required for small vendors; in effect, it pushed many out of the bidding process entirely."}]},{"id":"sat-trans-set-5","index":5,"name":"Set 5","words":[{"id":"sat-trans-s5-as-well-as","word":"As well as","pos":"TRANS","definition":"Adds an additional element alongside the one already mentioned.","example":"The festival features live music as well as a full lineup of local food vendors."},{"id":"sat-trans-s5-even-so","word":"Even so","pos":"TRANS","definition":"Acknowledges the previous point while introducing a contrasting one.","example":"The plan had clear flaws; even so, the board voted to move forward."},{"id":"sat-trans-s5-so","word":"So","pos":"TRANS","definition":"Introduces a result or conclusion, often in a more casual or direct tone.","example":"The trail was closed due to flooding, so the rangers rerouted every hiker through the north entrance."},{"id":"sat-trans-s5-in-this-case","word":"In this case","pos":"TRANS","definition":"Refers to the specific situation just mentioned as a relevant instance.","example":"Most models overheated under heavy use; in this case, only the redesigned version stayed within a safe range."},{"id":"sat-trans-s5-of-course","word":"Of course","pos":"TRANS","definition":"Acknowledges an obvious or expected point before introducing a related idea.","example":"Of course, the renovation took longer than planned, but the final result exceeded expectations."},{"id":"sat-trans-s5-first-then","word":"First ... then","pos":"TRANS","definition":"Signals a clear sequence of steps or events in order.","example":"First the crew cleared the debris; then they began repairing the damaged foundation."},{"id":"sat-trans-s5-along-with","word":"Along with","pos":"TRANS","definition":"Indicates that something accompanies or is included together with something else.","example":"The kit comes with a full set of instructions, along with all the necessary hardware."},{"id":"sat-trans-s5-whereas","word":"Whereas","pos":"TRANS","definition":"Directly contrasts two facts or situations within a single sentence.","example":"The east wing was built from stone, whereas the newer addition relies mostly on glass and steel."},{"id":"sat-trans-s5-thereby","word":"Thereby","pos":"TRANS","definition":"Introduces a result that is directly enabled or caused by the action just described.","example":"The new filter captures nearly all airborne particles, thereby improving air quality throughout the building."},{"id":"sat-trans-s5-finally","word":"Finally","pos":"TRANS","definition":"Introduces the last in a series of points or steps.","example":"Finally, the crew tested every system one more time before declaring the bridge ready to reopen."},{"id":"sat-trans-s5-equally-important","word":"Equally important","pos":"TRANS","definition":"Signals that the next point carries similar weight to the one before it.","example":"The bridge needed structural repairs; equally important, its lighting system had failed years earlier."},{"id":"sat-trans-s5-on-the-contrary","word":"On the contrary","pos":"TRANS","definition":"Directly rejects the previous statement and asserts the opposite.","example":"The critics assumed the film would flop; on the contrary, it became the studio’s biggest hit of the year."},{"id":"sat-trans-s5-on-top-of-that","word":"On top of that","pos":"TRANS","definition":"Introduces an additional point, often one that adds further weight to what was already substantial.","example":"The venue was already over budget; on top of that, the sound system needed a last-minute replacement."},{"id":"sat-trans-s5-instead","word":"Instead","pos":"TRANS","definition":"Introduces an alternative that replaces what was expected or previously mentioned.","example":"The committee did not select the cheapest bid; instead, it chose the proposal with the strongest safety record."},{"id":"sat-trans-s5-by-contrast","word":"By contrast","pos":"TRANS","definition":"Highlights a difference by directly comparing it to what was just mentioned.","example":"Last year’s harvest was the region’s best in a decade; by contrast, this year’s yield was disappointingly small."},{"id":"sat-trans-s5-rather","word":"Rather","pos":"TRANS","definition":"Introduces a corrected or more accurate alternative to what was just implied.","example":"The delay was not caused by weather; rather, it resulted from a scheduling error."}]}]},{"id":"sat-conventions","name":"Standard English Conventions","totalWords":37,"sets":[{"id":"sat-conv-set-1","index":1,"name":"Set 1","words":[{"id":"sat-conv-s1-comma-fanboys","word":"Comma + FANBOYS","pos":"BOUND","definition":"Place a comma before a coordinating conjunction—for, and, nor, but, or, yet, so—that joins two independent clauses.","example":"The theater raised its ticket prices, but attendance still climbed every weekend."},{"id":"sat-conv-s1-semicolon-clauses","word":"Semicolon Between Clauses","pos":"BOUND","definition":"Join two independent clauses with a semicolon alone when no coordinating conjunction connects them.","example":"The lab results were inconclusive; the team decided to rerun the entire experiment."},{"id":"sat-conv-s1-comma-splice","word":"Comma Splice","pos":"BOUND","definition":"Two independent clauses joined by only a comma; fix the error with a semicolon, a period, or a comma plus a coordinating conjunction.","example":"The band’s set ran long, so the opening act lost fifteen minutes of stage time."},{"id":"sat-conv-s1-run-on","word":"Run-on Sentence","pos":"BOUND","definition":"Two independent clauses fused together with no punctuation or conjunction between them at all.","example":"The council debated the proposal for hours; residents packed the room to hear the outcome."},{"id":"sat-conv-s1-fragment","word":"Sentence Fragment","pos":"BOUND","definition":"A group of words punctuated as a sentence but missing an independent clause, often a stray dependent clause standing alone.","example":"Because the ferry was delayed, commuters crowded the dock and waited."},{"id":"sat-conv-s1-semicolon-transition","word":"Semicolon + Transition","pos":"BOUND","definition":"Use a semicolon before a conjunctive adverb such as however, therefore, or moreover when it links two independent clauses, then a comma after it.","example":"The startup’s revenue doubled; however, its expenses grew even faster."},{"id":"sat-conv-s1-comma-intro","word":"Comma After Introduction","pos":"BOUND","definition":"Place a comma after an introductory word, phrase, or dependent clause that comes before the main clause.","example":"After the marathon ended, volunteers handed water bottles to every finisher."},{"id":"sat-conv-s1-compound-predicate","word":"Compound Predicate, No Comma","pos":"BOUND","definition":"Don’t place a comma between two verbs that share the same subject; that break turns the second verb into a fragment.","example":"The committee reviewed the budget and approved the new hires."},{"id":"sat-conv-s1-direct-indirect-question","word":"Direct vs. Indirect Question","pos":"BOUND","definition":"End a direct question with a question mark, but end an indirect question folded into a statement with a period.","example":"The curator asked whether the painting’s frame was original."}]},{"id":"sat-conv-set-2","index":2,"name":"Set 2","words":[{"id":"sat-conv-s2-colon-list","word":"Colon Introduces a List","pos":"BOUND","definition":"Use a colon after a complete independent clause to introduce a list, explanation, or example.","example":"The recipe called for three ingredients: ripe mangoes, lime juice, and chili powder."},{"id":"sat-conv-s2-no-colon-fragment","word":"No Colon After a Fragment","pos":"BOUND","definition":"Skip the colon when the words before it don’t already form a complete sentence on their own.","example":"The chef’s three essentials are ripe mangoes, lime juice, and chili powder."},{"id":"sat-conv-s2-dashes-extra-info","word":"Dashes for Extra Information","pos":"BOUND","definition":"Use a pair of dashes, like a pair of commas, to set off extra information that could be removed without changing the sentence’s core meaning.","example":"The observatory’s oldest telescope—installed in 1932—still tracks meteor showers today."},{"id":"sat-conv-s2-commas-nonessential","word":"Commas Around Nonessential Info","pos":"BOUND","definition":"Use commas to set off a nonessential clause or phrase that adds detail but isn’t needed to identify the noun it describes.","example":"The novel, which took the author a decade to finish, became an instant bestseller."},{"id":"sat-conv-s2-no-commas-essential","word":"No Commas Around Essential Info","pos":"BOUND","definition":"Skip the commas around an essential clause or phrase that’s needed to identify exactly which noun is meant.","example":"Students who arrive after the bell must sign in at the front office."},{"id":"sat-conv-s2-commas-series","word":"Commas in a Series","pos":"BOUND","definition":"Separate three or more items in a list with commas, including one before the final conjunction.","example":"The market sold fresh basil, heirloom tomatoes, and jars of local honey."},{"id":"sat-conv-s2-apostrophe-possession","word":"Apostrophe for Possession","pos":"BOUND","definition":"Add ’s to a singular noun and just an apostrophe to a plural noun that already ends in s to show possession.","example":"The scientists’ findings supported the museum’s new exhibit on ocean currents."},{"id":"sat-conv-s2-its-vs-its","word":"Its vs. It’s","pos":"BOUND","definition":"Its shows possession with no apostrophe; it’s is always a contraction of it is or it has.","example":"It’s rare for a storm to change its path so quickly."},{"id":"sat-conv-s2-single-dash","word":"Single Dash for Emphasis","pos":"BOUND","definition":"Use one dash to attach a final, emphatic, or explanatory element to the end of a sentence.","example":"The team had one goal left—win the championship."}]},{"id":"sat-conv-set-3","index":3,"name":"Set 3","words":[{"id":"sat-conv-s3-subject-verb","word":"Subject-Verb Agreement","pos":"FORM","definition":"Match the verb to its true subject in number, not to a noun in a phrase that happens to sit between them.","example":"The list of new applicants grows longer every week."},{"id":"sat-conv-s3-agreement-indefinite","word":"Agreement with Indefinite Pronouns","pos":"FORM","definition":"Treat indefinite pronouns like each, everyone, and neither as singular, so they take a singular verb.","example":"Each of the finalists submits a portfolio before the interview."},{"id":"sat-conv-s3-agreement-collective","word":"Agreement with Collective Nouns","pos":"FORM","definition":"Give a collective noun such as team, committee, or family a singular verb when the group acts as one unit.","example":"The committee meets every Thursday to review new proposals."},{"id":"sat-conv-s3-pronoun-antecedent","word":"Pronoun-Antecedent Agreement","pos":"FORM","definition":"Match a pronoun to its antecedent in number: a singular noun takes a singular pronoun, a plural noun takes a plural pronoun.","example":"Maria left her laptop charging in the library before class."},{"id":"sat-conv-s3-pronoun-clarity","word":"Pronoun Clarity","pos":"FORM","definition":"Make sure a pronoun points to exactly one clear antecedent; if two nouns compete for it, rewrite the sentence.","example":"Elena told her sister that the museum tickets were on the counter."},{"id":"sat-conv-s3-pronoun-case","word":"Pronoun Case","pos":"FORM","definition":"Use a subject pronoun—I, he, she, we, they—as the subject of a clause and an object pronoun—me, him, her, us, them—as the object.","example":"The professor invited Maya and me to present at the symposium."},{"id":"sat-conv-s3-who-whom","word":"Who vs. Whom","pos":"FORM","definition":"Use who when the pronoun acts as the subject of its clause and whom when it acts as the object of a verb or preposition.","example":"The director, whom the crew respected deeply, rewrote the final scene overnight."},{"id":"sat-conv-s3-possessive-gerund","word":"Possessive Before a Gerund","pos":"FORM","definition":"Put a possessive noun or pronoun in front of a gerund, the -ing form of a verb used as a noun.","example":"The neighbors complained about the band’s rehearsing late into the night."},{"id":"sat-conv-s3-confused-words","word":"Frequently Confused Words","pos":"FORM","definition":"Sound-alike words such as affect and effect, or than and then, play different grammatical roles, so context decides which one fits.","example":"The new policy will affect every department, but its effect won’t be clear until fall."}]},{"id":"sat-conv-set-4","index":4,"name":"Set 4","words":[{"id":"sat-conv-s4-verb-tense-consistency","word":"Verb Tense Consistency","pos":"FORM","definition":"Keep verb tense consistent across a sentence or passage unless an actual shift in time requires a change.","example":"By the time the guests arrived, the caterers had already set every table."},{"id":"sat-conv-s4-verb-form-auxiliary","word":"Verb Form After Auxiliaries","pos":"FORM","definition":"Pair an auxiliary verb such as has, have, or had with the verb form it requires, usually the past participle.","example":"The researchers have gathered enough data to publish their findings."},{"id":"sat-conv-s4-misplaced-modifier","word":"Misplaced Modifier","pos":"FORM","definition":"Keep a modifier next to the word it describes; moving it elsewhere changes or muddles the sentence’s meaning.","example":"Wearing a bright red jacket, the hiker was easy to spot on the trail."},{"id":"sat-conv-s4-dangling-modifier","word":"Dangling Modifier","pos":"FORM","definition":"Give an introductory modifier a clear subject right after the comma, or it appears to describe the wrong noun—or nothing at all.","example":"Running late for the exam, Priya skipped breakfast entirely."},{"id":"sat-conv-s4-parallel-series","word":"Parallel Structure in a Series","pos":"FORM","definition":"Give every item in a list or series the same grammatical form, whether that’s a noun, a gerund, or an infinitive.","example":"The itinerary included touring the castle, sampling local cheese, and hiking the coastal trail."},{"id":"sat-conv-s4-parallel-comparisons","word":"Parallel Structure in Comparisons","pos":"FORM","definition":"Match the grammatical form on both sides of a comparison built with than, rather than, or as...as.","example":"Editing the draft took longer than writing it."},{"id":"sat-conv-s4-logical-comparison","word":"Logical Comparison","pos":"FORM","definition":"Compare things of the same kind, adding a word like that or those when the sentence is really comparing possessions or qualities, not the nouns themselves.","example":"The population of Portland is smaller than that of Seattle."},{"id":"sat-conv-s4-subordination-coordination","word":"Subordination and Coordination","pos":"FORM","definition":"Link two ideas with a subordinating conjunction when one depends on the other, or a coordinating conjunction when both carry equal weight.","example":"Although the museum closed early, the gift shop stayed open for another hour."},{"id":"sat-conv-s4-subjunctive-mood","word":"Subjunctive Mood","pos":"FORM","definition":"Use were, not was, in a clause that expresses a wish or a condition contrary to fact.","example":"If the theater were larger, the festival could sell twice as many tickets."},{"id":"sat-conv-s4-sequence-of-tenses","word":"Sequence of Tenses","pos":"FORM","definition":"Shift an event further into the past tense when it’s described in relation to a main verb that’s already in the past.","example":"She mentioned that the shipment had arrived a day early."}]}]},{"id":"sat-1200","name":"SAT 1200 Words","totalWords":1200,"sets":[{"id":"sat1200-set-1","index":1,"name":"Set 1","words":[{"id":"sat1200-s1-anecdotal","word":"Anecdotal","pos":"OTHER","definition":"Based on personal accounts rather than systematic evidence."},{"id":"sat1200-s1-elicit","word":"Elicit","pos":"OTHER","definition":"Draw out a response or reaction."},{"id":"sat1200-s1-absorb","word":"Absorb","pos":"OTHER","definition":"1) Take in a substance, energy, or information. 2) Occupy someone's attention completely."},{"id":"sat1200-s1-unfailingly","word":"Unfailingly","pos":"OTHER","definition":"Consistently and reliably."},{"id":"sat1200-s1-banal","word":"Banal","pos":"OTHER","definition":"Boringly ordinary or predictable."},{"id":"sat1200-s1-inquiry","word":"Inquiry","pos":"OTHER","definition":"1) A question or request for information. 2) A systematic investigation."},{"id":"sat1200-s1-deliberate","word":"Deliberate","pos":"OTHER","definition":"1) adj. Intentional and considered. 2) v. Think or discuss carefully before deciding."},{"id":"sat1200-s1-rescind","word":"Rescind","pos":"OTHER","definition":"Officially cancel a law, agreement, or decision."},{"id":"sat1200-s1-concerning","word":"Concerning","pos":"OTHER","definition":"1) adj. Causing worry. 2) prep. About or relating to a subject."},{"id":"sat1200-s1-diffusion","word":"Diffusion","pos":"OTHER","definition":"1) The spread of something over a wider area. 2) Net movement of particles from higher to lower concentration."},{"id":"sat1200-s1-unprecedented","word":"Unprecedented","pos":"OTHER","definition":"Never done or known before; without previous example."},{"id":"sat1200-s1-diminish","word":"Diminish","pos":"OTHER","definition":"Make or become smaller or less."},{"id":"sat1200-s1-convoluted","word":"Convoluted","pos":"OTHER","definition":"1) Complicated and difficult to follow. 2) Intricately twisted or folded."},{"id":"sat1200-s1-implement","word":"Implement","pos":"OTHER","definition":"1) v. Put a plan or decision into effect. 2) n. A tool or instrument used for a task."},{"id":"sat1200-s1-fabricate","word":"Fabricate","pos":"OTHER","definition":"1) Invent a false account or evidence. 2) Construct from materials."},{"id":"sat1200-s1-rationalize","word":"Rationalize","pos":"OTHER","definition":"1) Offer a seemingly reasonable excuse for questionable behavior. 2) Reorganize a system to improve efficiency."},{"id":"sat1200-s1-auxiliary","word":"Auxiliary","pos":"OTHER","definition":"Providing extra support or assistance."},{"id":"sat1200-s1-self-contradictory","word":"Self-contradictory","pos":"OTHER","definition":"Containing opposing or conflicting statements or ideas."},{"id":"sat1200-s1-imperceptible","word":"Imperceptible","pos":"OTHER","definition":"Too slight to be noticed."},{"id":"sat1200-s1-fearfully","word":"Fearfully","pos":"OTHER","definition":"With fear or anxiety."},{"id":"sat1200-s1-extraneous-to","word":"Extraneous to","pos":"OTHER","definition":"Unrelated or irrelevant to a subject."},{"id":"sat1200-s1-incongruity","word":"Incongruity","pos":"OTHER","definition":"Something that does not fit or is out of place."},{"id":"sat1200-s1-illustration","word":"Illustration","pos":"OTHER","definition":"1) An example that explains or supports an idea. 2) A picture accompanying a text."},{"id":"sat1200-s1-inimitable","word":"Inimitable","pos":"OTHER","definition":"So distinctive or excellent that it cannot be successfully copied."},{"id":"sat1200-s1-irrelevant","word":"Irrelevant","pos":"OTHER","definition":"Unrelated to or inapplicable to the matter being considered."},{"id":"sat1200-s1-monitor","word":"Monitor","pos":"OTHER","definition":"Observe or check over time."},{"id":"sat1200-s1-bolster","word":"Bolster","pos":"OTHER","definition":"Support or strengthen something."},{"id":"sat1200-s1-repudiate","word":"Repudiate","pos":"OTHER","definition":"Reject or refuse to accept."},{"id":"sat1200-s1-put-down","word":"Put down","pos":"OTHER","definition":"1) Insult or belittle someone. 2) Write or record something."},{"id":"sat1200-s1-circular","word":"Circular","pos":"OTHER","definition":"1) Shaped like a circle. 2) Using a claim to support itself, in reasoning."},{"id":"sat1200-s1-terseness","word":"Terseness","pos":"OTHER","definition":"Brevity of expression, sometimes abrupt."},{"id":"sat1200-s1-courteous","word":"Courteous","pos":"OTHER","definition":"Polite and considerate."},{"id":"sat1200-s1-placated-by","word":"Placated by","pos":"OTHER","definition":"Calmed or pacified by something."},{"id":"sat1200-s1-forsake","word":"Forsake","pos":"OTHER","definition":"Abandon or give up."},{"id":"sat1200-s1-tedious","word":"Tedious","pos":"OTHER","definition":"Boring and tiring through length or repetition."},{"id":"sat1200-s1-approximate","word":"Approximate","pos":"OTHER","definition":"1) adj. Close to the correct amount but not exact. 2) v. Come close to matching or resembling something."},{"id":"sat1200-s1-extrapolate-from","word":"Extrapolate from","pos":"OTHER","definition":"Extend a conclusion or estimate beyond the known information."},{"id":"sat1200-s1-extort","word":"Extort","pos":"OTHER","definition":"Obtain something by force or threats."},{"id":"sat1200-s1-immense","word":"Immense","pos":"OTHER","definition":"Extremely large or great."},{"id":"sat1200-s1-disingenuously","word":"Disingenuously","pos":"OTHER","definition":"Insincerely, while pretending to be frank or innocent."},{"id":"sat1200-s1-refurbish","word":"Refurbish","pos":"OTHER","definition":"Repair and improve something for renewed use."},{"id":"sat1200-s1-enhance","word":"Enhance","pos":"OTHER","definition":"Improve quality, value, or effectiveness."},{"id":"sat1200-s1-assumption","word":"Assumption","pos":"OTHER","definition":"Something accepted as true without proof."},{"id":"sat1200-s1-recur","word":"Recur","pos":"OTHER","definition":"Happen again or repeatedly."},{"id":"sat1200-s1-punitive","word":"Punitive","pos":"OTHER","definition":"Intended as punishment."},{"id":"sat1200-s1-collaboration-with","word":"Collaboration with","pos":"OTHER","definition":"Working together with others."},{"id":"sat1200-s1-plentiful","word":"Plentiful","pos":"OTHER","definition":"Abundant; available in large amounts."},{"id":"sat1200-s1-convert","word":"Convert","pos":"OTHER","definition":"Change from one form or purpose to another."},{"id":"sat1200-s1-capacity","word":"Capacity","pos":"OTHER","definition":"1) The ability or potential to do something. 2) The amount something can hold or produce."},{"id":"sat1200-s1-defunct","word":"Defunct","pos":"OTHER","definition":"No longer existing or functioning."}]},{"id":"sat1200-set-2","index":2,"name":"Set 2","words":[{"id":"sat1200-s2-complacent","word":"Complacent","pos":"OTHER","definition":"Overly satisfied with oneself and unaware of possible problems."},{"id":"sat1200-s2-identify","word":"Identify","pos":"OTHER","definition":"1) Establish what something is or who someone is. 2) Recognize and describe a particular feature or problem."},{"id":"sat1200-s2-acquire","word":"Acquire","pos":"OTHER","definition":"Obtain or gain possession of."},{"id":"sat1200-s2-remark","word":"Remark","pos":"OTHER","definition":"A comment or statement."},{"id":"sat1200-s2-pertinent","word":"Pertinent","pos":"OTHER","definition":"Relevant to the matter at hand."},{"id":"sat1200-s2-shallowness","word":"Shallowness","pos":"OTHER","definition":"Lack of physical depth or thoughtful understanding."},{"id":"sat1200-s2-original","word":"Original","pos":"OTHER","definition":"1) New or inventive. 2) Existing at the beginning or serving as the source."},{"id":"sat1200-s2-proponent","word":"Proponent","pos":"OTHER","definition":"A person who advocates or supports a cause."},{"id":"sat1200-s2-obscurity","word":"Obscurity","pos":"OTHER","definition":"1) The state of being little known. 2) Lack of clarity or difficulty of understanding."},{"id":"sat1200-s2-calibration-with","word":"Calibration with","pos":"OTHER","definition":"Checking or adjusting measurements by comparison with a standard."},{"id":"sat1200-s2-predicate","word":"Predicate","pos":"OTHER","definition":"Base a claim or action on something, usually with \"on\"."},{"id":"sat1200-s2-illusory","word":"Illusory","pos":"OTHER","definition":"Based on illusion; not real or true; deceptive."},{"id":"sat1200-s2-indistinct","word":"Indistinct","pos":"OTHER","definition":"Not clear or sharply defined."},{"id":"sat1200-s2-restate","word":"Restate","pos":"OTHER","definition":"Express the same idea again, often in different words."},{"id":"sat1200-s2-replicable","word":"Replicable","pos":"OTHER","definition":"Able to be reproduced with comparable results."},{"id":"sat1200-s2-fuse","word":"Fuse","pos":"OTHER","definition":"1) Combine into a single whole. 2) Melt and join through heat."},{"id":"sat1200-s2-prolific","word":"Prolific","pos":"OTHER","definition":"Producing abundant work, results, or offspring."},{"id":"sat1200-s2-insolent","word":"Insolent","pos":"OTHER","definition":"Rudely disrespectful."},{"id":"sat1200-s2-infrequent","word":"Infrequent","pos":"OTHER","definition":"Occurring rarely."},{"id":"sat1200-s2-steward","word":"Steward","pos":"OTHER","definition":"A person who manages or looks after something."},{"id":"sat1200-s2-continuity","word":"Continuity","pos":"OTHER","definition":"1) Uninterrupted continuation. 2) Connection or consistency between parts or periods."},{"id":"sat1200-s2-dispute","word":"Dispute","pos":"OTHER","definition":"A disagreement or argument."},{"id":"sat1200-s2-austerity","word":"Austerity","pos":"OTHER","definition":"1) Plainness and avoidance of luxury. 2) Government spending cuts intended to reduce borrowing."},{"id":"sat1200-s2-prestige","word":"Prestige","pos":"OTHER","definition":"Widespread respect and admiration based on achievements."},{"id":"sat1200-s2-debunk","word":"Debunk","pos":"OTHER","definition":"Expose a claim or belief as false or exaggerated."},{"id":"sat1200-s2-incorporate","word":"Incorporate","pos":"OTHER","definition":"Include as part of a larger whole."},{"id":"sat1200-s2-tranquil","word":"Tranquil","pos":"OTHER","definition":"Calm and peaceful."},{"id":"sat1200-s2-foreseeable","word":"Foreseeable","pos":"OTHER","definition":"Able to be predicted or anticipated."},{"id":"sat1200-s2-transcend","word":"Transcend","pos":"OTHER","definition":"Go beyond a limit, category, or ordinary level."},{"id":"sat1200-s2-craftsmanship","word":"Craftsmanship","pos":"OTHER","definition":"Skill and care in making something."},{"id":"sat1200-s2-substantial","word":"Substantial","pos":"OTHER","definition":"1) Considerable in size, amount, or importance. 2) Real or well supported rather than imaginary or slight."},{"id":"sat1200-s2-install","word":"Install","pos":"OTHER","definition":"Set up or put something in place so it is ready to use."},{"id":"sat1200-s2-inconspicuous","word":"Inconspicuous","pos":"OTHER","definition":"Not readily noticed."},{"id":"sat1200-s2-misinterpretation","word":"Misinterpretation","pos":"OTHER","definition":"An incorrect understanding or explanation."},{"id":"sat1200-s2-dynamic","word":"Dynamic","pos":"OTHER","definition":"Characterized by constant change or activity."},{"id":"sat1200-s2-expediency","word":"Expediency","pos":"OTHER","definition":"Practical advantage or convenience, sometimes at the expense of principle."},{"id":"sat1200-s2-sacred","word":"Sacred","pos":"OTHER","definition":"1) Connected with religion or regarded as holy. 2) Treated as too important to violate or question."},{"id":"sat1200-s2-unfold" const STORAGE_KEY = "vocabify_progress_v1";

function loadProgress() {

    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};

}

function saveProgress(progress) {

const ACT_KEY = "vocabify_activity_v1";
function dayKey(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function loadActivity() {
  try { return JSON.parse(localStorage.getItem(ACT_KEY)) || {}; } catch (e) { return {}; }
}
function recordActivity() {
  try {
    const a = loadActivity(); const k = dayKey();
    a[k] = (a[k] || 0) + 1;
    localStorage.setItem(ACT_KEY, JSON.stringify(a));
  } catch (e) {}
}
function computeStreak(a) {
  const d = new Date(); let n = 0;
  if (!a[dayKey(d)]) d.setDate(d.getDate() - 1); // an unstarted today doesn't break the streak
  while (a[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function speakWord(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function SpeakButton({ word, className = "" }) {
  if (typeof window === "undefined" || !("speechSynthesis" in window)) return null;
  return (
    <button
      type="button"
      aria-label={"Hear how to say " + word}
      onClick={(e) => { e.stopPropagation(); e.currentTarget.blur(); speakWord(word); }}
      className={classNames("inline-flex items-center justify-center w-8 h-8 rounded-full text-slate-400 hover:text-blue-600 hover:bg-blue-50 focus-ring transition", className)}
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M11 5 6 9H3v6h3l5 4V5z" /><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" /></svg>
    </button>
  );
}

function classNames(...xs) {
  return xs.filter(Boolean).join(" ");
}

function ProgressRing({ percent, size = 56, stroke = 5, colorClass = "text-blue-600" }) {
  const radius = (size - stroke) / 2;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (Math.min(100, Math.max(0, percent)) / 100) * circumference;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="-rotate-90">
      <circle
        cx={size / 2} cy={size / 2} r={radius}
        fill="none" stroke="#e5e7eb" strokeWidth={stroke}
      />
      <circle
        cx={size / 2} cy={size / 2} r={radius}
        fill="none" strokeWidth={stroke} strokeLinecap="round"
        strokeDasharray={circumference}
        strokeDashoffset={offset}
        className={classNames(colorClass, "transition-all duration-700 ease-out")}
        stroke="currentColor"
      />
    </svg>
  );
}

function SegmentedBar({ mastered, learning, neu, total, height = "h-2.5" }) {
  if (total === 0) total = 1;
  const mPct = (mastered / total) * 100;

}
