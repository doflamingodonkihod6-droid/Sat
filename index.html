<style>
  :root {
    --emerald: #10b981;
    --amber: #f59e0b;
    --newgray: #e5e7eb;
    --blue: #2563eb;
  }

  * { box-sizing: border-box; }

  html, body {
    background-color: #f8fafc;
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }

  .font-display { font-family: 'Lexend', 'Inter', ui-sans-serif, sans-serif; }

  ::selection { background: #bfdbfe; color: #1e3a8a; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.94); }
    100% { opacity: 1; transform: scale(1); }
  }
  .animate-pop { animation: popIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }

  @keyframes shimmerRing {
    0% { stroke-dashoffset: var(--circ); }
    100% { stroke-dashoffset: var(--offset); }
  }

  @keyframes pulseSoft {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .animate-pulse-soft { animation: pulseSoft 1.6s ease-in-out infinite; }

  @keyframes shakeX {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .animate-shake { animation: shakeX 0.5s cubic-bezier(.36,.07,.19,.97) both; }

  /* ---------- 3D Flashcard flip ---------- */
  .flip-scene {
    perspective: 1800px;
  }
  .flip-card {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.55s cubic-bezier(0.45, 0.05, 0.15, 1);
    transform-style: preserve-3d;
  }
  .flip-card.is-flipped {
    transform: rotateY(180deg);
  }
  .flip-face {
    position: absolute;
    inset: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
  }
  .flip-face-back {
    transform: rotateY(180deg);
  }

  .card-shadow {
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px -8px rgba(15, 23, 42, 0.10), 0 24px 64px -20px rgba(15, 23, 42, 0.12);
  }
  .card-shadow-lg {
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04), 0 20px 48px -12px rgba(15, 23, 42, 0.14), 0 32px 80px -16px rgba(15, 23, 42, 0.14);
  }

  .grain-texture {
    background-image: radial-gradient(circle at 1px 1px, rgba(15,23,42,0.035) 1px, transparent 0);
    background-size: 18px 18px;
  }

  .segbar-seg { transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); }

  .btn-press { transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease, border-color 0.15s ease; }
  .btn-press:active { transform: scale(0.96); }

  .hover-lift { transition: transform 0.22s cubic-bezier(0.16,1,0.3,1), box-shadow 0.22s cubic-bezier(0.16,1,0.3,1), border-color 0.22s ease; }
  .hover-lift:hover { transform: translateY(-3px); }

  .focus-ring:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px #f8fafc, 0 0 0 4px var(--blue);
  }

  .kbd {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 6px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    color: #475569;
    box-shadow: 0 1px 0 #cbd5e1;
  }

  .tag-verb { background: #eef2ff; color: #4338ca; border: 1px solid #e0e7ff; }
  .tag-other { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
  .tag-prep { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
  .tag-trans { background: #f0fdfa; color: #0f766e; border: 1px solid #99f6e4; }
  .tag-bound { background: #fdf2f8; color: #be185d; border: 1px solid #fbcfe8; }
  .tag-form { background: #ecfeff; color: #0e7490; border: 1px solid #a5f3fc; }

  .status-mastered { background: rgba(16,185,129,0.1); color: #047857; border: 1px solid rgba(16,185,129,0.2); }
  .status-learning { background: rgba(245,158,11,0.1); color: #b45309; border: 1px solid rgba(245,158,11,0.25); }
  .status-new { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

  .bg-noise-blue {
    background: radial-gradient(120% 120% at 15% 0%, #eff6ff 0%, #f8fafc 45%);
  }

  .letter-tight { letter-spacing: -0.02em; }
  .letter-tighter { letter-spacing: -0.035em; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .match-tile { transition: transform 0.18s cubic-bezier(0.16,1,0.3,1), box-shadow 0.18s ease, background-color 0.18s ease, border-color 0.18s ease, opacity 0.3s ease; }
  .match-tile.correct-pop { animation: matchCorrect 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes matchCorrect {
    0% { transform: scale(1); }
    35% { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 0; }
  }
</style>

:"Uncommon, strange","example":"His eccentric habit of wearing socks over his shoes made people think he was either a genius or just really confused","antonym":"Conventional"},{"id":"college-panda-s1-mired","word":"Mired","pos":"OTHER","definition":"Stuck in mud","example":"She was so mired in paperwork that even a bulldozer wouldn’t be able to dig her out of her office.","antonym":"Free"},{"id":"college-panda-s1-colloquial","word":"Colloquial","pos":"OTHER","definition":"Used in casual conversation","example":"His speech was so full of colloquial slang that even his grandma said, “Bruh, I don’t understand you.”","antonym":"Formal"},{"id":"college-panda-s1-reconcile","word":"Reconcile","pos":"OTHER","definition":"Settle one’s differences, make compatible, bring back to peace","example":"They finally reconciled after their epic debate over whether pineapple belongs on pizza. Spoiler: It doesn’t","antonym":"Estrange"},{"id":"college-panda-s1-alienate","word":"Alienate","pos":"VERB","definition":"To cause someone to feel isolated or lonely","example":"His decision to start every conversation with a detailed history of traffic lights quickly alienated all his friends","antonym":"Befriend"},{"id":"college-panda-s1-distinguish","word":"Distinguish","pos":"VERB","definition":"To tell the difference between","example":"He could barely distinguish between his identical twin brothers until one started wearing neon green socks every day.","antonym":"Confuse"},{"id":"college-panda-s1-adequate","word":"Adequate","pos":"OTHER","definition":"Sufficient, enough, acceptable","example":"His cooking skills were adequate—let’s just say the fire alarm got a workout, but the pizza wasn’t that burnt.","antonym":"Inadequate"},{"id":"college-panda-s1-contend","word":"Contend","pos":"VERB","definition":"1) To deal with someone or something 2) To claim or state a belief confidently","example":"He contended with his alarm clock every morning as if it was a fierce battle between sleep and reality.","antonym":"Surrender"},{"id":"college-panda-s1-skeptical","word":"Skeptical","pos":"OTHER","definition":"Having doubts","example":"She was skeptical about the “miracle” face cream that claimed to make her look 20 years younger overnight.","antonym":"Trusting"},{"id":"college-panda-s1-enfranchise","word":"Enfranchise","pos":"VERB","definition":"To give the right to vote","example":"The town held a parade to celebrate when they finally enfranchised the local raccoons… though they immediately voted for more trash cans.","antonym":"Disenfranchise, enslave"},{"id":"college-panda-s1-sophisticated","word":"Sophisticated","pos":"OTHER","definition":"1) Having a lot of worldly experience and knowledge 2) Complicated","example":"His sophisticated taste in cheese made him the only person who actually knew what “gorgonzola” was at the party.","antonym":"naive"},{"id":"college-panda-s1-radical","word":"Radical","pos":"OTHER","definition":"1) Thorough, complete, extensive 2) Fundamental, essential 3) Revolutionary, extreme","example":"His radical idea to solve all the world’s problems by making every Friday “Free Ice Cream Day” was met with mixed reviews, mostly from lactose-intolerant folks","antonym":"Conservative"},{"id":"college-panda-s1-formulate","word":"Formulate","pos":"VERB","definition":"To create or think up","example":"She formulated a foolproof plan to sneak past her dog—step one: tiptoe; step two: realize dogs can hear everything","antonym":"Destroy"},{"id":"college-panda-s1-attest","word":"Attest","pos":"VERB","definition":"To confirm or verify","example":"He could attest to the fact that eating 10 tacos in one sitting was not a good life decision.","antonym":"Deny"},{"id":"college-panda-s1-vexing","word":"Vexing","pos":"OTHER","definition":"Annoying, irritating","example":"The constant buzzing of the fly around his head was so vexing that he considered giving it a name just to yell at it properly.","antonym":"Pleasing"},{"id":"college-panda-s1-unassuming","word":"Unassuming","pos":"OTHER","definition":"Humble, low-key","example":"The unassuming librarian turned out to be a ninja in her free time, proving you can’t judge a book by its cover","antonym":"Arrogant"},{"id":"college-panda-s1-coerce","word":"Coerce","pos":"VERB","definition":"To pressure or force someone to do something","example":"He coerced his little brother into trading his chocolate bar for a carrot by promising it was “just as tasty.” It wasn’t.","antonym":"Persuade (gently)"},{"id":"college-panda-s1-adept","word":"Adept","pos":"OTHER","definition":"Very skilled at something","example":"She was so adept at parallel parking that she could fit a bus into a space meant for a bicycle.","antonym":"Inept, mediocre, amateur"}]},{"id":"college-panda-set-2","index":2,"name":"Set 2","words":[{"id":"college-panda-s2-eloquent","word":"Eloquent","pos":"OTHER","definition":"Fluent or persuasive in speaking or writing","example":"His speech was so eloquent that even his dog stopped barking just to listen","antonym":"Inarticulate, dullness"},{"id":"college-panda-s2-austere","word":"Austere","pos":"OTHER","definition":"Plain and without decoration, comforts, or anything extra","example":"Her living room was so austere that the only decoration was a single chair—perfect for minimalist extreme sports.","antonym":"Ornate, Luxurious"},{"id":"college-panda-s2-dread","word":"Dread","pos":"VERB","definition":"To fear, be afraid of","example":"He dreaded his mom’s reaction to the broken vase, but he blamed the wind—inside the house.","antonym":"Welcome, Anticipate"},{"id":"college-panda-s2-inevitable","word":"Inevitable","pos":"OTHER","definition":"Unavoidable","example":"It was inevitable that he would trip while texting and walking, as everyone saw it coming—except him","antonym":"Avoidable, Uncertain"},{"id":"college-panda-s2-to-stress","word":"To Stress","pos":"VERB","definition":"To emphasize","example":"She stressed the importance of cleaning the room, but it still looked like a tornado had moved in.","antonym":"Downplay, Minimize"},{"id":"college-panda-s2-spawn","word":"Spawn","pos":"VERB","definition":"To produce, generate, or create","example":"The idea for his movie spawned after a dream where penguins took over the world with dance battles","antonym":"Destroy, Terminate"},{"id":"college-panda-s2-renounce","word":"Renounce","pos":"VERB","definition":"To give up, deny, or surrender something","example":"He renounced his superhero cape after one too many failed attempts at flying off the couch.","antonym":"Accept, Embrace"},{"id":"college-panda-s2-unprecedented","word":"Unprecedented","pos":"OTHER","definition":"Never done or known before","example":"His unprecedented move to start a cheese museum in his basement had the neighbors curiously excited.","antonym":"Common, Routine"},{"id":"college-panda-s2-broach","word":"Broach","pos":"VERB","definition":"To bring up a difficult subject for discussion","example":"He broached the subject of missing rent with his landlord, who thankfully had a sense of humor—about everything except rent.","antonym":"Avoid, Suppress"},{"id":"college-panda-s2-proxy","word":"Proxy","pos":"OTHER","definition":"A person authorized to act on behalf of another; substitute","example":"He sent his dog as a proxy to the meeting, but all they got was a bowl of snacks and a nap under the table","antonym":"Principal, Original"},{"id":"college-panda-s2-detrimental","word":"Detrimental","pos":"OTHER","definition":"Harmful, damaging","example":"Eating 10 donuts for breakfast might be detrimental to your health, but it’s great for your mood—temporarily.","antonym":"Beneficial, Constructive"},{"id":"college-panda-s2-secular","word":"Secular","pos":"OTHER","definition":"Having no religious or spiritual basis","example":"The concert was entirely secular, except for the part where the lead singer thanked “the universe” for his fans","antonym":"Sacred, Religious"},{"id":"college-panda-s2-innovative","word":"Innovative","pos":"OTHER","definition":"New and different","example":"His innovative way of organizing his closet involved attaching his shirts to a ceiling fan—one quick spin, and he was dressed","antonym":"Unoriginal, Traditional"},{"id":"college-panda-s2-tangible","word":"Tangible","pos":"OTHER","definition":"Real and able to be shown or touched","example":"The excitement in the room was so tangible, you could practically high-five it.","antonym":"Intangible, Abstract"},{"id":"college-panda-s2-disseminate","word":"Disseminate","pos":"VERB","definition":"To spread widely (particularly information)","example":"He tried to disseminate the news about the school trip, but it somehow turned into a rumor about a school-wide pizza party","antonym":"Conceal, Contain"},{"id":"college-panda-s2-delegate-verb","word":"Delegate (verb)","pos":"VERB","definition":"To assign a task to another person","example":"He delegated the dishwashing duty to his little brother, but somehow the dishes were still dirty, and the brother was missing","antonym":"Retain, Withhold"},{"id":"college-panda-s2-apparent","word":"Apparent","pos":"OTHER","definition":"Clearly visible or understood; obvious","example":"It became apparent that he had no idea how to assemble the furniture when the bookshelf started resembling a chair","antonym":"Hidden, Obscure"},{"id":"college-panda-s2-postulate","word":"Postulate","pos":"VERB","definition":"To suggest or propose something","example":"He postulated that pizza should be considered a vegetable, which earned him both laughs and several high-fives","antonym":"Reject, Deny"},{"id":"college-panda-s2-speculate","word":"Speculate","pos":"VERB","definition":"To guess, to form a theory without firm evidence","example":"He speculated that his lost sock had fallen into a black hole because where else could it have gone?","antonym":"Prove, Verify"},{"id":"college-panda-s2-bazaar","word":"Bazaar","pos":"OTHER","definition":"A market selling a large variety of goods","example":"The bazaar had everything from handmade rugs to pet unicorn horns—for cats, of course.","antonym":"Boutique, Supermarket"},{"id":"college-panda-s2-sporadic","word":"Sporadic","pos":"OTHER","definition":"Scattered, irregular, unpredictable","example":"His sporadic attempts to clean his room usually started strong and ended with him watching TV in the mess","antonym":"Consistent, Regular"},{"id":"college-panda-s2-suffrage","word":"Suffrage","pos":"OTHER","definition":"The right to vote","example":"She celebrated when women gained suffrage by voting for the cutest puppy in the election for “Pet of the Year.”","antonym":"Disenfranchisement, Disqualification"},{"id":"college-panda-s2-incredulous","word":"Incredulous","pos":"OTHER","definition":"Unwilling or unable to believe something","example":"He was incredulous when his cat finally learned how to fetch. “Next up,” he said, “playing the piano.”","antonym":"Believing, Gullible"},{"id":"college-panda-s2-idealistic","word":"Idealistic","pos":"OTHER","definition":"Unrealistically aiming for perfection","example":"His idealistic goal of becoming a world-class chef in a week ended when he burned toast—three times in a row","antonym":"Realistic, Pragmatic"},{"id":"college-panda-s2-conflate","word":"Conflate","pos":"VERB","definition":"To mix or combine into one (typically ideas)","example":"He conflated his birthday party with Halloween, so everyone showed up in costumes to celebrate his “vampire cake.”","antonym":"Separate, Divide"}]},{"id":"college-panda-set-3","index":3,"name":"Set 3","words":[{"id":"college-panda-s3-paucity","word":"Paucity","pos":"OTHER","definition":"Poverty, scarcity","example":"The paucity of snacks at the party led to a fierce competition over the last slice of pizza","antonym":"Abundance, Plentifulness"},{"id":"college-panda-s3-ephemeral","word":"Ephemeral","pos":"OTHER","definition":"Temporary, short-lived","example":"His enthusiasm for working out was ephemeral—lasting just long enough to post about it on social media","antonym":"Permanent, Lasting"},{"id":"college-panda-s3-prompt","word":"Prompt","pos":"VERB","definition":"To cause (someone) to take a course of action","example":"The sight of chocolate cake promptly caused him to break his diet with zero hesitation","antonym":"Discourage, Deter"},{"id":"college-panda-s3-reverence","word":"Reverence","pos":"OTHER","definition":"Deep respect for someone or something","example":"He showed great reverence for his grandma’s cooking, bowing before every plate of lasagna like it was a royal feast","antonym":"Disrespect, Scorn"},{"id":"college-panda-s3-disparity","word":"Disparity","pos":"OTHER","definition":"A great difference","example":"The disparity between his baking skills and his sister’s was obvious when his cookies looked like rocks and hers like art","antonym":"Similarity, Equality"},{"id":"college-panda-s3-dispassionate","word":"Dispassionate","pos":"OTHER","definition":"Not influenced by strong emotion, fair-minded","example":"As the judge, she remained dispassionate, even when the defendant made a very emotional argument about losing his last donut","antonym":"Emotional, Biased"},{"id":"college-panda-s3-phenomenon","word":"Phenomenon","pos":"OTHER","definition":"A noteworthy occurrence or situation","example":"The sudden appearance of a double rainbow after the storm was such a phenomenon that everyone stopped to take selfies with it","antonym":"Ordinary, Normality"},{"id":"college-panda-s3-boast","word":"Boast","pos":"VERB","definition":"To brag, to show off","example":"He boasted so much about his new car that his friends started pretending they couldn’t hear him","antonym":"Humble, Conceal"},{"id":"college-panda-s3-irksome","word":"Irksome","pos":"OTHER","definition":"Irritating, annoying","example":"The irksome sound of his neighbor’s endless lawn mowing made him wish grass would just stop growing","antonym":"Pleasant, Agreeable"},{"id":"college-panda-s3-allude","word":"Allude","pos":"VERB","definition":"T
