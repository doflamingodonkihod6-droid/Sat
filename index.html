// ---------------------------------------------------------------------------
// Progress calculations
// ---------------------------------------------------------------------------

function computeSetStats(setObj, progress) {
  let mastered = 0, learning = 0, neu = 0;
  setObj.words.forEach((w) => {
    const st = progress[w.id] || "new";
    if (st === "mastered") mastered++;
    else if (st === "learning") learning++;
    else neu++;
  });
  const total = setObj.words.length;
  const percent = total ? Math.round((mastered / total) * 100) : 0;
  const done = mastered === total;
  const started = mastered > 0 || learning > 0;
  return { mastered, learning, neu, total, percent, done, started };
}

function computePackageStats(pkg, progress) {
  let mastered = 0, learning = 0, neu = 0, total = 0;
  pkg.sets.forEach((s) => {
    const st = computeSetStats(s, progress);
    mastered += st.mastered; learning += st.learning; neu += st.neu; total += st.total;
  });
  const percent = total ? Math.round((mastered / total) * 100) : 0;
  return { mastered, learning, neu, total, percent };
}

      </div>
    </div>
  );
}

function FlashcardMode({ setObj, progress, onUpdateStatus, onExit }) {
  const [order] = useState(() => setObj.words.map((_, i) => i));
  const [pos, setPos] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [results, setResults] = useState({}); // wordId -> 'correct' | 'wrong'
  const [direction, setDirection] = useState("forward");
  const [finished, setFinished] = useState(false);
  const [judgeFlash, setJudgeFlash] = useState(null); // 'correct' | 'wrong' | null

  const currentWord = setObj.words[order[pos]];
  const total = order.length;

  const goNext = useCallback(() => {
    setDirection("forward");
    setFlipped(false);
    setJudgeFlash(null);
    setPos((p) => {
      if (p + 1 >= total) {
        setFinished(true);
        return p;
      }
      return p + 1;
    });
  }, [total]);

  const handleAnswer = useCallback((isCorrect) => {
    if (!currentWord) return;
    const status = isCorrect ? "mastered" : "learning";
    onUpdateStatus(currentWord.id, status);
    setResults((r) => ({ ...r, [currentWord.id]: isCorrect ? "correct" : "wrong" }));
    setJudgeFlash(isCorrect ? "correct" : "wrong");
    setTimeout(() => { goNext(); }, 280);
  }, [currentWord, onUpdateStatus, goNext]);

  useEffect(() => {
    function onKeyDown(e) {
      if (finished) return;
      if (e.code === "Space") {
        e.preventDefault();
        setFlipped((f) => !f);
      } else if (e.key === "1") {
        handleAnswer(false);
      } else if (e.key === "2") {
        handleAnswer(true);
      } else if (e.key === "Escape") {
        onExit();
      }
    }
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [finished, handleAnswer, onExit]);

  if (finished) {
    const correctCount = Object.values(results).filter((r) => r === "correct").length;
    const pct = total ? Math.round((correctCount / total) * 100) : 0;
    return (
      <div className="max-w-lg mx-auto px-5 py-16 text-center animate-pop">
        <div className="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-5">
          <IconCheck className="w-8 h-8" />
        </div>
        <h2 className="font-display font-extrabold text-2xl text-slate-900 mb-2">Set complete!</h2>
        <p className="text-slate-500 mb-7">
          You got {correctCount} of {total} correct ({pct}%) on Set {setObj.index}.
        </p>
        <div className="flex items-center justify-center gap-3">
          <button
            onClick={onExit}
            className="btn-press focus-ring px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-700"
          >
            Back to set
          </button>
          <button
            onClick={() => { setPos(0); setFlipped(false); setResults({}); setFinished(false); setJudgeFlash(null); }}
            className="btn-press focus-ring px-5 py-2.5 rounded-xl bg-blue-50 text-blue-700 text-sm font-bold hover:bg-blue-100"
          >
            Study again
          </button>
        </div>
      </div>
    );
  }

  if (!currentWord) return null;

  return (
    <div className="max-w-2xl mx-auto px-5 py-8 sm:py-10">
      <div className="flex items-center justify-between mb-8">
        <button
          onClick={onExit}
          className="btn-press focus-ring inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800 rounded-lg px-2 py-1 -ml-2"
        >
          <IconChevronLeft className="w-4 h-4" /> Back
        </button>
        <div className="flex items-center gap-2 text-sm font-semibold text-slate-500">
          <IconLayers className="w-4 h-4 text-slate-400" />
          {pos + 1} / {total}
        </div>
      </div>

      <div className="w-full h-1.5 rounded-full bg-slate-100 mb-9 overflow-hidden">
        <div
          className="h-full bg-blue-600 rounded-full transition-all duration-500 ease-out"
          style={{ width: `${(pos / total) * 100}%` }}
        />
      </div>

      <div className="flip-scene w-full" style={{ height: "380px" }}>
        <div
          className={classNames("flip-card w-full h-full cursor-pointer", flipped && "is-flipped")}
          onClick={() => setFlipped((f) => !f)}
          role="button"
          tabIndex={0}
          aria-label="Flashcard. Press space or click to flip."
        >
          {/* FRONT */}
          <div className={classNames(
            "flip-face rounded-2xl border card-shadow-lg p-8 sm:p-10 items-center justify-center text-center bg-white",
            judgeFlash === "correct" ? "border-emerald-300" : judgeFlash === "wrong" ? "border-red-300" : "border-slate-200"
          )}>
            <div className="mb-5">
              <PosTag pos={currentWord.pos} />
            </div>
            <h2 className="font-display font-extrabold text-4xl sm:text-5xl letter-tighter text-slate-900 mb-6 break-words">
              {currentWord.word}
            </h2>
            <SpeakButton word={currentWord.word} className="mb-3 -mt-3" />
            <div className="inline-flex items-center gap-2 text-sm font-semibold text-slate-400 mt-2">
              <IconRotate className="w-4 h-4" />
              Flip for definition
            </div>
            <div className="absolute bottom-6 left-0 right-0 flex justify-center gap-1.5 text-[11px] text-slate-300 font-medium">
              press <span className="kbd">space</span> to flip
            </div>
          </div>

          {/* BACK */}
          <div className="flip-face flip-face-back rounded-2xl border border-slate-200 card-shadow-lg p-8 sm:p-10 justify-center bg-white">
            <div className="flex items-center gap-2 mb-4">
              <span className="font-display font-bold text-lg text-slate-900">{currentWord.word}</span>
              <PosTag pos={currentWord.pos} />
            </div>
            <p className="text-slate-700 text-lg leading-relaxed mb-5">{currentWord.definition}</p>
            {currentWord.example && (
              <div className="rounded-xl bg-slate-50 border border-slate-100 p-4 mb-4">
                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-1.5">Example</p>
                <p className="text-slate-600 text-sm leading-relaxed italic">&ldquo;{currentWord.example}&rdquo;</p>
              </div>
            )}
            {currentWord.antonym && (
              <div className="flex items-center gap-2">
                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Antonym</span>
                <span className="text-sm font-semibold text-slate-600">{currentWord.antonym}</span>
              </div>
            )}
          </div>
        </div>
      </div>

      <div className="flex items-center justify-center gap-4 mt-9">
        <button
          onClick={() => handleAnswer(false)}
          className="btn-press focus-ring flex-1 max-w-[180px] inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl bg-red-50 text-red-600 font-bold border border-red-100 hover:bg-red-100"
        >
          <IconX className="w-4 h-4" /> Wrong
          <span className="kbd ml-1">1</span>
        </button>
        <button
          onClick={() => handleAnswer(true)}
          className="btn-press focus-ring flex-1 max-w-[180px] inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl text-white font-bold hover:opacity-90"
          style={{ backgroundColor: "#10b981" }}
        >
          <IconCheck className="w-4 h-4" /> Correct
          <span className="kbd ml-1 bg-white/20 border-white/20 text-white shadow-none">2</span>
        </button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Matching mode
// ---------------------------------------------------------------------------

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function MatchingMode({ setObj, onExit, roundSize = 8 }) {
  const poolWords = useMemo(() => shuffleArray(setObj.words).slice(0, Math.min(roundSize, setObj.words.length)), [setObj]);
  const [wordTiles] = useState(() => shuffleArray(poolWords.map((w) => ({ key: `w-${w.id}`, wordId: w.id, text: w.word }))));
  const [defTiles] = useState(() => shuffleArray(poolWords.map((w) => ({ key: `d-${w.id}`, wordId: w.id, text: w.definition }))));
  const [selectedWord, setSelectedWord] = useState(null);
  const [selectedDef, setSelectedDef] = useState(null);
  const [matched, setMatched] = useState(new Set());
  const [wrongPulse, setWrongPulse] = useState(null);
  const [startTime] = useState(() => Date.now());
  const [elapsed, setElapsed] = useState(0);
  const [done, setDone] = useState(false);

  useEffect(() => {
    if (done) return;
    const t = setInterval(() => setElapsed(((Date.now() - startTime) / 1000)), 100);
    return () => clearInterval(t);
  }, [startTime, done]);

  useEffect(() => {
    if (matched.size === poolWords.length && poolWords.length > 0) {
      setDone(true);
    }
  }, [matched, poolWords]);

  useEffect(() => {
    if (selectedWord && selectedDef) {
      if (selectedWord.wordId === selectedDef.wordId) {
        setMatched((m) => new Set([...m, selectedWord.wordId]));
        setSelectedWord(null);
        setSelectedDef(null);
      } else {
        setWrongPulse({ w: selectedWord.key, d: selectedDef.key });
        setTimeout(() => {
          setWrongPulse(null);
          setSelectedWord(null);
          setSelectedDef(null);
        }, 420);
      }
    }
  }, [selectedWord, selectedDef]);

  if (done) {
    return (
      <div className="max-w-lg mx-auto px-5 py-16 text-center animate-pop">
        <div className="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5" style={{backgroundColor:'#f5f3ff', color:'#7c3aed'}}>
          <IconGrid className="w-8 h-8" />
        </div>
        <h2 className="font-display font-extrabold text-2xl text-slate-900 mb-2">All matched!</h2>
        <p className="text-slate-500 mb-7">You matched {poolWords.length} pairs in {elapsed.toFixed(1)}s.</p>
        <button onClick={onExit} className="btn-press focus-ring px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-700">
          Back to set
        </button>
      </div>
    );
  }

  return (
    <div className="max-w-4xl mx-auto px-5 py-8">
      <div className="flex items-center justify-between mb-7">
        <button onClick={onExit} className="btn-press focus-ring inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800 rounded-lg px-2 py-1 -ml-2">
          <IconChevronLeft className="w-4 h-4" /> Back
        </button>
        <div className="flex items-center gap-4">
          <span className="text-sm font-semibold text-slate-500">{matched.size}/{poolWords.length} matched</span>
          <div className="flex items-center gap-1.5 text-sm font-bold text-slate-700 bg-slate-100 px-3 py-1 rounded-full">
            <IconClock className="w-3.5 h-3.5" /> {elapsed.toFixed(1)}s
          </div>
        </div>
      </div>
      <p className="text-center text-sm text-slate-400 mb-6">Tap a word, then tap its matching definition.</p>
      <div className="grid grid-cols-2 gap-6">
        <div className="space-y-2.5">
          {wordTiles.map((t) => {
            const isMatched = matched.has(t.wordId);
            const isSelected = selectedWord && selectedWord.key === t.key;
            const isWrong = wrongPulse && wrongPulse.w === t.key;
            if (isMatched) return <div key={t.key} className="match-tile correct-pop h-[52px] rounded-xl border border-emerald-200 bg-emerald-50" />;
            return (
              <button
                key={t.key}
                onClick={() => !isSelected && setSelectedWord(t)}
                className={classNames(
                  "match-tile w-full text-left px-4 py-3.5 rounded-xl border font-semibold text-sm focus-ring",
                  isWrong ? "border-red-300 bg-red-50 text-red-600 animate-shake"
                    : isSelected ? "border-blue-500 bg-blue-50 text-blue-700 shadow-sm"
                    : "border-slate-200 bg-white text-slate-800 hover:border-slate-300"
                )}
              >
                {t.text}
              </button>
            );
          })}
        </div>
        <div className="space-y-2.5">
          {defTiles.map((t) => {
            const isMatched = matched.has(t.wordId);
            const isSelected = selectedDef && selectedDef.key === t.key;
            const isWrong = wrongPulse && wrongPulse.d === t.key;
            if (isMatched) return <div key={t.key} className="match-tile correct-pop h-[52px] rounded-xl border border-emerald-200 bg-emerald-50" />;
            return (
              <button
                key={t.key}
                onClick={() => !isSelected && setSelectedDef(t)}
                className={classNames(
                  "match-tile w-full text-left px-4 py-3.5 rounded-xl border text-sm focus-ring leading-snug",
                  isWrong ? "border-red-300 bg-red-50 text-red-600 animate-shake"
                    : isSelected ? "border-blue-500 bg-blue-50 text-blue-700 shadow-sm"
                    : "border-slate-200 bg-white text-slate-600 hover:border-slate-300"
                )}
              >
                {t.text}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Speed mode
// ---------------------------------------------------------------------------

function buildMcOptions(setObj, correctWord, allWords) {
  const pool = allWords.filter((w) => w.id !== correctWord.id);
  const distractors = shuffleArray(pool).slice(0, 3).map((w) => w.definition);
  return shuffleArray([correctWord.definition, ...distractors]);
}

function SpeedMode({ setObj, onUpdateStatus, onExit, seconds = 60 }) {
  const [order] = useState(() => shuffleArray(setObj.words));
  const [idx, setIdx] = useState(0);
  const [score, setScore] = useState(0);
  const [timeLeft, setTimeLeft] = useState(seconds);
  const [over, setOver] = useState(false);
  const [selected, setSelected] = useState(null);
  const [options, setOptions] = useState(() => buildMcOptions(setObj, order[0], setObj.words));
  const timerRef = useRef(null);

  useEffect(() => {
    if (over) return;
    timerRef.current = setInterval(() => {
      setTimeLeft((t) => {
        if (t <= 1) {
          clearInterval(timerRef.current);
          setOver(true);
          return 0;
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [over]);

  const nextQuestion = useCallback(() => {
    setIdx((i) => {
      const ni = i + 1;
      if (ni >= order.length) {
        setOver(true);
        return i;
      }
      setOptions(buildMcOptions(setObj, order[ni], setObj.words));
      setSelected(null);
      return ni;
    });
  }, [order, setObj]);

  function handleSelect(opt) {
    if (selected || over) return;
    setSelected(opt);
    const current = order[idx];
    const isCorrect = opt === current.definition;
    if (isCorrect) {
      setScore((s) => s + 1);
      onUpdateStatus(current.id, "mastered");
    } else {
      onUpdateStatus(current.id, "learning");
    }
    setTimeout(nextQuestion, 500);
  }

  if (over) {
    return (
      <div className="max-w-lg mx-auto px-5 py-16 text-center animate-pop">
        <div className="w-16 h-16 rounded-2xl bg-amber-50 flex items-center justify-center mx-auto mb-5" style={{color:'#f59e0b'}}>
          <IconBolt className="w-8 h-8" />
        </div>
        <h2 className="font-display font-extrabold text-2xl text-slate-900 mb-2">Time's up!</h2>
        <p className="text-slate-500 mb-7">You scored {score} correct answer{score === 1 ? "" : "s"}.</p>
        <button onClick={onExit} className="btn-press focus-ring px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-700">
          Back to set
        </button>
      </div>
    );
  }

  const current = order[idx];
  if (!current) return null;

  return (
    <div className="max-w-2xl mx-auto px-5 py-8">
      <div className="flex items-center justify-between mb-7">
        <button onClick={onExit} className="btn-press focus-ring inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800 rounded-lg px-2 py-1 -ml-2">
          <IconChevronLeft className="w-4 h-4" /> Back
        </button>
        <div className="flex items-center gap-4">
          <span className="text-sm font-bold text-emerald-600">{score} correct</span>
          <div className={classNames(
            "flex items-center gap-1.5 text-sm font-extrabold px-3 py-1 rounded-full",
            timeLeft <= 10 ? "bg-red-50 text-red-600 animate-pulse-soft" : "bg-amber-50 text-amber-600"
          )}>
            <IconClock className="w-3.5 h-3.5" /> {timeLeft}s
          </div>
        </div>
      </div>

      <div className="w-full h-1.5 rounded-full bg-slate-100 mb-8 overflow-hidden">
        <div className="h-full rounded-full transition-all duration-300" style={{ width: `${(idx / order.length) * 100}%`, backgroundColor: '#f59e0b' }} />
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 card-shadow-lg p-8 sm:p-10 text-center mb-6 animate-pop" key={current.id}>
        <PosTag pos={current.pos} />
        <h3 className="font-display font-extrabold text-3xl sm:text-4xl letter-tighter text-slate-900 mt-4">{current.word}</h3>
        <p className="text-sm text-slate-400 mt-2">Which definition matches?</p>
      </div>

      <div className="grid grid-cols-1 gap-3">
        {options.map((opt, i) => {
          const isCorrect = opt === current.definition;
          let styleCls = "border-slate-200 bg-white hover:border-slate-300 text-slate-700";
          if (selected) {
            if (opt === selected && isCorrect) styleCls = "border-emerald-400 bg-emerald-50 text-emerald-700";
            else if (opt === selected && !isCorrect) styleCls = "border-red-400 bg-red-50 text-red-700";
            else if (isCorrect) styleCls = "border-emerald-300 bg-emerald-50/60 text-emerald-700";
            else styleCls = "border-slate-200 bg-white text-slate-400";
          }
          return (
            <button
              key={i}
              onClick={() => handleSelect(opt)}
              disabled={!!selected}
              className={classNames("btn-press focus-ring text-left px-5 py-4 rounded-xl border text-sm font-medium leading-relaxed transition-colors", styleCls)}
            >
              {opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function TestMode({ setObj, onUpdateStatus, onExit }) {
  const questions = useMemo(() => shuffleArray(setObj.words).slice(0, Math.min(10, setObj.words.length)).map((w) => ({
    word: w,
    options: buildMcOptions(setObj, w, setObj.words),
  })), [setObj]);

  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);

  function selectAnswer(wordId, opt) {
    if (submitted) return;
    setAnswers((a) => ({ ...a, [wordId]: opt }));
  }

  function handleSubmit() {
    setSubmitted(true);
    questions.forEach((q) => {
      const chosen = answers[q.word.id];
      const correct = chosen === q.word.definition;
      onUpdateStatus(q.word.id, correct ? "mastered" : "learning");
    });
  }

  const score = submitted ? questions.filter((q) => answers[q.word.id] === q.word.definition).length : 0;
  const answeredCount = Object.keys(answers).length;

  return (
    <div className="max-w-2xl mx-auto px-5 py-8 pb-16">
      <div className="flex items-center justify-between mb-7">
        <button onClick={onExit} className="btn-press focus-ring inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800 rounded-lg px-2 py-1 -ml-2">
          <IconChevronLeft className="w-4 h-4" /> Back
        </button>
        {submitted ? (
          <span className="text-sm font-extrabold" style={{color:'#10b981'}}>{score}/{questions.length} correct</span>
        ) : (
          <span className="text-sm font-semibold text-slate-500">{answeredCount}/{questions.length} answered</span>
        )}
      </div>

      <div className="mb-8">
        <h2 className="font-display font-extrabold text-2xl letter-tighter text-slate-900 mb-1.5">Set {setObj.index} test</h2>
        <p className="text-slate-500 text-sm">Choose the correct definition for each word, then submit.</p>
      </div>

      <div className="space-y-5">
        {questions.map((q, qi) => {
          const chosen = answers[q.word.id];
          return (
            <div key={q.word.id} className="bg-white rounded-2xl border border-slate-200 card-shadow p-5 animate-in" style={{animationDelay:`${qi*40}ms`}}>
              <div className="flex items-center gap-2 mb-4">
                <span className="w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs font-bold flex items-center justify-center">{qi + 1}</span>
                <span className="font-display font-bold text-slate-900">{q.word.word}</span>
                <PosTag pos={q.word.pos} />
              </div>
              <div className="grid grid-cols-1 gap-2">
                {q.options.map((opt, oi) => {
                  const isCorrect = opt === q.word.definition;
                  let cls = "border-slate-200 bg-white hover:border-slate-300 text-slate-700";
                  if (submitted) {
                    if (isCorrect) cls = "border-emerald-300 bg-emerald-50 text-emerald-700";
                    else if (opt === chosen) cls = "border-red-300 bg-red-50 text-red-700";
                    else cls = "border-slate-200 bg-white text-slate-400";
                  } else if (opt === chosen) {
                    cls = "border-blue-500 bg-blue-50 text-blue-700";
                  }
                  return (
                    <button
                      key={oi}
                      onClick={() => selectAnswer(q.word.id, opt)}
                      disabled={submitted}
                      className={classNames("btn-press focus-ring text-left px-4 py-3 rounded-xl border text-sm leading-relaxed", cls)}
                    >
                      {opt}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      <div className="mt-8 flex justify-center">
        {!submitted ? (
          <button
            onClick={handleSubmit}
            disabled={answeredCount < questions.length}
            className={classNames(
              "btn-press focus-ring px-8 py-3.5 rounded-xl text-sm font-bold transition-colors",
              answeredCount < questions.length
                ? "bg-slate-100 text-slate-400 cursor-not-allowed"
                : "bg-blue-600 text-white hover:bg-blue-700 shadow-sm shadow-blue-600/30"
            )}
          >
            Submit test
          </button>
        ) : (
          <button onClick={onExit} className="btn-press focus-ring px-8 py-3.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-700">
            Back to set
          </button>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Mock exam: SAT Practice Test #6 (College Board, paper/linear format)
// ---------------------------------------------------------------------------
const MOCK_BASE = "sat-test-6";
const MOCK_STATE_KEY = "vocabify_mock6_state_v1";
const MOCK_HIST_KEY = "vocabify_mock6_history_v1";
const MOCK_MODULES = [
  { id: "rw1", section: "Reading and Writing", label: "Module 1", n: 33, paper: 39, std: 32 },
  { id: "rw2", section: "Reading and Writing", label: "Module 2", n: 33, paper: 39, std: 32 },
  { id: "m1", section: "Math", label: "Module 1", n: 27, paper: 43, std: 35 },
  { id: "m2", section: "Math", label: "Module 2", n: 27, paper: 43, std: 35 },
];
const MOCK_KEYS = {"rw1": "DBBDDABBDDAAACBDDBACDDDCBDDCCBABC", "rw2": "CDCBBCDCCCCCCDDBADCAACBADBDABCDBC", "m1": "ADDDA##DBBAB##BCDDD##DACDA#", "m2": "BABAB##BAADC##BADBA##BADAA#"};
const MOCK_SPR = {"m1-6": "31", "m1-7": "11", "m1-13": "1/2", "m1-14": "15/2", "m1-20": "189/5", "m1-21": "-24", "m1-27": "54", "m2-6": "6", "m2-7": "10", "m2-13": "774", "m2-14": "5", "m2-20": "7/24", "m2-21": "1677", "m2-27": "-28"};


function mockMod(id) { return MOCK_MODULES.find((m) => m.id === id); }
function mockIsSpr(id, n) { return MOCK_KEYS[id][n - 1] === "#"; }
function mockParseNum(s) {
  s = String(s).trim().replace(/,/g, "").replace(/\s+/g, "");
  if (!s) return NaN;
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s);
  const m = s.match(/^(-?\d+)\/(\d+)$/);
  if (m && Number(m[2]) !== 0) return Number(m[1]) / Number(m[2]);
  return NaN;
}
function mockIsCorrect(id, n, ans) {
  if (ans == null || ans === "") return false;
  if (!mockIsSpr(id, n)) return ans === MOCK_KEYS[id][n - 1];
  const v = mockParseNum(ans);
  if (isNaN(v)) return false;
  const key = MOCK_SPR[id + "-" + n];
  const t = mockParseNum(key);
  if (key === "7/24") return Math.abs(v - t) < 0.0006; // .2916 / .2917 / .292 accepted
  return Math.abs(v - t) < 1e-7;
}
function mockCorrectLabel(id, n) {
  return mockIsSpr(id, n) ? MOCK_SPR[id + "-" + n] : MOCK_KEYS[id][n - 1];
}
function mockScore(modId, answers) {
  const m = mockMod(modId);
  let c = 0;
  for (let n = 1; n <= m.n; n++) if (mockIsCorrect(modId, n, answers[modId + "-" + n])) c++;
  return { correct: c, total: m.n };
}
function mockLoad() {
  try { const r = localStorage.getItem(MOCK_STATE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function mockSave(s) { try { localStorage.setItem(MOCK_STATE_KEY, JSON.stringify(s)); } catch (e) {} }
function mockLoadHist() {
  try { const r = localStorage.getItem(MOCK_HIST_KEY); return r ? JSON.parse(r) : []; } catch (e) { return []; }
}
function mockFmt(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(t / 60), s = t % 60;
  return m + ":" + String(s).padStart(2, "0");
}
function mockSummary() {
  const s = mockLoad();
  if (!s || s.phase === "intro" || !s.plan) return null;
  return s;
}

function IconFlag(props) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
      <path d="M4 22V4M4 4h13l-2 4 2 4H4" />
    </svg>
  );
}

function MockImg({ src, alt, className }) {

function MockModal({ children, onClose, wide }) {

      <div className={classNames("bg-white rounded-2xl shadow-xl max-h-[90vh] overflow-auto p-6 w-full", wide ? "max-w-3xl" : "max-w-md")} onClick={(e) => e.stopPropagation()}>
        {children}
      </div>

}

function MockExam({ onExit }) {
  const [st, setSt] = useState(() => {
    const s = mockLoad();
    if (!s || (s.phase !== "intro" && !s.plan)) return { phase: "intro" };
    if (s.phase === "module" && s.timing !== "none" && s.left != null) return { ...s, endsAt: Date.now() + s.left, left: null };
    if (s.phase === "break" && s.breakLeft != null) return { ...s, breakEnds: Date.now() + s.breakLeft, breakLeft: null };
    return s;
  });
  const [now, setNow] = useState(Date.now());
  const [modal, setModal] = useState(null); // 'nav' | 'ref' | 'submit' | 'exit' | 'reset'
  const [hideTimer, setHideTimer] = useState(false);
  const [hist, setHist] = useState(() => mockLoadHist());
  const stRef = useRef(st);
  stRef.current = st;

  useEffect(() => {
    mockSave({
      ...st,
      left: st.phase === "module" && st.endsAt ? Math.max(0, st.endsAt - Date.now()) : null,
      breakLeft: st.phase === "break" && st.breakEnds ? Math.max(0, st.breakEnds - Date.now()) : null,
    });
  }, [st]);
  useEffect(() => () => {
    const s = stRef.current;
    mockSave({
      ...s,
      left: s.phase === "module" && s.endsAt ? Math.max(0, s.endsAt - Date.now()) : null,
      breakLeft: s.phase === "break" && s.breakEnds ? Math.max(0, s.breakEnds - Date.now()) : null,
    });
  }, []);
  useEffect(() => {
    if (st.phase === "module") {
      const m = mockMod(st.plan[st.pi]);
      if (st.cur < m.n) { const im = new Image(); im.src = MOCK_BASE + "/q/" + m.id + "-" + String(st.cur + 1).padStart(2, "0") + ".webp"; }
    }
  }, [st.phase, st.cur, st.pi]);
  useEffect(() => { window.scrollTo({ top: 0 }); }, [st.phase, st.pi]);

  // Clock tick + resume of paused timers
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 500);
    return () => clearInterval(id);
  }, []);
  // Save remaining time periodically so a refresh doesn't eat the clock
  useEffect(() => {
    const id = setInterval(() => {
      const s = stRef.current;
      if (s.phase === "module" && s.endsAt) {
        try { localStorage.setItem(MOCK_STATE_KEY, JSON.stringify({ ...s, left: Math.max(0, s.endsAt - Date.now()) })); } catch (e) {}
      } else if (s.phase === "break" && s.breakEnds) {
        try { localStorage.setItem(MOCK_STATE_KEY, JSON.stringify({ ...s, breakLeft: Math.max(0, s.breakEnds - Date.now()) })); } catch (e) {}
      }
    }, 3000);
    return () => clearInterval(id);
  }, []);

  const modId = st.phase === "module" ? st.plan[st.pi] : null;
  const mod = modId ? mockMod(modId) : null;
  const remaining = st.phase === "module" && st.endsAt ? st.endsAt - now : null;

  function update(patch) { setSt((s) => ({ ...s, ...patch })); }

  function begin(plan, mode, timing) {
    const first = mockMod(plan[0]);
    setSt({
      phase: "module", mode, plan, pi: 0, timing, cur: 1,
      answers: {}, flags: {}, struck: {}, saved: false,
      endsAt: timing === "none" ? null : Date.now() + (timing === "std" ? first.std : first.paper) * 60000,
      startedAt: Date.now(),
    });
    setModal(null);
  }

  function startModule(pi, s) {
    const m = mockMod(s.plan[pi]);
    return {
      ...s, phase: "module", pi, cur: 1,
      endsAt: s.timing === "none" ? null : Date.now() + (s.timing === "std" ? m.std : m.paper) * 60000,
      breakEnds: null,
    };
  }

  function finish(s) {
    const scores = {};
    s.plan.forEach((id) => { scores[id] = mockScore(id, s.answers); });
    const entry = { date: Date.now(), mode: s.mode, plan: s.plan, scores };
    const h = [entry, ...mockLoadHist()].slice(0, 30);
    try { localStorage.setItem(MOCK_HIST_KEY, JSON.stringify(h)); } catch (e) {}
    setHist(h);
    return { ...s, phase: "results", endsAt: null, breakEnds: null, saved: true };
  }

  function submitModule() {
    setModal(null);
    setSt((s) => {
      if (s.pi < s.plan.length - 1) {
        const cur = s.plan[s.pi], nxt = s.plan[s.pi + 1];
        if (cur === "rw2" && nxt === "m1" && s.mode === "full") {
          return { ...s, phase: "break", pi: s.pi + 1, endsAt: null, breakEnds: s.timing === "none" ? null : Date.now() + 10 * 60000 };
        }
        return startModule(s.pi + 1, s);
      }
      return finish(s);
    });
  }

  // auto-submit when the clock runs out
  useEffect(() => {
    if (st.phase === "module" && remaining != null && remaining <= 0) submitModule();
  }, [remaining, st.phase]);

  useEffect(() => {
    if (st.phase === "break" && st.breakEnds && st.breakEnds - now <= 0) setSt((x) => startModule(x.pi, x));
  }, [now, st.phase]);

  function setAnswer(val) {
    const k = modId + "-" + st.cur;
    setSt((s) => ({ ...s, answers: { ...s.answers, [k]: val } }));
  }
  function toggle(field, val) {
    const k = modId + "-" + st.cur;
    setSt((s) => {
      const cur = { ...(s[field] || {}) };
      if (field === "struck") {
        const arr = new Set(cur[k] || []);
        arr.has(val) ? arr.delete(val) : arr.add(val);
        cur[k] = Array.from(arr);
      } else {
        cur[k] = !cur[k];
      }
      return { ...s, [field]: cur };
    });
  }
  function go(n) { if (mod && n >= 1 && n <= mod.n) update({ cur: n }); }

  // keyboard shortcuts during a module
  useEffect(() => {
    if (st.phase !== "module") return;
    function onKey(e) {
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || modal) return;
      const k = e.key.toUpperCase();
      if (e.key === "ArrowRight") go(st.cur + 1);
      else if (e.key === "ArrowLeft") go(st.cur - 1);
      else if (["A", "B", "C", "D"].includes(k) && !mockIsSpr(modId, st.cur)) setAnswer(k);
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  // ---------------------------- INTRO ----------------------------
  if (st.phase === "intro") {
    const [timing, setTiming] = [st.timingChoice || "paper", (t) => update({ timingChoice: t })];
    return (
      <div className="max-w-4xl mx-auto px-5 sm:px-8 py-10 animate-in">
        <h1 className="font-display font-extrabold text-[28px] sm:text-[32px] letter-tighter text-slate-900 mb-1">SAT Practice Test #6</h1>
        <p className="text-slate-500 text-[15px] mb-6">Official College Board practice test (linear format). 98 questions: Reading &amp; Writing (2 × 33) and Math (2 × 27). Your answers are checked against the official answer key, with the College Board explanations in review.</p>

        <div className="bg-white rounded-2xl border border-slate-200 p-6 mb-6">
          <p className="text-sm font-semibold text-slate-700 mb-3">Timing</p>
          <div className="grid sm:grid-cols-3 gap-3">
            {[
              ["paper", "Printed-test times", "39 min Reading & Writing · 43 min Math (per module)"],
              ["std", "Standard digital times", "32 min Reading & Writing · 35 min Math (per module)"],
              ["none", "Untimed", "No clock. Good for learning from mistakes"],
            ].map(([id, t, d]) => (
              <button key={id} onClick={() => setTiming(id)} className={classNames("text-left rounded-xl border p-4 transition focus-ring", timing === id ? "border-blue-600 bg-blue-50 ring-1 ring-blue-600" : "border-slate-200 hover:border-slate-300")}>
                <p className="font-semibold text-slate-900 text-sm">{t}</p>
                <p className="text-xs text-slate-500 mt-1">{d}</p>
              </button>
            ))}
          </div>
          <div className="mt-5 flex flex-wrap gap-3">
            <button onClick={() => begin(["rw1", "rw2", "m1", "m2"], "full", timing)} className="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 shadow-sm focus-ring">Start full test</button>
          </div>
          <p className="text-xs text-slate-400 mt-3">A 10-minute break is offered between Reading &amp; Writing and Math. Calculator is allowed in Math (Desmos link inside).</p>
        </div>

        <div className="bg-white rounded-2xl border border-slate-200 p-6 mb-6">
          <p className="text-sm font-semibold text-slate-700 mb-3">Or practice one module</p>
          <div className="grid sm:grid-cols-2 gap-3">
            {MOCK_MODULES.map((m) => (
              <button key={m.id} onClick={() => begin([m.id], "single", timing)} className="text-left rounded-xl border border-slate-200 p-4 hover:border-blue-400 hover:bg-blue-50/40 transition focus-ring">
                <p className="font-semibold text-slate-900 text-sm">{m.section} · {m.label}</p>
                <p className="text-xs text-slate-500 mt-1">{m.n} questions</p>
              </button>
            ))}
          </div>
        </div>

        {hist.length > 0 && (
          <div className="bg-white rounded-2xl border border-slate-200 p-6">
            <p className="text-sm font-semibold text-slate-700 mb-3">Past attempts</p>
            <div className="divide-y divide-slate-100">
              {hist.map((h, i) => (
                <div key={i} className="py-2.5 flex flex-wrap items-center justify-between gap-2 text-sm">
                  <span className="text-slate-500">{new Date(h.date).toLocaleString()} · {h.mode === "full" ? "Full test" : "Single module"}</span>
                  <span className="text-slate-800 font-medium">
                    {h.plan.map((id) => { const m = mockMod(id); return (m.section === "Math" ? "Math " : "R&W ") + m.label.replace("Module ", "M") + ": " + h.scores[id].correct + "/" + h.scores[id].total; }).join("  ·  ")}
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}
        <p className="text-xs text-slate-400 mt-6">For an official scaled score, College Board scores this test at sat.org/digital-practice.</p>
      </div>
    );
  }

  // ---------------------------- BREAK ----------------------------
  if (st.phase === "break") {
    const left = st.breakEnds ? st.breakEnds - now : null;
    return (
      <div className="max-w-xl mx-auto px-5 py-16 text-center animate-in">
        <h1 className="font-display font-extrabold text-[28px] text-slate-900 mb-2">Break</h1>
        <p className="text-slate-500 mb-6">Reading &amp; Writing is finished. Math starts next.</p>
        {left != null && <p className="font-display font-bold text-5xl text-slate-900 mb-6">{mockFmt(left)}</p>}
        <button onClick={() => setSt((s) => startModule(s.pi, s))} className="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 focus-ring">Start Math now</button>
      </div>
    );
  }

  // ---------------------------- MODULE ----------------------------
  if (st.phase === "module") {
    const n = st.cur;
    const k = modId + "-" + n;
    const ans = st.answers[k] || "";
    const spr = mockIsSpr(modId, n);
    const struck = st.struck[k] || [];
    const flagged = !!st.flags[k];
    const answered = Array.from({ length: mod.n }, (_, i) => !!st.answers[modId + "-" + (i + 1)]);
    const unanswered = answered.filter((a) => !a).length;
    const isMath = mod.section === "Math";
    const low = remaining != null && remaining < 5 * 60000;
    const imgSrc = MOCK_BASE + "/q/" + modId + "-" + String(n).padStart(2, "0") + ".webp";

    return (
      <div className="pb-24">
        <div className="sticky top-16 z-20 bg-white border-b border-slate-200">
          <div className="max-w-6xl mx-auto px-5 sm:px-8 h-14 flex items-center justify-between gap-3">
            <div className="min-w-0">
              <p className="text-sm font-bold text-slate-900 truncate">{mod.section} · {mod.label}</p>
              <p className="text-xs text-slate-500">Question {n} of {mod.n}</p>
            </div>
            <div className="flex items-center gap-3">
              {remaining != null && (
                <button onClick={() => setHideTimer(!hideTimer)} className={classNames("flex items-center gap-1.5 text-sm font-semibold px-3 py-1.5 rounded-full focus-ring", low ? "bg-rose-50 text-rose-700" : "bg-slate-100 text-slate-700")} title="Click to show or hide the timer">
                  <IconClock className="w-4 h-4" />
                  {hideTimer ? "Show time" : mockFmt(remaining)}
                </button>
              )}
              {isMath && (
                <>
                  <a href="https://www.desmos.com/calculator" target="_blank" rel="noreferrer" className="hidden sm:inline text-sm font-medium text-slate-600 hover:text-slate-900 px-2">Calculator ↗</a>
                  <button onClick={() => setModal("ref")} className="hidden sm:inline text-sm font-medium text-slate-600 hover:text-slate-900 px-2 focus-ring rounded">Reference</button>
                </>
              )}
              <button onClick={() => setModal("exit")} className="text-sm font-medium text-slate-500 hover:text-slate-800 px-2 focus-ring rounded">Save &amp; exit</button>
            </div>
          </div>
        </div>

        <div className="max-w-6xl mx-auto px-5 sm:px-8 pt-6 grid lg:grid-cols-[1fr_300px] gap-6 items-start">
          <div className="bg-white rounded-2xl border border-slate-200 p-5 sm:p-7 overflow-x-auto">
            <MockImg key={imgSrc} src={imgSrc} alt={"Question " + n} />
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 p-5 lg:sticky lg:top-36">
            <div className="flex items-center justify-between mb-4">
              <p className="text-sm font-semibold text-slate-700">Your answer</p>
              <button onClick={() => toggle("flags")} className={classNames("flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full focus-ring", flagged ? "bg-amber-100 text-amber-800" : "bg-slate-100 text-slate-600 hover:bg-slate-200")}>
                <IconFlag className="w-3.5 h-3.5" />{flagged ? "Marked for review" : "Mark for review"}
              </button>
            </div>

            {!spr ? (
              <div className="grid grid-cols-4 gap-2">
                {["A", "B", "C", "D"].map((L) => {
                  const sel = ans === L, s = struck.includes(L);
                  return (
                    <div key={L} className="flex flex-col items-center gap-1">
                      <button onClick={() => setAnswer(sel ? "" : L)} className={classNames("w-full aspect-square rounded-xl border-2 font-display font-bold text-xl transition focus-ring", sel ? "bg-blue-600 border-blue-600 text-white" : "border-slate-300 text-slate-700 hover:border-blue-400", s && !sel && "opacity-40 line-through")}>{L}</button>
                      <button onClick={() => toggle("struck", L)} className="text-[11px] text-slate-400 hover:text-slate-700" title="Cross out this choice">{s ? "restore" : "cross out"}</button>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div>
                <input
                  value={ans}
                  onChange={(e) => setAnswer(e.target.value.slice(0, 8))}
                  inputMode="text"
                  placeholder="Type your answer"
                  className="w-full border-2 border-slate-300 rounded-xl px-4 py-3 text-lg font-semibold focus:outline-none focus:border-blue-600"
                />
                <p className="text-xs text-slate-500 mt-2">Student-produced response. Enter a number, decimal, or fraction like 7/2. Up to 5 characters (6 if negative). No % $ or commas.</p>
              </div>
            )}

            <div className="mt-5 flex items-center gap-2">
              <button onClick={() => go(n - 1)} disabled={n === 1} className="flex-1 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold text-slate-700 disabled:opacity-40 hover:bg-slate-50 focus-ring">Back</button>
              {n < mod.n ? (
                <button onClick={() => go(n + 1)} className="flex-1 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 focus-ring">Next</button>
              ) : (
                <button onClick={() => setModal("submit")} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 focus-ring">Finish module</button>
              )}
            </div>
            <button onClick={() => setModal("nav")} className="mt-3 w-full py-2 rounded-xl bg-slate-100 text-sm font-medium text-slate-700 hover:bg-slate-200 focus-ring">All questions ({unanswered} unanswered)</button>
            {isMath && (
              <div className="mt-3 flex gap-2 sm:hidden">
                <a href="https://www.desmos.com/calculator" target="_blank" rel="noreferrer" className="flex-1 text-center py-2 rounded-xl border border-slate-200 text-sm text-slate-600">Calculator ↗</a>
                <button onClick={() => setModal("ref")} className="flex-1 py-2 rounded-xl border border-slate-200 text-sm text-slate-600">Reference</button>
              </div>
            )}
            <p className="text-[11px] text-slate-400 mt-4">Shortcuts: A–D to answer, ← → to move.</p>
          </div>
        </div>

        {modal === "nav" && (
          <MockModal onClose={() => setModal(null)}>
            <p className="font-semibold text-slate-900 mb-1">{mod.section} · {mod.label}</p>
            <p className="text-xs text-slate-500 mb-4">Filled = answered, amber flag = marked for review.</p>
            <div className="grid grid-cols-6 gap-2 mb-5">
              {Array.from({ length: mod.n }, (_, i) => i + 1).map((q) => {
                const a = !!st.answers[modId + "-" + q], f = !!st.flags[modId + "-" + q];
                return (
                  <button key={q} onClick={() => { go(q); setModal(null); }} className={classNames("relative aspect-square rounded-lg text-sm font-semibold border-2 focus-ring", a ? "bg-blue-600 border-blue-600 text-white" : "border-dashed border-slate-300 text-slate-600", q === n && "ring-2 ring-offset-1 ring-slate-900")}>
                    {q}
                    {f && <IconFlag className="w-3 h-3 absolute -top-1 -right-1 text-amber-500 fill-amber-400" />}
                  </button>
                );
              })}
            </div>
            <div className="flex gap-2">
              <button onClick={() => setModal(null)} className="flex-1 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Close</button>
              <button onClick={() => setModal("submit")} className="flex-1 py-2 rounded-xl bg-emerald-600 text-white text-sm font-semibold">Finish module</button>
            </div>
          </MockModal>
        )}
        {modal === "submit" && (
          <MockModal onClose={() => setModal(null)}>
            <p className="font-semibold text-slate-900 mb-2">Submit this module?</p>
            <p className="text-sm text-slate-600 mb-1">{unanswered === 0 ? "You answered every question." : `You have ${unanswered} unanswered question${unanswered === 1 ? "" : "s"}.`}</p>
            <p className="text-sm text-slate-500 mb-5">You can't come back to this module after submitting.</p>
            <div className="flex gap-2">
              <button onClick={() => setModal(null)} className="flex-1 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Keep working</button>
              <button onClick={submitModule} className="flex-1 py-2 rounded-xl bg-emerald-600 text-white text-sm font-semibold">Submit</button>
            </div>
          </MockModal>
        )}
        {modal === "exit" && (
          <MockModal onClose={() => setModal(null)}>
            <p className="font-semibold text-slate-900 mb-2">Save and exit?</p>
            <p className="text-sm text-slate-600 mb-5">Your answers and the time left are saved on this device. You can resume from the mock exam card.</p>
            <div className="flex gap-2">
              <button onClick={() => setModal(null)} className="flex-1 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Stay</button>
              <button onClick={() => { const s = stRef.current; mockSave({ ...s, left: s.endsAt ? Math.max(0, s.endsAt - Date.now()) : null }); onExit(); }} className="flex-1 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold">Save &amp; exit</button>
            </div>
          </MockModal>
        )}
        {modal === "ref" && (
          <MockModal onClose={() => setModal(null)} wide>
            <div className="flex items-center justify-between mb-3">
              <p className="font-semibold text-slate-900">Math reference sheet</p>
              <button onClick={() => setModal(null)} className="text-slate-400 hover:text-slate-700"><IconX className="w-5 h-5" /></button>
            </div>
            <img src={MOCK_BASE + "/reference.webp"} alt="Math reference sheet" className="w-full" />
          </MockModal>
        )}
      </div>
    );
  }

  // ---------------------------- RESULTS / REVIEW ----------------------------
  const plan = st.plan;
  const scores = {};
  plan.forEach((id) => { scores[id] = mockScore(id, st.answers); });
  const sum = (ids) => ids.filter((i) => plan.includes(i)).reduce((a, i) => ({ c: a.c + scores[i].correct, t: a.t + scores[i].total }), { c: 0, t: 0 });
  const rw = sum(["rw1", "rw2"]), ma = sum(["m1", "m2"]);
  const rv = st.rv || { mod: plan[0], n: 1, filter: "all", showExp: false };
  const setRv = (p) => update({ rv: { ...rv, ...p } });
  const rvMod = mockMod(rv.mod);
  const key = rv.mod + "-" + rv.n;
  const yours = st.answers[key];
  const ok = mockIsCorrect(rv.mod, rv.n, yours);
  const listAll = Array.from({ length: rvMod.n }, (_, i) => i + 1);
  const list = listAll.filter((q) => {
    if (rv.filter === "wrong") return !mockIsCorrect(rv.mod, q, st.answers[rv.mod + "-" + q]);
    if (rv.filter === "flagged") return !!st.flags[rv.mod + "-" + q];
    return true;
  });
  const pad = String(rv.n).padStart(2, "0");

  return (
    <div className="max-w-6xl mx-auto px-5 sm:px-8 py-10 animate-in">
      <div className="flex flex-wrap items-end justify-between gap-3 mb-6">
        <div>
          <h1 className="font-display font-extrabold text-[28px] letter-tighter text-slate-900">Results</h1>
          <p className="text-slate-500 text-sm">SAT Practice Test #6 · raw scores (correct answers). For a scaled score use College Board's scoring at sat.org/digital-practice.</p>
        </div>
        <div className="flex gap-2">
          <button onClick={() => { setSt({ phase: "intro" }); }} className="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold hover:bg-slate-50 focus-ring">New attempt</button>
          <button onClick={onExit} className="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold focus-ring">Done</button>
        </div>
      </div>

      <div className="grid sm:grid-cols-3 gap-4 mb-6">
        {rw.t > 0 && <div className="bg-white rounded-2xl border border-slate-200 p-5"><p className="text-xs text-slate-500">Reading &amp; Writing</p><p className="font-display font-extrabold text-3xl text-slate-900">{rw.c}<span className="text-slate-400 text-xl">/{rw.t}</span></p></div>}
        {ma.t > 0 && <div className="bg-white rounded-2xl border border-slate-200 p-5"><p className="text-xs text-slate-500">Math</p><p className="font-display font-extrabold text-3xl text-slate-900">{ma.c}<span className="text-slate-400 text-xl">/{ma.t}</span></p></div>}
        <div className="bg-white rounded-2xl border border-slate-200 p-5"><p className="text-xs text-slate-500">By module</p>
          <div className="text-sm text-slate-700 mt-1 space-y-0.5">
            {plan.map((id) => <p key={id}>{mockMod(id).section === "Math" ? "Math" : "R&W"} {mockMod(id).label}: <b>{scores[id].correct}/{scores[id].total}</b></p>)}
          </div>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6">
        <div className="flex flex-wrap items-center gap-2 mb-4">
          {plan.map((id) => (
            <button key={id} onClick={() => setRv({ mod: id, n: 1, showExp: false })} className={classNames("px-3 py-1.5 rounded-full text-sm font-semibold focus-ring", rv.mod === id ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-700 hover:bg-slate-200")}>
              {mockMod(id).section === "Math" ? "Math" : "R&W"} {mockMod(id).label.replace("Module ", "M")}
            </button>
          ))}
          <span className="mx-1 text-slate-300">|</span>
          {[["all", "All"], ["wrong", "Incorrect / blank"], ["flagged", "Marked"]].map(([f, l]) => (
            <button key={f} onClick={() => setRv({ filter: f })} className={classNames("px-3 py-1.5 rounded-full text-xs font-semibold focus-ring", rv.filter === f ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200")}>{l}</button>
          ))}
        </div>

        <div className="flex flex-wrap gap-1.5 mb-5">
          {list.length === 0 && <p className="text-sm text-slate-500">Nothing matches this filter.</p>}
          {list.map((q) => {
            const a = st.answers[rv.mod + "-" + q];
            const good = mockIsCorrect(rv.mod, q, a);
            return (
              <button key={q} onClick={() => setRv({ n: q, showExp: false })} className={classNames("w-9 h-9 rounded-lg text-sm font-semibold border-2 focus-ring", good ? "bg-emerald-50 border-emerald-300 text-emerald-800" : a ? "bg-rose-50 border-rose-300 text-rose-800" : "bg-slate-50 border-slate-200 text-slate-500", q === rv.n && "ring-2 ring-offset-1 ring-slate-900")}>{q}</button>
            );
          })}
        </div>

        <div className="grid lg:grid-cols-[1fr_320px] gap-6 items-start">
          <div className="border border-slate-200 rounded-xl p-4 overflow-x-auto">
            <MockImg key={"rq" + key} src={MOCK_BASE + "/q/" + rv.mod + "-" + pad + ".webp"} alt={"Question " + rv.n} />
          </div>
          <div>
            <div className={classNames("rounded-xl p-4 mb-3", ok ? "bg-emerald-50 text-emerald-900" : "bg-rose-50 text-rose-900")}>
              <p className="font-semibold text-sm">Question {rv.n} · {ok ? "Correct" : yours ? "Incorrect" : "Not answered"}</p>
              <p className="text-sm mt-1">Your answer: <b>{yours || "—"}</b></p>
              <p className="text-sm">Correct answer: <b>{mockCorrectLabel(rv.mod, rv.n)}</b></p>
              {rv.mod && rv.mod.startsWith("m") && mockIsSpr(rv.mod, rv.n) && MOCK_SPR[key] === "7/24" && <p className="text-xs mt-1">Accepted: 7/24, .2916, .2917, .292</p>}
            </div>
            <div className="flex gap-2 mb-3">
              <button onClick={() => { const i = listAll.indexOf(rv.n); if (i > 0) setRv({ n: listAll[i - 1], showExp: false }); }} className="flex-1 py-2 rounded-xl border border-slate-300 text-sm font-semibold hover:bg-slate-50">Prev</button>
              <button onClick={() => { const i = listAll.indexOf(rv.n); if (i < listAll.length - 1) setRv({ n: listAll[i + 1], showExp: false }); }} className="flex-1 py-2 rounded-xl border border-slate-300 text-sm font-semibold hover:bg-slate-50">Next</button>
            </div>
            <button onClick={() => setRv({ showExp: !rv.showExp })} className="w-full py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 focus-ring">{rv.showExp ? "Hide explanation" : "Show explanation"}</button>
          </div>
        </div>

        {rv.showExp && (
          <div className="mt-5 border border-blue-100 bg-blue-50/30 rounded-xl p-4 overflow-x-auto">
            <MockImg key={"ex" + key} src={MOCK_BASE + "/e/" + rv.mod + "-" + pad + ".webp"} alt={"Explanation for question " + rv.n} />
          </div>
        )}
      </div>
    </div>
  );
}


function App() {
  const [view, setView] = useState({ screen: "dashboard" });
  const [progress, setProgress] = useState(() => loadProgress());

  useEffect(() => { saveProgress(progress); }, [progress]);

  const updateStatus = useCallback((wordId, status) => {
    recordActivity();
    setProgress((p) => ({ ...p, [wordId]: status }));
  }, []);

  const findPackage = (pkgId) => RAW_DATA.packages.find((p) => p.id === pkgId);

  function startReview() {
    const words = [];
    RAW_DATA.packages.forEach((p) => p.sets.forEach((st) => st.words.forEach((w) => { if (progress[w.id] === "learning") words.push(w); })));
    if (!words.length) return;
    const picked = shuffleArray(words).slice(0, 20);
    setView({ screen: "study", pkgId: "review", mode: "flashcard", setObj: { id: "review", index: "Review", name: "Weak words review", words: picked } });
    window.scrollTo({ top: 0 });
  }
  function goDashboard() { setView({ screen: "dashboard" }); window.scrollTo({top:0}); }
  function openMock() { setView({ screen: "mock" }); window.scrollTo({top:0}); }
  function openPackage(pkgId) { setView({ screen: "setlist", pkgId }); window.scrollTo({top:0}); }
  function openSet(pkgId, setObj) { setView({ screen: "setoverview", pkgId, setObj }); window.scrollTo({top:0}); }
  function startMode(pkgId, setObj, mode) { setView({ screen: "study", pkgId, setObj, mode }); window.scrollTo({top:0}); }
  function backToSetlist(pkgId) { setView({ screen: "setlist", pkgId }); window.scrollTo({top:0}); }
  function backToOverview(pkgId, setObj) { setView({ screen: "setoverview", pkgId, setObj }); window.scrollTo({top:0}); }

  let breadcrumbs = null;
  if (view.screen === "mock") {
    breadcrumbs = [
      { label: "Packages", onClick: goDashboard },
      { label: "Mock exam", onClick: null },
    ];
  }
  if (view.screen === "setlist") {
    const pkg = findPackage(view.pkgId);
    breadcrumbs = [
      { label: "Packages", onClick: goDashboard },
      { label: pkg ? pkg.name : "", onClick: null },
    ];
  } else if (view.screen === "setoverview") {
    const pkg = findPackage(view.pkgId);
    breadcrumbs = [
      { label: "Packages", onClick: goDashboard },
      { label: pkg ? pkg.name : "", onClick: () => backToSetlist(view.pkgId) },
      { label: `Set ${view.setObj.index}`, onClick: null },
    ];
  } else if (view.screen === "study") {
    const pkg = findPackage(view.pkgId);
    const modeLabel = STUDY_MODES.find((m) => m.id === view.mode)?.label || "Study";
    breadcrumbs = [
      { label: "Packages", onClick: goDashboard },
      { label: pkg ? pkg.name : "", onClick: () => backToSetlist(view.pkgId) },
      { label: `Set ${view.setObj.index}`, onClick: () => backToOverview(view.pkgId, view.setObj) },
      { label: modeLabel, onClick: null },
    ];
  }

  if (view.screen === "study" && view.pkgId === "review") {
    breadcrumbs = [{ label: "Packages", onClick: goDashboard }, { label: "Weak words review", onClick: null }];
  }

  return (
    <div className="min-h-screen bg-noise-blue">
      <Header onLogoClick={goDashboard} breadcrumbs={breadcrumbs} />

      {view.screen === "dashboard" && (
        <Dashboard data={RAW_DATA} progress={progress} onOpenPackage={openPackage} onOpenMock={openMock} onReview={startReview} />
      )}

      {view.screen === "mock" && <MockExam onExit={goDashboard} />}

      {view.screen === "setlist" && (() => {
        const pkg = findPackage(view.pkgId);
        if (!pkg) return null;
        return <SetListView pkg={pkg} progress={progress} onOpenSet={(s) => openSet(pkg.id, s)} />;
      })()}

      {view.screen === "setoverview" && (
        <SetOverview
          setObj={view.setObj}
          progress={progress}
          onBack={() => backToSetlist(view.pkgId)}
          onStartMode={(mode) => startMode(view.pkgId, view.setObj, mode)}
        />
      )}

      {view.screen === "study" && view.mode === "flashcard" && (
        <FlashcardMode
          setObj={view.setObj}
          progress={progress}
          onUpdateStatus={updateStatus}
          onExit={() => (view.pkgId === "review" ? goDashboard() : backToOverview(view.pkgId, view.setObj))}
        />
      )}

      {view.screen === "study" && view.mode === "matching" && (
        <MatchingMode
          setObj={view.setObj}
          onExit={() => backToOverview(view.pkgId, view.setObj)}
        />
      )}

      {view.screen === "study" && view.mode === "speed" && (
        <SpeedMode
          setObj={view.setObj}
          onUpdateStatus={updateStatus}
          onExit={() => backToOverview(view.pkgId, view.setObj)}
        />
      )}

      {view.screen === "study" && view.mode === "test" && (
        <TestMode
          setObj={view.setObj}
          onUpdateStatus={updateStatus}
          onExit={() => backToOverview(view.pkgId, view.setObj)}
        />
      )}

      <footer className="max-w-6xl mx-auto px-5 sm:px-8 py-10 text-center">
        <p className="text-xs text-slate-400">Vocabify &middot; Vocabulary sourced from the Vocabook by @satashkent (3rd Edition) and the SAT 1200 word list &middot; Prepositions and transitions written for SAT Writing &amp; Language prep &middot; Standard English Conventions rules aligned with the Digital SAT's Boundaries and Form, Structure, and Sense skills (College Board Bluebook framework)</p>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
